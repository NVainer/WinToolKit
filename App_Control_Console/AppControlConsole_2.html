    '</div>',
    buttons:[{label:'Cancel'},{label:'Create policy',cls:'primary',keepOpen:true,onClick:h=>{
      const baseGuid=(h.querySelector('#tsGuid').value.trim())||(h.querySelector('#tsBase')?h.querySelector('#tsBase').value:'');
      if(!GUID_RX.test(baseGuid)){toast('Base policy GUID required','err');return false}
      const name=h.querySelector('#tsName').value.trim()||'Audit findings';
      const xml=buildTemplate('supplemental',{name,baseGuid});
      const p=openPolicyText(xml,name.replace(/[^\w.-]+/g,'_')+'.xml',null);
      if(!p)return false;
      let pub=0,hash=0;
      for(const it of open){
        const scen=it.scenario==='131'?131:12;
        const sig=it.signers[0];
        if(sig&&(sig.issTbs||sig.pubTbs)){
          const usingLeaf=!sig.issTbs;
          mAddSigner(p,{name:(sig.publisher||it.fileName),rootType:'TBS',rootValue:sig.issTbs||sig.pubTbs,
            publisher:usingLeaf?'':sig.publisher,
            attrib:it.meta.OriginalFileName?{FileName:it.meta.OriginalFileName,MinimumFileVersion:vvalid(it.meta.FileVersion)?it.meta.FileVersion:'0.0.0.0'}:null,
            scenarios:[{value:scen,decision:'allow'}],alsoCi:scen===12});
          pub++;
        }else if(it.hashes.sha256||it.hashes.sha1||it.hashes.flatSha256){
          if(it.hashes.sha256||it.hashes.flatSha256)mAddFileRule(p,{tag:'Allow',attrs:{FriendlyName:it.fileName+' Hash Sha256',Hash:it.hashes.sha256||it.hashes.flatSha256},scenarios:[scen]});
          if(it.hashes.sha1)mAddFileRule(p,{tag:'Allow',attrs:{FriendlyName:it.fileName+' Hash Sha1',Hash:it.hashes.sha1},scenarios:[scen]});
          hash++;
        }
        it.status='allowed';it.resolution='included in '+name;
      }
      afterEdit(p);
      closeModal();
      setView('dashboard');
      toast('Created '+name+': '+pub+' publisher rules, '+hash+' hash-allowed files. Review, validate, then save.','ok');
    }}],
    onOpen:h=>{const sel=h.querySelector('#tsBase');if(sel)sel.addEventListener('change',()=>{h.querySelector('#tsGuid').value=sel.value})}
  });
}
</script>
<script>
/* ============================================================
   CHUNK H — templates, validate, deploy, xml, diff, merge, boot
   ============================================================ */
function buildTemplate(kind,o){
  o=o||{};
  const g=guid(),name=o.name||'New policy';
  const base=o.baseGuid||g;
  const head='<?xml version="1.0" encoding="utf-8"?>\n<SiPolicy xmlns="urn:schemas-microsoft-com:sipolicy" PolicyType="'+(kind==='supplemental'?'Supplemental Policy':'Base Policy')+'">\n'+
  '  <VersionEx>1.0.0.0</VersionEx>\n'+
  '  <PlatformID>{2E07F7E4-194C-4D20-B7C9-6F44A6C5A234}</PlatformID>\n'+
  '  <PolicyID>'+g+'</PolicyID>\n'+
  '  <BasePolicyID>'+(kind==='supplemental'?base:g)+'</BasePolicyID>\n';
  const foot=(rules,ekus,fileRules,signers,scenarios,extra)=>
  '  <Rules>\n'+rules.map(r=>'    <Rule>\n      <Option>'+r+'</Option>\n    </Rule>').join('\n')+'\n  </Rules>\n'+
  '  <EKUs>'+(ekus||'')+'</EKUs>\n'+
  '  <FileRules>'+(fileRules?'\n'+fileRules+'\n  ':'')+'</FileRules>\n'+
  '  <Signers>'+(signers?'\n'+signers+'\n  ':'')+'</Signers>\n'+
  '  <SigningScenarios>\n'+scenarios+'\n  </SigningScenarios>\n'+
  '  <UpdatePolicySigners />\n'+
  '  <CiSigners />\n'+
  '  <HvciOptions>0</HvciOptions>\n'+
  (extra||'')+
  '  <Settings>\n'+
  '    <Setting Provider="PolicyInfo" Key="Information" ValueName="Name">\n      <Value>\n        <String>'+escA(name)+'</String>\n      </Value>\n    </Setting>\n'+
  '    <Setting Provider="PolicyInfo" Key="Information" ValueName="Id">\n      <Value>\n        <String>'+escA(new Date().toISOString().slice(0,10).replace(/-/g,''))+'</String>\n      </Value>\n    </Setting>\n'+
  '  </Settings>\n'+
  '</SiPolicy>\n';
  const scenBoth=(kernelInner,userInner)=>
  '    <SigningScenario Value="131" ID="ID_SIGNINGSCENARIO_DRIVERS_1" FriendlyName="Kernel mode signing scenario">\n'+
  '      <ProductSigners>'+(kernelInner?'\n'+kernelInner+'\n      ':'')+'</ProductSigners>\n'+
  '    </SigningScenario>\n'+
  '    <SigningScenario Value="12" ID="ID_SIGNINGSCENARIO_WINDOWS" FriendlyName="User mode signing scenario">\n'+
  '      <ProductSigners>'+(userInner?'\n'+userInner+'\n      ':'')+'</ProductSigners>\n'+
  '    </SigningScenario>';
  if(kind==='supplemental'){
    return head+foot(['Enabled:Unsigned System Integrity Policy'],'','','',scenBoth('',''),'');
  }
  const commonOpts=['Enabled:Unsigned System Integrity Policy','Enabled:UMCI','Enabled:Audit Mode','Enabled:Advanced Boot Options Menu','Enabled:Boot Audit On Failure','Enabled:Update Policy No Reboot','Enabled:Allow Supplemental Policies'];
  if(kind==='audit-base'||kind==='blocklist-base'){
    const denySeed=kind==='blocklist-base'?
      '    <Deny ID="ID_DENY_EXAMPLE_PFN" FriendlyName="Example: block App Installer package" PackageFamilyName="Microsoft.DesktopAppInstaller_8wekyb3d8bbwe" />':'';
    const fileRules=
    '    <Allow ID="ID_ALLOW_ALL_USER" FriendlyName="Allow all user mode" FileName="*" />\n'+
    '    <Allow ID="ID_ALLOW_ALL_KERNEL" FriendlyName="Allow all kernel mode" FileName="*" />'+(denySeed?'\n'+denySeed:'');
    return head+foot(commonOpts,'',fileRules,'',
      scenBoth('        <FileRulesRef>\n          <FileRuleRef RuleID="ID_ALLOW_ALL_KERNEL" />\n        </FileRulesRef>',
        '        <FileRulesRef>\n          <FileRuleRef RuleID="ID_ALLOW_ALL_USER" />\n'+(denySeed?'          <FileRuleRef RuleID="ID_DENY_EXAMPLE_PFN" />\n':'')+'        </FileRulesRef>'),'');
  }
  if(kind==='strict-base'){
    const ekus='\n    <EKU ID="ID_EKU_WINDOWS" Value="010A2B0601040182370A0306" FriendlyName="Windows System Component Verification" />\n'+
    '    <EKU ID="ID_EKU_WHQL" Value="010A2B0601040182370A0305" FriendlyName="WHQL" />\n  ';
    const signers=
    '    <Signer ID="ID_SIGNER_WINDOWS_PROD" Name="Microsoft Product Root 2010 (Windows EKU)">\n'+
    '      <CertRoot Type="Wellknown" Value="06" />\n      <CertEKU ID="ID_EKU_WINDOWS" />\n    </Signer>\n'+
    '    <Signer ID="ID_SIGNER_WHQL" Name="Microsoft Product Root 2010 (WHQL EKU)">\n'+
    '      <CertRoot Type="Wellknown" Value="06" />\n      <CertEKU ID="ID_EKU_WHQL" />\n    </Signer>\n'+
    '    <Signer ID="ID_SIGNER_STORE" Name="Microsoft Standard Root 2011">\n'+
    '      <CertRoot Type="Wellknown" Value="07" />\n    </Signer>';
    return head+foot(commonOpts.concat(['Required:WHQL']),ekus,'',signers,
      scenBoth('        <AllowedSigners>\n          <AllowedSigner SignerId="ID_SIGNER_WINDOWS_PROD" />\n          <AllowedSigner SignerId="ID_SIGNER_WHQL" />\n        </AllowedSigners>',
        '        <AllowedSigners>\n          <AllowedSigner SignerId="ID_SIGNER_WINDOWS_PROD" />\n          <AllowedSigner SignerId="ID_SIGNER_STORE" />\n        </AllowedSigners>'),'')
      .replace('<CiSigners />','<CiSigners>\n    <CiSigner SignerId="ID_SIGNER_WINDOWS_PROD" />\n    <CiSigner SignerId="ID_SIGNER_STORE" />\n  </CiSigners>');
  }
  return head+foot(commonOpts,'','','',scenBoth('',''),'');
}
function newFromTemplate(kind){
  const isSupp=kind==='supplemental';
  const ap=activePolicy();
  showModal({title:'New policy — '+({'audit-base':'audit-everything base','blocklist-base':'blocklist base','strict-base':'strict allow-list starter','supplemental':'supplemental'}[kind]||kind),
    body:'<div class="fform">'+
    '<div class="full"><label>Policy name</label><input type="text" id="npName" value="'+esc({'audit-base':'Audit Base Policy','blocklist-base':'Blocklist Policy','strict-base':'Strict Allowlist Policy','supplemental':'Supplemental Policy'}[kind]||'New policy')+'"></div>'+
    (isSupp?'<div class="full"><label>Base policy GUID</label><input type="text" id="npBase" class="m" value="'+esc(ap&&!ap.isSupplemental?ap.info.policyId:'')+'" placeholder="{GUID of the base}"></div>':'')+
    '</div>'+
    (kind==='strict-base'?'<p class="small muted">Uses WellKnown Microsoft roots + Windows/WHQL EKUs — Windows itself keeps running, everything third-party gets logged (audit is ON). Add your business apps via signer rules before enforcing.</p>':'')+
    (kind==='blocklist-base'?'<p class="small muted">Ships with allow-all + one example deny. Add your denies in File rules; merge in Microsoft’s recommended block rules for real coverage.</p>':''),
    buttons:[{label:'Cancel'},{label:'Create',cls:'primary',keepOpen:true,onClick:h=>{
      const name=h.querySelector('#npName').value.trim()||'New policy';
      let baseGuid='';
      if(isSupp){
        baseGuid=h.querySelector('#npBase').value.trim();
        if(!GUID_RX.test(baseGuid)){toast('Base policy GUID required for a supplemental','err');return false}
      }
      const xml=buildTemplate(kind,{name,baseGuid});
      const p=openPolicyText(xml,name.replace(/[^\w.-]+/g,'_')+'.xml',null);
      if(p){closeModal();toast('Created. Review the dashboard, then Save as…','ok')}
    }}]});
}

/* ---------- validate view ---------- */
function renderValidate(el){
  const p=activePolicy();if(!p){setView('library');return}
  const order={error:0,warn:1,info:2,ok:3};
  const list=p.lint.slice().sort((a,b)=>order[a.sev]-order[b.sev]);
  const counts={error:0,warn:0,info:0};
  list.forEach(f=>{if(counts[f.sev]!=null)counts[f.sev]++});
  el.innerHTML=
  '<div class="viewhead"><h2>Validate</h2><span class="sub">structure, references, semantics and deployment pitfalls</span>'+
  '<span class="spacer"></span><button class="mini" id="revalidate">Re-check</button></div>'+
  '<div class="crumbs">'+counts.error+' errors · '+counts.warn+' warnings · '+counts.info+' notes</div>'+
  '<div class="card">'+list.map((f,i)=>
    '<div class="finding"><span class="sev '+f.sev+'">'+f.sev+'</span>'+
    '<div class="tx"><b>'+f.title+'</b><p>'+f.detail+'</p></div>'+
    (f.fix?'<div class="acts"><button class="mini" data-fix="'+i+'">'+esc(f.fix.label)+'</button></div>':'')+
    '</div>').join('')+'</div>';
  $('revalidate').addEventListener('click',()=>{reindex(p);renderShell();renderValidate(el)});
  el.querySelectorAll('[data-fix]').forEach(b=>b.addEventListener('click',()=>{
    const f=list[+b.getAttribute('data-fix')];
    if(f&&f.fix){f.fix.run(p);toast('Applied: '+f.fix.label,'ok')}
  }));
}

/* ---------- deploy view ---------- */
function renderDeploy(el){
  const p=activePolicy();if(!p){setView('library');return}
  const gid=p.info.policyId||'{GUID}';
  const gidBare=gid.replace(/[{}]/g,'');
  const legacy=p.info.format==='legacy';
  const xmlName=p.fileName||'policy.xml';
  const cipName=legacy?'SiPolicy.p7b':gid+'.cip';
  const deployPs=legacy?
[ "# Legacy single-policy format — deploys as SiPolicy.p7b (one per machine)",
  "ConvertFrom-CIPolicy -XmlFilePath .\\"+xmlName+" -BinaryFilePath .\\SiPolicy.p7b",
  "Copy-Item .\\SiPolicy.p7b -Destination $env:windir\\System32\\CodeIntegrity\\SiPolicy.p7b -Force",
  "# activate: reboot, or run RefreshPolicy.exe (from Microsoft Download Center)"
].join('\n')
:
[ "# 1. compile XML -> binary (name MUST be {PolicyID}.cip)",
  "ConvertFrom-CIPolicy -XmlFilePath .\\"+xmlName+" -BinaryFilePath .\\'"+cipName+"'",
  "",
  "# 2. deploy + activate (Win11 22H2+/Server 2025 — CiTool ships in-box)",
  "CiTool --update-policy .\\'"+cipName+"'",
  "",
  "# Older builds instead:",
  "Copy-Item .\\'"+cipName+"' -Destination $env:windir\\System32\\CodeIntegrity\\CiPolicies\\Active\\ -Force",
  "Invoke-CimMethod -Namespace root\\Microsoft\\Windows\\CI -ClassName PS_UpdateAndCompareCIPolicy -MethodName Update -Arguments @{ FilePath = \"$env:windir\\System32\\CodeIntegrity\\CiPolicies\\Active\\"+cipName+"\" }"
].join('\n');
  const opsPs=[
  "CiTool --list-policies -json      # what's active on this machine",
  "CiTool --refresh                  # re-read deployed policies without reboot",
  "CiTool --remove-policy \""+gid+"\"   # remove this policy"+(legacy?'  (legacy: delete SiPolicy.p7b + reboot)':''),
  ].join('\n');
  const miPs=[
  "# Managed installer plumbing (option 13) — run once per client (Intune/ConfigMgr do this for you):",
  "# 1. AppLocker ManagedInstaller collection (example: Intune agent)",
  "#    see: https://aka.ms/appcontrol -> managed installer configuration",
  "appidtel.exe start [-mionly]      # start enforcement of MI claims",
  "sc.exe config appidsvc start=auto # Application Identity service must run"
  ].join('\n');
  const omaUri="./Vendor/MSFT/ApplicationControl/Policies/"+gidBare+"/Policy";
  el.innerHTML=
  '<div class="viewhead"><h2>Deploy</h2><span class="sub">commands generated for THIS policy — '+esc(p.info.name)+' v'+esc(p.info.version)+'</span>'+
  '<span class="spacer"></span><button class="mini" id="dlDeploy">Download deploy.ps1</button></div>'+
  (p.audit?'<div class="crumbs">Policy is in <b>audit mode</b> — safe to deploy broadly; watch events, triage, then enforce.</div>'
          :'<div class="crumbs" style="color:var(--deny)">Policy is in <b>ENFORCE</b> mode — deploy to a test ring first. Anything not allowed will be blocked.</div>')+
  '<div class="cols2">'+
  '<div>'+
    '<div class="card"><h3>Compile &amp; deploy locally <span class="n">'+docLink('legacy','deployment docs')+'</span></h3><div class="pad">'+codeBlock('psDeploy',deployPs)+
    '<p class="small muted" style="margin:0">Version note: a deployed signed policy only ever accepts <b>higher</b> VersionEx values — bump before every rollout (Dashboard → +rev).</p></div></div>'+
    '<div class="card"><h3>Operate <span class="n">'+docLink('citool','CiTool docs')+'</span></h3><div class="pad">'+codeBlock('psOps',opsPs)+'</div></div>'+
    (p.hasOption('Enabled:Managed Installer')?'<div class="card"><h3>Managed installer prerequisites <span class="n">'+docLink('mi')+'</span></h3><div class="pad">'+codeBlock('psMi',miPs)+'</div></div>':'')+
    '<div class="card"><h3>Collect audit events (for the Triage tab) <span class="n">'+docLink('events','event ID reference')+'</span></h3><div class="pad">'+codeBlock('psEvt',EXPORT_EVENTS_PS)+'</div></div>'+
  '</div>'+
  '<div>'+
    (legacy?'':'<div class="card"><h3>Intune (custom OMA-URI) <span class="n">'+docLink('intune','Intune deploy docs')+'</span></h3><div class="pad">'+
      '<div class="field"><label>OMA-URI</label><div class="val">'+esc(omaUri)+' <button class="mini" data-copyv="'+esc(omaUri)+'">copy</button></div></div>'+
      '<p class="small muted">Data type: Base64 (file) — upload the compiled <code>'+esc(cipName)+'</code>. Payload limit is ~350 KB; Validate warns if this policy is at risk. Removal: deploy an allow-all update first, then delete the URI.</p>'+
    '</div></div>')+
    '<div class="card"><h3>Audit → enforce checklist <span class="n">'+docLink('audit','audit mode docs')+'</span></h3><div class="pad small"><ol style="margin:0;padding-left:18px;line-height:2">'+
    '<li>Deploy in audit mode to the target ring</li>'+
    '<li>Collect events for 1-4 weeks (snippet on the left)</li>'+
    '<li>Triage every unique file in the <b>Event triage</b> tab</li>'+
    '<li>Put the allows in a supplemental (or merge into base), redeploy, confirm the log goes quiet</li>'+
    '<li>Keep options 9 + 10 (F8 menu, boot-audit fallback) for the first enforced rollout</li>'+
    '<li>Flip to enforce on the Dashboard, bump version, redeploy to a canary ring first</li>'+
    '</ol></div></div>'+
    '<div class="card"><h3>If a machine is bricked by enforcement</h3><div class="pad small muted">'+
    'Boot to WinRE / F8 (if option 9) → delete the policy file: <code>'+(legacy?'%windir%\\System32\\CodeIntegrity\\SiPolicy.p7b':'%windir%\\System32\\CodeIntegrity\\CiPolicies\\Active\\'+esc(cipName))+'</code>'+(legacy?'':' (signed policies also copy to the EFI partition under EFI\\Microsoft\\Boot\\CiPolicies\\Active)')+' → reboot. '+
    'For signed policies you must deploy a signed "disable" update instead — see the rule option 6 note in Validate.'+
    '</div></div>'+
  '</div></div>';
  wireCopies(el);
  el.querySelectorAll('[data-copyv]').forEach(b=>b.addEventListener('click',()=>copyText(b.getAttribute('data-copyv'),'OMA-URI')));
  $('dlDeploy').addEventListener('click',()=>{
    download('deploy_'+(p.info.name.replace(/[^\w.-]+/g,'_'))+'.ps1',
'#Requires -RunAsAdministrator\n# Deploy script generated by App Control Studio — '+new Date().toISOString()+'\n# Policy: '+p.info.name+'  v'+p.info.version+'  '+gid+'\n$ErrorActionPreference="Stop"\n$xml = Join-Path $PSScriptRoot "'+xmlName+'"\n'+
(legacy?
'$bin = Join-Path $PSScriptRoot "SiPolicy.p7b"\nConvertFrom-CIPolicy -XmlFilePath $xml -BinaryFilePath $bin\nCopy-Item $bin -Destination "$env:windir\\System32\\CodeIntegrity\\SiPolicy.p7b" -Force\nWrite-Host "Deployed legacy policy. Reboot (or run RefreshPolicy.exe) to activate."'
:
'$bin = Join-Path $PSScriptRoot "'+cipName+'"\nConvertFrom-CIPolicy -XmlFilePath $xml -BinaryFilePath $bin\nif (Get-Command CiTool -ErrorAction SilentlyContinue) {\n  CiTool --update-policy $bin\n} else {\n  $dest = "$env:windir\\System32\\CodeIntegrity\\CiPolicies\\Active"\n  New-Item -ItemType Directory -Force $dest | Out-Null\n  Copy-Item $bin -Destination $dest -Force\n  Invoke-CimMethod -Namespace root\\Microsoft\\Windows\\CI -ClassName PS_UpdateAndCompareCIPolicy -MethodName Update -Arguments @{ FilePath = (Join-Path $dest "'+cipName+'") }\n}\nWrite-Host "Deployed '+esc(p.info.name)+' v'+p.info.version+'"')
,'text/plain');
  });
}

/* ---------- xml view ---------- */
function renderXml(el){
  const p=activePolicy();if(!p){setView('library');return}
  const out=exportText(p);
  el.innerHTML=
  '<div class="viewhead"><h2>XML</h2><span class="sub">'+(p.dirty?'with your '+p.ledger.filter(e=>!e.undone).length+' pending edits applied':'as on disk')+'</span>'+
  '<span class="spacer"></span>'+
  '<button class="mini" id="xmlCopy">Copy all</button>'+
  '<button class="mini" id="xmlPretty">Copy pretty-printed</button>'+
  '<button class="mini primary" id="xmlApply" disabled>Apply manual edits</button></div>'+
  '<div class="crumbs">You can hand-edit here — Apply re-parses and replaces the working copy (its own undo history starts fresh).</div>'+
  '<div class="card"><div class="pad" style="padding:8px">'+
  '<textarea id="xmlArea" style="width:100%;height:64vh;border:0;outline:none;resize:vertical;background:var(--code-bg);color:var(--code-ink);border-radius:7px;padding:12px" spellcheck="false"></textarea>'+
  '</div></div>';
  const ta=$('xmlArea');
  ta.value=out.text;
  ta.addEventListener('input',()=>{$('xmlApply').disabled=ta.value===out.text});
  $('xmlCopy').addEventListener('click',()=>copyText(ta.value,'XML'));
  $('xmlPretty').addEventListener('click',()=>copyText(serializeDoc(p),'Pretty XML'));
  $('xmlApply').addEventListener('click',async()=>{
    let doc;
    try{
      doc=new DOMParser().parseFromString(ta.value,'application/xml');
      if(doc.querySelector('parsererror'))throw new Error(doc.querySelector('parsererror').textContent.split('\n')[0]);
      if(ln(doc.documentElement)!=='sipolicy')throw new Error('root element must be SiPolicy');
    }catch(e){toast('Not applied — '+e.message,'err');return}
    if(p.ledger.some(x=>!x.undone)){
      const sure=await confirmModal('Apply manual edits?','Your '+p.ledger.filter(x=>!x.undone).length+' tracked edits are already included in this text. The ledger resets — undo history starts fresh from here.','Apply');
      if(!sure)return;
    }
    p.doc=doc;p.raw=ta.value;p.ledger=[];p.dirty=true;
    reindex(p);renderShell();renderXml(el);
    toast('Manual edits applied','ok');
  });
}

/* ---------- diff view ---------- */
function diffPolicies(a,b){
  const rows=[];
  const infoFields=[['Type',x=>x.info.type],['Version',x=>x.info.version],['PolicyID',x=>x.info.policyId],['BasePolicyID',x=>x.info.basePolicyId],['Name',x=>x.info.name],['HVCI',x=>x.info.hvci]];
  for(const [label,fn] of infoFields){
    const va=fn(a),vb=fn(b);
    if(va!==vb)rows.push({sec:'Identity',tag:'chg',label,detail:esc(va||'(none)')+' → '+esc(vb||'(none)')});
  }
  const oa=new Set(a.options.map(o=>o.string.toLowerCase())),ob=new Set(b.options.map(o=>o.string.toLowerCase()));
  for(const o of b.options)if(!oa.has(o.string.toLowerCase()))rows.push({sec:'Rule options',tag:'add',label:o.string,detail:o.meta?o.meta.name:''});
  for(const o of a.options)if(!ob.has(o.string.toLowerCase()))rows.push({sec:'Rule options',tag:'del',label:o.string,detail:o.meta?o.meta.name:''});
  const mapRules=p=>{const m=new Map();for(const r of p.rules){const k=r.key;if(!m.has(k))m.set(k,[]);m.get(k).push(r)}return m};
  const ra=mapRules(a),rb=mapRules(b);
  const ruleLabel=r=>(KIND_LABEL[r.kind]||r.kind)+' '+(r.value||r.friendly||r.id);
  for(const [k,listB] of rb){
    const listA=ra.get(k);
    if(!listA){for(const r of listB)rows.push({sec:'File rules',tag:'add',label:r.tag+': '+ruleLabel(r),detail:r.id+(r.scen.length?' · scenario '+r.scen.join(','):''),xml:serializeEl(r.el,'','  ')})}
    else{
      const dA=listA.map(r=>r.decision+players(r)).sort().join(';'),dB=listB.map(r=>r.decision+players(r)).sort().join(';');
      if(dA!==dB)rows.push({sec:'File rules',tag:'chg',label:ruleLabel(listB[0]),detail:dA+' → '+dB});
    }
  }
  for(const [k,listA] of ra)if(!rb.has(k))for(const r of listA)rows.push({sec:'File rules',tag:'del',label:r.tag+': '+ruleLabel(r),detail:r.id,xml:serializeEl(r.el,'','  ')});
  function players(r){return r.scen.length?'@'+r.scen.slice().sort().join('+'):''}
  const mapSigners=p=>{const m=new Map();for(const s of p.signers){if(!m.has(s.key))m.set(s.key,[]);m.get(s.key).push(s)}return m};
  const sa=mapSigners(a),sb=mapSigners(b);
  const sigState=s=>['allow:'+s.allowIn.slice().sort().join('+'),'deny:'+s.denyIn.slice().sort().join('+'),s.inCi?'ci':'',s.inUpdate?'upd':'',s.inSuppl?'sup':''].filter(Boolean).join(' ');
  for(const [k,listB] of sb){
    const listA=sa.get(k);
    if(!listA){for(const s of listB)rows.push({sec:'Signers',tag:'add',label:s.name,detail:s.id+' · '+sigState(s),xml:serializeEl(s.el,'','  ')})}
    else{
      const stA=listA.map(sigState).sort().join(';'),stB=listB.map(sigState).sort().join(';');
      if(stA!==stB)rows.push({sec:'Signers',tag:'chg',label:listB[0].name,detail:stA+' → '+stB});
    }
  }

  return rows;
}
function renderDiff(el){

  '<label>B (new)</label><select id="diffB">'+pols.map(p=>'<option value="'+p.pid+'" '+(p.pid===D.b?'selected':'')+'>'+esc(p.info.name)+' v'+esc(p.info.version)+'</option>').join('')+'</select>'+

    const counts={add:rows.filter(r=>r.tag==='add').length,del:rows.filter(r=>r.tag==='del').length,chg:rows.filter(r=>r.tag==='chg').length};
    $('diffOut').innerHTML=

    Object.keys(bySec).map(sec=>'<div class="card"><h3>'+esc(sec)+' <span class="n">'+bySec[sec].length+'</span></h3>'+

        '<div><b>'+esc(r.label)+'</b>'+(r.detail?' <span class="m muted">'+esc(r.detail)+'</span>':'')+

        '</div></div>').join('')+'</div>').join('');
    $('diffCopy').onclick=()=>{
      const lines=['Diff: '+a.info.name+' v'+a.info.version+'  →  '+b.info.name+' v'+b.info.version,''];
      Object.keys(bySec).forEach(sec=>{lines.push('== '+sec+' ==');bySec[sec].forEach(r=>lines.push(({add:'+ ',del:'- ',chg:'~ '})[r.tag]+r.label+(r.detail?'  ['+r.detail+']':'')));lines.push('')});
      copyText(lines.join('\n'),'Diff summary');

  };
  $('diffA').addEventListener('change',e=>{D.a=e.target.value;run()});
  $('diffB').addEventListener('change',e=>{D.b=e.target.value;run()});
  $('diffSwap').addEventListener('click',()=>{const t=D.a;D.a=D.b;D.b=t;renderDiff(el)});

function mergePolicies(sources,opts){
  opts=opts||{};
  const first=sources[0];
  const doc=document.implementation.createDocument(NS,'SiPolicy',null);
  const root=doc.documentElement;
  const firstRoot=first.doc.documentElement;
  if(att(firstRoot,'PolicyType'))root.setAttribute('PolicyType',att(firstRoot,'PolicyType'));
  const mk=(tag,text)=>{const e=doc.createElementNS(NS,tag);if(text!=null)e.textContent=text;root.appendChild(e);return e};
  mk('VersionEx',first.info.version||'1.0.0.0');
  if(first.info.format==='legacy')mk('PolicyTypeID',first.info.legacyTypeId);
  mk('PlatformID',first.info.platformId||'{2E07F7E4-194C-4D20-B7C9-6F44A6C5A234}');
  if(first.info.format!=='legacy'){mk('PolicyID',first.info.policyId);mk('BasePolicyID',first.info.basePolicyId)}
  const report={sources:sources.map(s=>s.info.name),rules:{in:0,kept:0},signers:{in:0,kept:0},renamed:0,conflicts:[],optionsFrom:opts.optionsFrom==='first'?'first policy only':'union of all sources'};
  const rulesEl=mk('Rules');
  const optSeen=new Set();
  const optSources=opts.optionsFrom==='first'?[first]:sources;
  for(const p of optSources)for(const o of p.options){
    const k=o.string.toLowerCase();
    if(optSeen.has(k))continue;
    optSeen.add(k);
    const r=doc.createElementNS(NS,'Rule'),op=doc.createElementNS(NS,'Option');
    op.textContent=o.string;r.appendChild(op);rulesEl.appendChild(r);
  }
  const usedIds=new Set();
  const rename=id=>{
    let nid=id,n=2;
    while(usedIds.has(nid.toUpperCase())){nid=id+'_M'+n;n++;report.renamed++}
    usedIds.add(nid.toUpperCase());
    return nid;
  };
  // EKUs by value
  const ekusEl=mk('EKUs');
  const ekuIdMap=new Map(); // per policy: oldId -> newId ; keyed pid|old
  const ekuByValue=new Map();
  for(const p of sources)for(const e of p.ekus){
    let newId;
    if(ekuByValue.has(e.value))newId=ekuByValue.get(e.value);
    else{
      newId=rename(e.id);
      ekuByValue.set(e.value,newId);
      const el=doc.importNode(e.el,true);
      el.setAttribute('ID',newId);
      ekusEl.appendChild(el);
    }
    ekuIdMap.set(p.pid+'|'+e.id,newId);
  }
  // file rules by key
  const frEl=mk('FileRules');
  const ruleIdMap=new Map(),ruleByKey=new Map(),ruleDecisionByKey=new Map();
  for(const p of sources)for(const r of p.rules){
    report.rules.in++;
    const keyWithTag=r.key;
    let newId;
    if(ruleByKey.has(keyWithTag))newId=ruleByKey.get(keyWithTag);
    else{
      newId=rename(r.id);
      ruleByKey.set(keyWithTag,newId);
      const el=doc.importNode(r.el,true);
      el.setAttribute('ID',newId);
      frEl.appendChild(el);
      report.rules.kept++;
    }
    ruleIdMap.set(p.pid+'|'+r.id,newId);
    const contentKey=keyWithTag.replace(/^(allow|deny)\|/,'x|');
    if(['allow','deny'].includes(r.tag.toLowerCase())){
      const prev=ruleDecisionByKey.get(contentKey);
      if(prev&&prev!==r.tag.toLowerCase())report.conflicts.push('Allow+Deny on same content: '+(r.value||r.id));
      ruleDecisionByKey.set(contentKey,r.tag.toLowerCase());
    }
  }
  // signers by key
  const signersEl=mk('Signers');
  const signerIdMap=new Map(),signerByKey=new Map();
  for(const p of sources)for(const s of p.signers){
    report.signers.in++;
    let newId;
    if(signerByKey.has(s.key))newId=signerByKey.get(s.key);
    else{
      newId=rename(s.id);
      signerByKey.set(s.key,newId);
      const el=doc.importNode(s.el,true);
      el.setAttribute('ID',newId);
      for(const ref of all(el,'FileAttribRef')){
        const old=att(ref,'RuleID','RuleId','ID');
        const mapped=ruleIdMap.get(p.pid+'|'+old);
        if(mapped)ref.setAttribute('RuleID',mapped);
      }
      for(const ek of all(el,'CertEKU')){
        const old=att(ek,'ID','Id');
        const mapped=ekuIdMap.get(p.pid+'|'+old);
        if(mapped)ek.setAttribute('ID',mapped);
      }
      signersEl.appendChild(el);
      report.signers.kept++;
    }
    signerIdMap.set(p.pid+'|'+s.id,newId);
  }
  // scenarios
  const scsEl=mk('SigningScenarios');
  const scenVals=[...new Set(sources.flatMap(p=>p.scenarios.map(s=>s.value)))];
  for(const val of scenVals){
    const sc=doc.createElementNS(NS,'SigningScenario');
    sc.setAttribute('Value',val);
    sc.setAttribute('ID',(SCENARIO_META[val]||{}).id||('ID_SIGNINGSCENARIO_'+val));
    const first0=sources.flatMap(p=>p.scenarios).find(s=>s.value===val);
    if(first0&&first0.name)sc.setAttribute('FriendlyName',first0.name);
    const ps=doc.createElementNS(NS,'ProductSigners');sc.appendChild(ps);
    const mkList=(tag)=>{const e=doc.createElementNS(NS,tag);ps.appendChild(e);return e};
    const allowedEl=mkList('AllowedSigners'),deniedEl=mkList('DeniedSigners'),refsEl=mkList('FileRulesRef');
    const seenA=new Set(),seenD=new Set(),seenR=new Set();
    for(const p of sources)for(const s of p.scenarios.filter(x=>x.value===val)){
      for(const sid of s.allowedSigners){
        const m=signerIdMap.get(p.pid+'|'+sid);
        if(m&&!seenA.has(m)){seenA.add(m);const e=doc.createElementNS(NS,'AllowedSigner');e.setAttribute('SignerId',m);allowedEl.appendChild(e)}
      }
      for(const sid of s.deniedSigners){
        const m=signerIdMap.get(p.pid+'|'+sid);
        if(m&&!seenD.has(m)){seenD.add(m);const e=doc.createElementNS(NS,'DeniedSigner');e.setAttribute('SignerId',m);deniedEl.appendChild(e)}
      }
      for(const rid of s.ruleRefs){
        const m=ruleIdMap.get(p.pid+'|'+rid);
        if(m&&!seenR.has(m)){seenR.add(m);const e=doc.createElementNS(NS,'FileRuleRef');e.setAttribute('RuleID',m);refsEl.appendChild(e)}
      }
    }
    if(!allowedEl.children.length)ps.removeChild(allowedEl);
    if(!deniedEl.children.length)ps.removeChild(deniedEl);
    if(!refsEl.children.length)ps.removeChild(refsEl);
    scsEl.appendChild(sc);
  }
  // policy signer lists
  const mkRefList=(tag,childTag,pick)=>{
    const e=mk(tag);
    const seen=new Set();
    for(const p of sources)for(const s of p.signers.filter(pick)){
      const m=signerIdMap.get(p.pid+'|'+s.id);
      if(m&&!seen.has(m)){seen.add(m);const c=doc.createElementNS(NS,childTag);c.setAttribute('SignerId',m);e.appendChild(c)}
    }
    return e;
  };
  mkRefList('UpdatePolicySigners','UpdatePolicySigner',s=>s.inUpdate);
  mkRefList('CiSigners','CiSigner',s=>s.inCi);
  mk('HvciOptions',String(Math.max(...sources.map(p=>parseInt(p.info.hvci,10)||0))));
  const sup=mkRefList('SupplementalPolicySigners','SupplementalPolicySigner',s=>s.inSuppl);
  if(!sup.children.length)root.removeChild(sup);
  // settings from first
  const set0=all(firstRoot,'Settings').find(e=>e.parentNode===firstRoot);
  if(set0)root.appendChild(doc.importNode(set0,true));
  const raw='<?xml version="1.0" encoding="utf-8"?>\n'+serializeEl(root,'','  ')+'\n';
  return {raw,report};
}
function renderMerge(el){
  const pols=App.policies;
  App.merge=App.merge||{order:[]};

  el.innerHTML=
  '<div class="viewhead"><h2>Merge</h2><span class="sub">combine policies with dedup and reference fix-up — first policy wins type, IDs and settings</span></div>'+
  (pols.length<2?'<div class="empty card" style="padding:40px">Open at least two policies to merge (e.g. your base + Microsoft’s recommended block rules).</div>':
  '<div class="cols2"><div class="card"><h3>Sources (in order)</h3><div class="filelist">'+
  pols.map(p=>{
    const i=M.order.indexOf(p.pid);

    (i>=0?'<span class="chip">#'+(i+1)+'</span>':'')+
    '<span class="nm">'+esc(p.info.name)+'</span><span class="m">v'+esc(p.info.version)+' · '+p.counts.rules+' rules · '+p.counts.signers+' signers</span>'+

    const pid=cb.getAttribute('data-mp');

  }));

    const pid=b.getAttribute('data-up');

  }));
  if($('mergeGo'))$('mergeGo').addEventListener('click',()=>{
    const sources=M.order.map(policyByPid).filter(Boolean);
    if(sources.length<2)return;

      '<div class="field"><label>ID renames</label><div class="val">'+report.renamed+'</div></div>'+
      '<div class="field"><label>Rule options</label><div class="val">'+esc(report.optionsFrom)+'</div></div>'+
      '</div>'+
      (report.conflicts.length?'<p style="color:var(--amber)"><b>Conflicts:</b><br>'+report.conflicts.slice(0,8).map(esc).join('<br>')+'</p>':'')+
      '<p class="small muted">Now check Validate, set the version, and Save as….</p>',

async function gunzipB64(b64){
  const bytes=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));
  const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
  return await new Response(stream).text();
}

<script>
/* ============================================================
   CHUNK J — guided policy creation wizard (MS Wizard parity)
   ============================================================ */
const WIZ_TEMPLATES=[
 {key:'defaultWindows',title:'Default Windows Mode',big:1,doc:'wizardTpl',authorizes:['Windows OS components','Microsoft Store applications','Office 365, OneDrive, Teams','WHQL signed kernel drivers']},
 {key:'allowMicrosoft',title:'Allow Microsoft Mode',big:1,doc:'wizardTpl',authorizes:['Everything in Default Windows Mode','All Microsoft-signed applications']},
 {key:'signedReputable',title:'Signed and Reputable Mode',big:1,doc:'isg',authorizes:['Everything in Allow Microsoft Mode','Files with good reputation (ISG)']},
 {key:'allowAll',title:'Allow All',doc:'examples',authorizes:['Everything — the base for audit-first or blocklist policies']},
 {key:'denyAllAudit',title:'Deny All (audit)',doc:'examples',authorizes:['Nothing — logs every execution, great for inventory']},
 {key:'smartAppControl',title:'Smart App Control copy',doc:'sac',authorizes:['Inspection copy of the Windows SAC policy']}
];
const WIZ_MAIN_OPTS=[9,17,11,12,'HVCI',14,13,2,16,6,0,20];
const WIZ_ADV_OPTS=[10,4,18,19,15,8];
let WIZ=null;
function wizTemplateXml(key){
  if(key==='signedReputable')return ACS_ASSETS.templates.allowMicrosoft;
  return ACS_ASSETS.templates[key]||ACS_ASSETS.templates.allowAll;
}
function wizTemplateOptions(key){
  const xml=wizTemplateXml(key);
  const set=new Set();
  for(const m of xml.matchAll(/<Option>([^<]+)<\/Option>/g))set.add(m[1].trim());
  if(key==='signedReputable'){set.add('Enabled:Intelligent Security Graph Authorization');set.add('Enabled:Invalidate EAs on Reboot')}
  return set;
}
function createPolicyWizard(){
  const ap=activePolicy();
  WIZ={step:1,format:'multi',kind:'base',baseGuid:(ap&&!ap.isSupplemental&&ap.info.policyId)||'',
    template:'defaultWindows',name:'',infoId:new Date().toISOString().slice(0,10).replace(/-/g,''),
    options:null,audit:true,hvci:false,mergeUser:false,mergeKernel:false,
    tags:[{key:'',value:''}],enforceDll:false};
  wizShow();
}
function wizSteps(){
  const skipTpl=WIZ.format==='appid'||WIZ.kind==='supplemental';
  const skipRules=WIZ.format==='appid';
  return [
    {n:1,label:'Policy type'},
    {n:2,label:'Template',skip:skipTpl},
    {n:3,label:WIZ.format==='appid'?'Name & tags':'Name'},
    {n:4,label:'Policy rules',skip:skipRules},
    {n:5,label:'Review'}
  ];
}
function wizNextStep(cur,dir){
  const steps=wizSteps();
  let i=steps.findIndex(s=>s.n===cur);
  do{i+=dir}while(steps[i]&&steps[i].skip);
  return steps[i]?steps[i].n:cur;
}
function wizShow(){
  const steps=wizSteps();
  const crumb=steps.map(s=>'<span class="chip" style="'+(s.n===WIZ.step?'border-color:var(--focus);color:var(--focus);font-weight:600':'')+(s.skip?';opacity:.35':'')+'">'+s.n+' · '+s.label+'</span>').join(' ');
  const first=wizNextStep(0,1)===WIZ.step;
  const last=WIZ.step===5;
  showModal({title:'Create a policy',wide:true,
    body:'<div style="margin-bottom:14px">'+crumb+'</div><div id="wizBody">'+wizStepBody()+'</div>',
    buttons:[
      {label:'Cancel'},
      {label:'← Back',keepOpen:true,onClick:()=>{if(!first){WIZ.step=wizNextStep(WIZ.step,-1);wizShow()}return false}},
      last?{label:'Create policy',cls:'primary',keepOpen:true,onClick:()=>{wizCreate();return false}}
          :{label:'Next →',cls:'primary',keepOpen:true,onClick:()=>{if(wizCommitStep()){WIZ.step=wizNextStep(WIZ.step,1);wizShow()}return false}}
    ],
    onOpen:h=>wizWire(h)});
}
function wizStepBody(){
  const W=WIZ;
  if(W.step===1)return ''+
    '<h4 style="margin:0 0 8px">Select a policy type</h4>'+
    '<div class="filelist">'+
    [['multi','Multiple Policy Format','Base or supplemental policy. Windows 10 1903+ — unlimited policies as of the April 2024 update.','multi'],
     ['legacy','Single Policy Format','Legacy format for any Windows 10 / Server 2016-2019. One policy per machine, deploys as SiPolicy.p7b.','legacy'],
     ['appid','AppId Tagging Policy','Does not block anything — tags processes that match the policy so other tools (e.g. Firewall, WDAC-aware apps) can act on the tag. Windows 11 / Server 2019+.','appid']]
    .map(x=>'<label class="frow" style="cursor:pointer"><input type="radio" name="wzFmt" value="'+x[0]+'" '+(W.format===x[0]?'checked':'')+'><div><b>'+x[1]+'</b> '+docLink(x[3])+'<div class="small muted">'+x[2]+'</div></div></label>').join('')+
    '</div>'+
    '<div id="wzKindWrap" class="'+(W.format==='multi'?'':'hidden')+'" style="margin-top:14px">'+
    '<h4 style="margin:0 0 8px">Base or supplemental?</h4>'+
    '<div class="filelist">'+
    [['base','Base Policy','A standalone circle of trust. Multiple base policies can be enforced simultaneously (intersection).','wizardTpl'],
     ['supplemental','Supplemental Policy','Expands one existing base policy — can only add trust, never remove it.','supp']]
    .map(x=>'<label class="frow" style="cursor:pointer"><input type="radio" name="wzKind" value="'+x[0]+'" '+(W.kind===x[0]?'checked':'')+'><div><b>'+x[1]+'</b> '+docLink(x[3])+'<div class="small muted">'+x[2]+'</div></div></label>').join('')+
    '</div>'+
    '<div id="wzBaseWrap" class="'+(W.kind==='supplemental'?'':'hidden')+'" style="margin-top:10px">'+
    '<label>Base policy GUID</label><input type="text" id="wzBaseGuid" class="m" style="width:100%" value="'+esc(W.baseGuid)+'" placeholder="{A6D7E31F-...}">'+
    (App.policies.filter(x=>!x.isSupplemental&&x.info.policyId).length?'<div class="small muted" style="margin-top:4px">Open bases: '+App.policies.filter(x=>!x.isSupplemental&&x.info.policyId).map(b=>'<span class="chip click" data-guid="'+esc(b.info.policyId)+'">'+esc(b.info.name)+'</span>').join(' ')+'</div>':'')+
    '</div></div>';
  if(W.step===2)return ''+
    '<h4 style="margin:0 0 4px">Select a base template <span style="font-weight:400">'+docLink('wizardTpl','about template policies')+' · '+docLink('examples','example policies reference')+'</span></h4>'+
    '<p class="small muted" style="margin:0 0 10px">These are the real template policies from this machine (<code>C:\\Windows\\schemas\\CodeIntegrity\\ExamplePolicies</code>), same as the Microsoft Wizard uses.</p>'+
    '<div class="libgrid" style="grid-template-columns:repeat(auto-fill,minmax(215px,1fr))">'+
    WIZ_TEMPLATES.map(t=>'<div class="libcard" data-tpl="'+t.key+'" style="'+(W.template===t.key?'border-color:var(--focus);box-shadow:0 0 0 1px var(--focus)':'')+(t.big?'':';opacity:.92')+'">'+
      '<b>'+esc(t.title)+(W.template===t.key?' ✓':'')+'</b> '+docLink(t.doc)+
      '<p style="margin-top:4px">'+(t.big?'Authorizes:':'')+'</p><ul class="small muted" style="margin:2px 0 0;padding-left:16px">'+t.authorizes.map(a=>'<li>'+esc(a)+'</li>').join('')+'</ul></div>').join('')+
    '</div>';
  if(W.step===3)return ''+
    '<h4 style="margin:0 0 8px">Name the policy</h4>'+
    '<div class="fform">'+
    '<div class="full"><label>Policy name</label><input type="text" id="wzName" value="'+esc(W.name||wizDefaultName())+'"></div>'+
    '<div><label>Policy info ID</label><input type="text" id="wzInfoId" value="'+esc(W.infoId)+'"></div>'+
    '</div>'+
    '<p class="small muted">No file location here — the policy opens as a tab and you save it wherever you want (Ctrl+S / Save as…).</p>'+
    (W.format==='appid'?'<h4 style="margin:14px 0 8px">AppId tags</h4><div id="wzTags">'+
      W.tags.map((t,i)=>'<div style="display:flex;gap:8px;margin-bottom:6px"><input type="text" class="m wzTagK" placeholder="Key (e.g. FWTag)" value="'+esc(t.key)+'" style="flex:1"><input type="text" class="m wzTagV" placeholder="Value (e.g. Trusted)" value="'+esc(t.value)+'" style="flex:1"></div>').join('')+
      '</div><button class="mini" id="wzAddTag">+ tag</button> '+
      '<label style="margin-left:12px;color:var(--ink)"><input type="checkbox" id="wzEnfDll" '+(W.enforceDll?'checked':'')+'> EnforceDLL (also tag DLL loads — evaluate performance first)</label>':'');
  if(W.step===4){
    if(!W.options)W.options=wizTemplateOptions(W.template);
    const suppl=W.kind==='supplemental'&&W.format==='multi';
    const cell=n=>{
      if(n==='HVCI')return '<div class="opt" style="border:0;padding:8px 10px"><div class="tx"><b>Hypervisor-protected Code Integrity</b> '+docLink('hvci')+'<p>Sets &lt;HvciOptions&gt;1</p></div><label class="sw"><input type="checkbox" id="wzHvci" '+(W.hvci?'checked':'')+'><span class="tr"></span><span class="th"></span></label></div>';
      const o=OPTIONS.find(x=>x.n===n);
      const on=W.options.has(o.s);
      const locked=suppl&&!SUPPL_OK.has(o.n);
      return '<div class="opt" style="border:0;padding:8px 10px'+(locked?';opacity:.45':'')+'"><div class="tx"><b>'+esc(o.name)+'</b> '+docLink(OPT_DOCS[o.n]||'rules')+(o.ns?' <span class="warntag">not supported</span>':'')+'<p>'+esc(o.s)+'</p></div>'+
      '<label class="sw"><input type="checkbox" class="wzOpt" data-opt="'+esc(o.s)+'" '+(on?'checked':'')+(locked?' disabled':'')+'><span class="tr"></span><span class="th"></span></label></div>';
    };
    return '<h4 style="margin:0 0 4px">Configure policy rules <span style="font-weight:400">'+docLink('rules','all options explained')+'</span></h4>'+
    '<p class="small muted" style="margin:0 0 8px">Pre-set from the '+(suppl?'supplemental template — only options 6, 13, 14, 18 apply to supplementals':esc((WIZ_TEMPLATES.find(t=>t.key===W.template)||{}).title||W.template)+' template')+'. Hover the Options view later for full explanations.</p>'+
    '<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:0 14px">'+WIZ_MAIN_OPTS.map(cell).join('')+'</div>'+
    '<details style="margin-top:6px"><summary class="small" style="cursor:pointer;color:var(--focus)">Advanced options</summary>'+
    '<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:0 14px;margin-top:6px">'+WIZ_ADV_OPTS.map(cell).join('')+'</div></details>'+
    '<div class="bigswitch '+(W.audit?'audit':'enforce')+'" style="margin:14px 0 0">'+
    '<label class="sw big"><input type="checkbox" id="wzAudit" '+(W.audit?'checked':'')+'><span class="tr"></span><span class="th"></span></label>'+
    '<div class="tx"><b>Audit mode '+(W.audit?'ON — log only':'OFF — policy will enforce!')+'</b> '+docLink('audit')+'<p>We recommend always starting in audit mode and enforcing only after triaging the audit events.</p></div></div>';
  }
  // step 5
  const tpl=WIZ_TEMPLATES.find(t=>t.key===W.template);
  const canMerge=W.format!=='appid'&&W.kind!=='supplemental';
  const optCount=W.options?W.options.size:wizTemplateOptions(W.template).size;
  return '<h4 style="margin:0 0 8px">Review & block rules</h4>'+
  '<div class="fgrid" style="margin-bottom:12px">'+
  '<div class="field"><label>Type</label><div class="val">'+(W.format==='appid'?'AppId Tagging Policy':W.format==='legacy'?'Base Policy (legacy single-policy format)':(W.kind==='supplemental'?'Supplemental Policy of '+esc(W.baseGuid):'Base Policy (multiple-policy format)'))+'</div></div>'+
  '<div class="field"><label>Name</label><div class="val">'+esc(W.name||wizDefaultName())+'</div></div>'+
  (W.format!=='appid'&&W.kind!=='supplemental'?'<div class="field"><label>Template</label><div class="val">'+esc(tpl?tpl.title:'')+'</div></div>':'')+
  '<div class="field"><label>Mode</label><div class="val">'+(W.format==='appid'?'tagging only':(W.audit?'Audit':'ENFORCE'))+'</div></div>'+
  '<div class="field"><label>Rule options</label><div class="val">'+optCount+(W.hvci?' + HVCI':'')+'</div></div>'+
  '</div>'+
  (canMerge?
    '<h4 style="margin:0 0 6px">Merge Microsoft recommended block rules</h4>'+
    '<label style="display:flex;gap:9px;align-items:flex-start;color:var(--ink);margin-bottom:8px"><input type="checkbox" id="wzMergeUser" '+(W.mergeUser?'checked':'')+' style="margin-top:3px">'+
    '<span><b>User-mode block rules</b> '+docLink('umblock')+' <span class="small muted">'+esc(ACS_ASSETS.meta.user)+' — blocks mshta, msbuild, wmic and other App Control bypasses. Adds ~120 KB. Their allow-all rules are stripped automatically.</span></span></label>'+
    '<label style="display:flex;gap:9px;align-items:flex-start;color:var(--ink)"><input type="checkbox" id="wzMergeKernel" '+(W.mergeKernel?'checked':'')+' style="margin-top:3px">'+
    '<span><b>Vulnerable driver block rules</b> '+docLink('drvblock')+' <span class="small muted">'+esc(ACS_ASSETS.meta.kernel)+' — adds ~540 KB. Note: Windows 11 / Win10 22H2+ already enforce this list by default, and Microsoft recommends deploying it as its own policy; merge only if you need one combined file.</span></span></label>'
    :'<p class="small muted">'+(W.format==='appid'?'Block rules do not apply to tagging policies.':'Block rules belong in the base policy, not in a supplemental.')+'</p>')+
  '<p class="small muted" style="margin-top:12px">After creation the policy opens as an unsaved tab — check Validate, add your own rules, then Save as….</p>';
}
function wizDefaultName(){
  const t=WIZ_TEMPLATES.find(x=>x.key===WIZ.template);
  const stamp=new Date().toISOString().slice(0,10);
  if(WIZ.format==='appid')return 'AppIdTagging_'+stamp;
  if(WIZ.kind==='supplemental')return 'Supplemental_'+stamp;
  return ((t?t.title.replace(/ Mode$/,'').replace(/\s+/g,''):'Policy'))+'_'+stamp;
}
function wizWire(h){
  h.querySelectorAll('[name=wzFmt]').forEach(r=>r.addEventListener('change',()=>{WIZ.format=r.value;WIZ.options=null;wizShow()}));
  h.querySelectorAll('[name=wzKind]').forEach(r=>r.addEventListener('change',()=>{WIZ.kind=r.value;WIZ.options=null;wizShow()}));
  const bg=h.querySelector('#wzBaseGuid');
  if(bg)bg.addEventListener('input',()=>{WIZ.baseGuid=bg.value.trim()});
  h.querySelectorAll('[data-guid]').forEach(c=>c.addEventListener('click',()=>{WIZ.baseGuid=c.getAttribute('data-guid');if(bg)bg.value=WIZ.baseGuid}));
  h.querySelectorAll('[data-tpl]').forEach(c=>c.addEventListener('click',()=>{WIZ.template=c.getAttribute('data-tpl');WIZ.options=null;WIZ.name='';wizShow()}));
  const nm=h.querySelector('#wzName');if(nm)nm.addEventListener('input',()=>WIZ.name=nm.value);
  const iid=h.querySelector('#wzInfoId');if(iid)iid.addEventListener('input',()=>WIZ.infoId=iid.value.trim());
  const at=h.querySelector('#wzAddTag');
  if(at)at.addEventListener('click',()=>{wizCommitStep();WIZ.tags.push({key:'',value:''});wizShow()});
  const ed=h.querySelector('#wzEnfDll');if(ed)ed.addEventListener('change',()=>WIZ.enforceDll=ed.checked);
  h.querySelectorAll('.wzOpt').forEach(sw=>sw.addEventListener('change',()=>{
    const s=sw.getAttribute('data-opt');
    if(sw.checked)WIZ.options.add(s);else WIZ.options.delete(s);
  }));
  const hv=h.querySelector('#wzHvci');if(hv)hv.addEventListener('change',()=>WIZ.hvci=hv.checked);
  const au=h.querySelector('#wzAudit');if(au)au.addEventListener('change',()=>{WIZ.audit=au.checked;wizShow()});
  const mu=h.querySelector('#wzMergeUser');if(mu)mu.addEventListener('change',()=>WIZ.mergeUser=mu.checked);
  const mk=h.querySelector('#wzMergeKernel');if(mk)mk.addEventListener('change',()=>WIZ.mergeKernel=mk.checked);
}
function wizCommitStep(){
  const W=WIZ,h=$('modalHost');
  if(W.step===1){
    if(W.format==='multi'&&W.kind==='supplemental'&&!GUID_RX.test(W.baseGuid)){toast('Enter the base policy GUID','err');return false}
    return true;
  }
  if(W.step===3){
    W.name=(h.querySelector('#wzName')?h.querySelector('#wzName').value.trim():W.name)||wizDefaultName();
    if(W.format==='appid'){
      W.tags=[...h.querySelectorAll('#wzTags > div')].map(row=>({key:row.querySelector('.wzTagK').value.trim(),value:row.querySelector('.wzTagV').value.trim()})).filter(t=>t.key);
      if(!W.tags.length){toast('Add at least one tag key','err');return false}
    }
    return true;
  }
  return true;
}
async function wizCreate(){
  const W=WIZ;
  if(!wizCommitStep())return;
  try{
    let baseXml;
    if(W.format==='appid')baseXml=ACS_ASSETS.templates.allowAll;
    else if(W.kind==='supplemental')baseXml=ACS_ASSETS.templates.supplemental;
    else baseXml=wizTemplateXml(W.template);
    const p0=parsePolicyText(baseXml,'wizard.xml');
    if(!p0){toast('Template parse failed','err');return}
    // identity
    const g=guid();
    ensureTopEl(p0,'VersionEx').textContent='1.0.0.0';
    if(W.format==='legacy'){
      p0.doc.documentElement.removeAttribute('PolicyType');
      for(const tag of ['PolicyID','BasePolicyID']){
        const el=all(p0.doc.documentElement,tag).find(e=>e.parentNode===p0.doc.documentElement);
        if(el)el.parentNode.removeChild(el);
      }
      ensureTopEl(p0,'PolicyTypeID').textContent='{A244370E-44C9-4C06-B551-F6016E563076}';
    }else{
      ensureTopEl(p0,'PolicyID').textContent=g;
      ensureTopEl(p0,'BasePolicyID').textContent=W.kind==='supplemental'?W.baseGuid:g;
      if(W.format==='appid')p0.doc.documentElement.setAttribute('PolicyType','AppID Tagging Policy');
      else p0.doc.documentElement.setAttribute('PolicyType',W.kind==='supplemental'?'Supplemental Policy':'Base Policy');
    }
    // appid: user-mode only + tags
    if(W.format==='appid'){
      reindex(p0);
      const kScen=p0.scenarios.find(s=>s.value==='131');
      if(kScen){
        const deadRefs=kScen.ruleRefs.slice();
        kScen.el.parentNode.removeChild(kScen.el);
        reindex(p0);
        for(const rid of deadRefs){const r=p0.rulesById[rid];if(r&&!r.scen.length&&r.el.parentNode)r.el.parentNode.removeChild(r.el)}
      }
      const tags=ensureTopEl(p0,'AppIDTags');
      tags.setAttribute('EnforceDLL',W.enforceDll?'true':'false');
      for(const t of W.tags){
        const tag=p0.doc.createElementNS(NS,'AppIDTag');
        tag.setAttribute('Key',t.key);
        tag.setAttribute('Value',t.value||'');
        tags.appendChild(tag);
      }
    }
    // options
    if(W.format!=='appid'){
      reindex(p0);
      const want=W.options||wizTemplateOptions(W.template);
      for(const o of OPTIONS){
        const has=p0.hasOption(o.s);
        const wanted=want.has(o.s);
        if(wanted&&!has)mToggleOption(p0,o.s,true);
        if(!wanted&&has&&o.s.toLowerCase()!=='enabled:audit mode')mToggleOption(p0,o.s,false);
      }
      reindex(p0);
      if(W.audit&&!p0.hasOption('Enabled:Audit Mode'))mToggleOption(p0,'Enabled:Audit Mode',true);
      if(!W.audit&&p0.hasOption('Enabled:Audit Mode'))mToggleOption(p0,'Enabled:Audit Mode',false);
      ensureTopEl(p0,'HvciOptions').textContent=W.hvci?'1':'0';
    }
    // policy info
    reindex(p0);
    mSetPolicyInfo(p0,'Name',W.name);
    mSetPolicyInfo(p0,'Id',W.infoId||'1');
    reindex(p0);
    let finalXml=serializeDoc(p0);
    // block-rule merges
    if((W.mergeUser||W.mergeKernel)&&W.format!=='appid'&&W.kind!=='supplemental'){
      toast('Decompressing and merging block rules…');
      const sources=[parsePolicyText(finalXml,'base.xml')];
      const stripAllowAll=pp=>{
        reindex(pp);
        pp.rules.filter(r=>r.tag.toLowerCase()==='allow'&&r.value==='*').forEach(r=>mDeleteRule(pp,r));
        reindex(pp);
        return pp;
      };
      if(W.mergeUser)sources.push(stripAllowAll(parsePolicyText(await gunzipB64(ACS_ASSETS.blockGz.user),'umblock.xml')));
      if(W.mergeKernel)sources.push(stripAllowAll(parsePolicyText(await gunzipB64(ACS_ASSETS.blockGz.kernel),'kernelblock.xml')));
      if(sources.some(s=>!s)){toast('Block rules failed to load','err');return}
      const {raw,report}=mergePolicies(sources,{optionsFrom:'first'});
      finalXml=raw;
      toast('Merged block rules: +'+(report.rules.in-sources[0].rules.length)+' rules, +'+(report.signers.in-sources[0].signers.length)+' signers','ok');
    }
    const p=openPolicyText(finalXml,W.name.replace(/[^\w.-]+/g,'_')+'.xml',null);
    if(!p)return;
    closeModal();
    WIZ=null;
    setView('dashboard');
    toast('Created "'+p.info.name+'" — review, validate, then Save as…','ok');
  }catch(e){
    toast('Creation failed: '+(e.message||e),'err');
  }
}
</script>
