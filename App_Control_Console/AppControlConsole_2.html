<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>App Control Studio</title>
<style>
:root{
  --mono:ui-monospace,"Cascadia Mono","SF Mono",Menlo,Consolas,monospace;
  --ui:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --fs:13px; --rowpad:6px; --radius:10px; --sidew:212px;
}
html[data-theme=light]{
  --bg:#eef1f4; --panel:#fff; --panel-2:#f7f9fa; --panel-3:#eff2f5; --ink:#10161d; --muted:#5d6b7a;
  --line:#d3d9e0; --line-soft:#e6eaef; --side:#10161d; --side-ink:#c8d4df; --side-active:#1c2733;
  --deny:#b3261e; --deny-bg:#fdeceb; --allow:#1a6b3c; --allow-bg:#eaf5ee;
  --amber:#a2650a; --amber-bg:#fdf3e0; --focus:#1f6feb; --focus-bg:#e7f0fe; --shadow:0 1px 2px rgba(16,22,29,.06);
  --input-bg:#fff; --code-bg:#10161d; --code-ink:#cfe3f5; --chip:#eef1f4;
  --audit:#8250df; --audit-bg:#f3ecfd; --diff-add:#eaf5ee; --diff-del:#fdeceb; --diff-chg:#fdf3e0;
}
html[data-theme=dark]{
  --bg:#0c1015; --panel:#151b23; --panel-2:#1b222c; --panel-3:#212a35; --ink:#e6edf3; --muted:#8b98a5;
  --line:#2b3541; --line-soft:#222a34; --side:#080b0f; --side-ink:#8b98a5; --side-active:#1b222c;
  --deny:#ff7b72; --deny-bg:#3a1d1c; --allow:#6fcf8f; --allow-bg:#16301f;
  --amber:#e3b341; --amber-bg:#3a2f14; --focus:#4d9dff; --focus-bg:#12233c; --shadow:0 1px 2px rgba(0,0,0,.4);
  --input-bg:#0f141a; --code-bg:#080b0f; --code-ink:#a9c9e8; --chip:#212a35;
  --audit:#b694f5; --audit-bg:#2b2140; --diff-add:#16301f; --diff-del:#3a1d1c; --diff-chg:#3a2f14;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:var(--fs)/1.5 var(--ui)}
#app{display:grid;grid-template-columns:var(--sidew) minmax(0,1fr);height:100vh}
button{font:inherit;cursor:pointer;border-radius:7px;border:1px solid var(--line);background:var(--panel);padding:6px 12px;color:var(--ink)}
button:hover{background:var(--panel-2)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--focus);outline-offset:1px}
button.primary{background:var(--focus);color:#fff;border-color:var(--focus)}
button.primary:hover{filter:brightness(1.08)}
button.danger{color:var(--deny);border-color:var(--deny)}
button.danger:hover{background:var(--deny-bg)}
button.ghost{background:transparent;border-color:transparent;color:var(--muted)}
button.ghost:hover{background:var(--panel-2);color:var(--ink)}
button.mini{padding:2px 9px;font-size:11.5px;border-radius:5px}
button:disabled{opacity:.45;cursor:not-allowed}
input[type=text],input[type=search],select,textarea{font:inherit;padding:6px 10px;border:1px solid var(--line);border-radius:7px;background:var(--input-bg);color:var(--ink)}
textarea{font-family:var(--mono);font-size:12px}
label{font-size:12px;color:var(--muted)}
.hidden{display:none!important}
.m{font-family:var(--mono);font-size:calc(var(--fs) - 1.5px)}
.muted{color:var(--muted)}
.small{font-size:11.5px}
kbd{font:11px var(--mono);border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 5px;background:var(--panel-2)}
code{font-family:var(--mono);font-size:.92em;background:var(--chip);padding:1px 5px;border-radius:4px}
a{color:var(--focus)}
.doclink{font-size:11px;color:var(--focus);text-decoration:none;white-space:nowrap;opacity:.85;font-weight:400}
.doclink:hover{text-decoration:underline;opacity:1}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:5px}
::-webkit-scrollbar-track{background:transparent}

/* ---------- sidebar ---------- */
#sidebar{background:var(--side);color:var(--side-ink);display:flex;flex-direction:column;overflow-y:auto}
.logo{padding:16px 16px 12px;color:#fff}
.logo b{font-size:15px;letter-spacing:-.01em;display:flex;align-items:center;gap:8px}
.logo .mark{width:22px;height:22px;border-radius:6px;background:linear-gradient(135deg,var(--focus),#8250df);display:inline-flex;align-items:center;justify-content:center;font-size:12px;color:#fff}
.logo span.v{font-size:10.5px;color:var(--side-ink);font-weight:400;display:block;margin-top:2px}
#nav{flex:1;padding:4px 10px 10px}
.navgroup{margin:12px 6px 4px;font:600 10px/1 var(--ui);text-transform:uppercase;letter-spacing:.1em;color:color-mix(in srgb,var(--side-ink) 65%,transparent)}
.navbtn{display:flex;align-items:center;gap:9px;width:100%;text-align:left;background:transparent;border:0;color:var(--side-ink);padding:7px 10px;border-radius:7px;font:500 12.8px var(--ui);margin-bottom:1px}
.navbtn .ico{width:17px;text-align:center;font-size:13px;opacity:.9}
.navbtn:hover{background:var(--side-active);color:#fff}
.navbtn[aria-current=true]{background:var(--side-active);color:#fff;box-shadow:inset 2px 0 0 var(--focus)}
.navbtn .pill{margin-left:auto;font:600 10px/1.6 var(--mono);background:var(--deny);color:#fff;border-radius:8px;padding:0 6px;min-width:17px;text-align:center}
.navbtn .pill.ok{background:var(--allow)}
.navbtn .pill.warn{background:var(--amber);color:#1a1206}
.navbtn:disabled{opacity:.35;cursor:not-allowed}
.sidefoot{padding:10px 16px 14px;font-size:11px;color:color-mix(in srgb,var(--side-ink) 70%,transparent);border-top:1px solid color-mix(in srgb,var(--side-ink) 15%,transparent)}
.sidefoot .row{display:flex;gap:6px;margin-bottom:8px}
.sidefoot button{background:transparent;border:1px solid color-mix(in srgb,var(--side-ink) 30%,transparent);color:var(--side-ink);padding:3px 9px;font-size:11px}
.sidefoot button:hover{color:#fff;border-color:var(--side-ink)}

/* ---------- main column ---------- */
#maincol{display:flex;flex-direction:column;min-width:0;height:100vh}
#topbar{display:flex;align-items:center;gap:10px;background:var(--panel);border-bottom:1px solid var(--line);padding:8px 14px;flex-wrap:wrap}
#polTabs{display:flex;gap:6px;flex:1;min-width:0;overflow-x:auto;padding-bottom:2px}
.ptab{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--panel-2);border-radius:8px;padding:5px 8px 5px 12px;cursor:pointer;white-space:nowrap;max-width:280px}
.ptab.active{background:var(--focus-bg);border-color:var(--focus)}
.ptab .nm{font-weight:600;font-size:12.5px;overflow:hidden;text-overflow:ellipsis}
.ptab .ty{font:600 9.5px/1.6 var(--ui);text-transform:uppercase;letter-spacing:.05em;padding:0 6px;border-radius:3px;background:var(--chip);color:var(--muted)}
.ptab .ty.base{background:var(--focus-bg);color:var(--focus)}
.ptab .ty.supp{background:var(--audit-bg);color:var(--audit)}
.ptab .dot{width:7px;height:7px;border-radius:50%;background:var(--amber);flex:none}
.ptab .x{border:0;background:transparent;color:var(--muted);padding:0 4px;font-size:14px;border-radius:4px}
.ptab .x:hover{color:var(--deny);background:var(--deny-bg)}
.ptab.empty{border-style:dashed;color:var(--muted);cursor:default}
#topActions{display:flex;gap:7px;align-items:center}

#modeStrip{display:flex;align-items:center;gap:10px;padding:7px 16px;font-size:12.5px;border-bottom:1px solid var(--line);flex-wrap:wrap}
#modeStrip.audit{background:var(--audit-bg)}
#modeStrip.enforce{background:var(--deny-bg)}
#modeStrip.none{background:var(--panel-2);color:var(--muted)}
#modeStrip b.mode{font-size:11px;text-transform:uppercase;letter-spacing:.08em;padding:2px 9px;border-radius:4px;color:#fff}
#modeStrip.audit b.mode{background:var(--audit)}
#modeStrip.enforce b.mode{background:var(--deny)}
#modeStrip .sep{color:var(--muted);opacity:.6}
#modeStrip .spacer{margin-left:auto}

#views{flex:1;overflow-y:auto;padding:18px 20px;scroll-padding-top:10px}
#views>section{max-width:1560px;margin:0 auto}
.viewhead{display:flex;align-items:baseline;gap:12px;margin:0 0 4px;flex-wrap:wrap}
.viewhead h2{margin:0;font-size:19px;letter-spacing:-.01em}
.viewhead .sub{color:var(--muted);font-size:12.5px}
.viewhead .spacer{margin-left:auto}
.crumbs{font-size:11.5px;color:var(--muted);margin-bottom:14px}

/* ---------- cards & layout ---------- */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:16px;overflow:hidden}
.card>h3{margin:0;padding:10px 14px;font:600 11.5px/1.4 var(--ui);text-transform:uppercase;letter-spacing:.07em;color:var(--muted);border-bottom:1px solid var(--line-soft);background:var(--panel-2);display:flex;gap:10px;align-items:center}
.card>h3 .n{margin-left:auto;text-transform:none;letter-spacing:0;font-family:var(--mono);font-size:11.5px;font-weight:400}
.card .pad{padding:14px}
.cols2{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:16px;align-items:start}
.cols3{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px;align-items:start}
.statrow{display:flex;gap:22px;flex-wrap:wrap}
.stat{min-width:90px}
.stat b{display:block;font:600 22px/1.15 var(--ui)}
.stat span{font-size:11.5px;color:var(--muted)}
.stat.deny b{color:var(--deny)}.stat.allow b{color:var(--allow)}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.toolbar input[type=search]{flex:1;min-width:200px}
.scroll{max-height:min(64vh,700px);overflow:auto}
.empty{padding:28px;text-align:center;color:var(--muted)}
.drop{border:2px dashed var(--line);border-radius:var(--radius);padding:34px 20px;text-align:center;background:var(--panel);transition:border-color .12s}
.drop.over{border-color:var(--focus);background:var(--focus-bg)}
.drop h2{margin:0 0 4px;font-size:15px}
.drop p{margin:0 0 12px;color:var(--muted);font-size:12.5px}

/* ---------- tables ---------- */
table{border-collapse:separate;border-spacing:0;width:100%;font-size:calc(var(--fs) - .5px)}
th{text-align:left;font:600 10.5px/1.4 var(--ui);text-transform:uppercase;letter-spacing:.05em;color:var(--muted);padding:8px 10px;border-bottom:1px solid var(--line);background:var(--panel-2);position:sticky;top:0;z-index:2;white-space:nowrap}
th.sortable{cursor:pointer}
th.sortable:hover{color:var(--ink)}
td{padding:var(--rowpad) 10px;border-bottom:1px solid var(--line-soft);vertical-align:middle}
tr:hover>td{background:var(--panel-2)}
tr.changed>td{background:var(--amber-bg)}
td .cell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:420px}
td.wrapok .cell{white-space:normal;word-break:break-word}
td input{font:calc(var(--fs) - 1px) var(--mono);padding:3px 6px;border:1px solid transparent;border-radius:4px;background:transparent;width:100%;color:var(--ink)}
td input:hover{border-color:var(--line)}
td input:focus{border-color:var(--focus);background:var(--input-bg)}
.badge{display:inline-block;font:600 10px/1.7 var(--ui);text-transform:uppercase;letter-spacing:.06em;padding:0 7px;border-radius:3px;white-space:nowrap}
.badge.deny{background:var(--deny-bg);color:var(--deny)}
.badge.allow{background:var(--allow-bg);color:var(--allow)}
.badge.attrib{background:var(--focus-bg);color:var(--focus)}
.badge.mixed,.badge.warn{background:var(--amber-bg);color:var(--amber)}
.badge.orphan,.badge.info{background:var(--chip);color:var(--muted);border:1px solid var(--line)}
.badge.audit{background:var(--audit-bg);color:var(--audit)}
.badge.kernel{background:var(--chip);color:var(--muted);border:1px solid var(--line)}
.badge.user{background:var(--chip);color:var(--muted);border:1px solid var(--line)}
.chip{display:inline-block;font:11px var(--mono);background:var(--chip);border:1px solid var(--line-soft);padding:1px 7px;border-radius:4px;color:var(--muted);margin:1px 2px 1px 0;white-space:nowrap}
.chip.click{cursor:pointer}
.chip.click:hover{border-color:var(--focus);color:var(--focus)}

/* ---------- toggles ---------- */
.opt{display:flex;gap:12px;align-items:flex-start;padding:11px 14px;border-bottom:1px solid var(--line-soft)}
.opt:last-child{border-bottom:0}
.opt .tx{flex:1;min-width:0}
.opt .tx b{font-size:13px}
.opt .tx .xmlstr{font:11px var(--mono);color:var(--muted)}
.opt .tx p{margin:3px 0 0;font-size:12px;color:var(--muted)}
.opt .num{font:600 10.5px/1.9 var(--mono);background:var(--chip);border-radius:4px;min-width:26px;text-align:center;color:var(--muted);flex:none;margin-top:2px}
.opt.on .num{background:var(--focus);color:#fff}
.opt .warntag{font-size:11px;color:var(--amber)}
.sw{position:relative;width:38px;height:21px;flex:none;margin-top:2px;cursor:pointer}
.sw input{position:absolute;opacity:0;width:100%;height:100%;margin:0;cursor:pointer}
.sw .tr{position:absolute;inset:0;background:var(--line);border-radius:11px;transition:background .12s}
.sw .th{position:absolute;top:2.5px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:left .12s;box-shadow:0 1px 2px rgba(0,0,0,.3)}
.sw input:checked~.tr{background:var(--focus)}
.sw input:checked~.th{left:19px}
.sw input:disabled~.tr{opacity:.4}
.sw.big{width:52px;height:28px}
.sw.big .th{width:22px;height:22px;top:3px}
.sw.big input:checked~.th{left:27px}

/* ---------- findings / lint ---------- */
.finding{display:flex;gap:10px;padding:11px 14px;border-bottom:1px solid var(--line-soft);align-items:flex-start}
.finding:last-child{border-bottom:0}
.sev{flex:none;font:600 9.5px/1.8 var(--ui);text-transform:uppercase;letter-spacing:.07em;padding:0 7px;border-radius:3px;margin-top:2px}
.sev.error{background:var(--deny-bg);color:var(--deny)}
.sev.warn{background:var(--amber-bg);color:var(--amber)}
.sev.info{background:var(--chip);color:var(--muted);border:1px solid var(--line)}
.sev.ok{background:var(--allow-bg);color:var(--allow)}
.finding .tx{flex:1;min-width:0}
.finding .tx p{margin:2px 0 0;font-size:12px;color:var(--muted)}
.finding .acts{flex:none;display:flex;gap:6px}

/* ---------- rules list (view) ---------- */
details.rule{border-bottom:1px solid var(--line-soft)}
details.rule>summary{padding:8px 14px;cursor:pointer;display:flex;gap:10px;align-items:center;list-style:none}
details.rule>summary::-webkit-details-marker{display:none}
details.rule>summary:hover{background:var(--panel-2)}
details.rule .title{flex:1;min-width:0;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
details.rule .sub{font:400 11px var(--mono);color:var(--muted);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.details{padding:12px 14px 14px;background:var(--panel-2);border-top:1px solid var(--line-soft)}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px;margin-bottom:10px}
.field label{display:block;font:600 10px/1.6 var(--ui);text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.field .val{font-family:var(--mono);font-size:11.5px;word-break:break-word}
pre.xml{font-family:var(--mono);font-size:11px;background:var(--code-bg);color:var(--code-ink);padding:11px;border-radius:7px;overflow:auto;max-height:300px;margin:0;tab-size:2}
pre.ps{font-family:var(--mono);font-size:11.5px;background:var(--code-bg);color:var(--code-ink);padding:12px;border-radius:7px;overflow:auto;margin:0;white-space:pre-wrap;word-break:break-word}
.codewrap{position:relative;margin-bottom:12px}
.codewrap .copybtn{position:absolute;top:7px;right:7px;font-size:11px;padding:2px 9px;opacity:.85}
mark{background:var(--amber-bg);color:var(--ink);padding:0 1px;border-radius:2px}

/* ---------- triage cards ---------- */
.tri{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:12px}
.tcard{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:8px}
.tcard.done{opacity:.55}
.tcard .t{display:flex;gap:8px;align-items:center}
.tcard .t b{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px}
.tcard .path{font:11px var(--mono);color:var(--muted);word-break:break-all;max-height:48px;overflow:hidden}
.tcard .meta{display:flex;flex-wrap:wrap;gap:4px}
.tcard .acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:auto;padding-top:6px;border-top:1px solid var(--line-soft)}

/* ---------- diff ---------- */
.diffrow{display:flex;gap:10px;padding:7px 14px;border-bottom:1px solid var(--line-soft);align-items:flex-start;font-size:12.5px}
.diffrow .tag{flex:none;font:600 10px/1.8 var(--mono);width:52px;text-align:center;border-radius:4px}
.diffrow.add .tag{background:var(--allow-bg);color:var(--allow)}
.diffrow.del .tag{background:var(--deny-bg);color:var(--deny)}
.diffrow.chg .tag{background:var(--amber-bg);color:var(--amber)}
.diffrow>div{flex:1;min-width:0}
.diffrow .m{word-break:break-all}
.diffrow.add{background:color-mix(in srgb,var(--diff-add) 45%,transparent)}
.diffrow.del{background:color-mix(in srgb,var(--diff-del) 45%,transparent)}

/* ---------- ledger ---------- */
.entry{padding:8px 13px;border-bottom:1px solid var(--line-soft);font-size:12.5px;display:flex;gap:8px}
.entry .bar{width:3px;border-radius:2px;background:var(--amber);flex:none}
.entry.undone{opacity:.45}
.entry.undone .bar{background:var(--line)}
.entry .what{flex:1;min-width:0}
.entry .verb{font-weight:600}
.entry .verb.del{color:var(--deny)}
.entry .detail{font-family:var(--mono);font-size:11px;color:var(--muted);word-break:break-word}

/* ---------- modal & toast ---------- */
#modalHost{position:fixed;inset:0;z-index:100;display:none;align-items:flex-start;justify-content:center;background:rgba(0,0,0,.5);padding:5vh 16px;overflow:auto}
#modalHost.show{display:flex}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 40px rgba(0,0,0,.35);width:min(680px,100%);max-height:88vh;display:flex;flex-direction:column}
.modal.wide{width:min(920px,100%)}
.modal>h3{margin:0;padding:14px 18px;border-bottom:1px solid var(--line-soft);font-size:15px;display:flex;align-items:center}
.modal>h3 .x{margin-left:auto;border:0;background:transparent;font-size:18px;color:var(--muted);padding:0 6px}
.modal .body{padding:16px 18px;overflow-y:auto}
.modal .foot{padding:12px 18px;border-top:1px solid var(--line-soft);display:flex;gap:8px;justify-content:flex-end;background:var(--panel-2);border-radius:0 0 12px 12px}
.fform{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.fform .full{grid-column:1/-1}
.fform label{display:block;font:600 10.5px/1.8 var(--ui);text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.fform input[type=text],.fform select,.fform textarea{width:100%}
.seg{display:inline-flex;background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:2px;gap:2px}
.seg button{border:0;background:transparent;padding:4px 12px;border-radius:6px;font-size:12px;color:var(--muted)}
.seg button[aria-pressed=true]{background:var(--panel);color:var(--ink);box-shadow:var(--shadow);font-weight:600}
.seg.denyallow button[aria-pressed=true].d{background:var(--deny);color:#fff}
.seg.denyallow button[aria-pressed=true].a{background:var(--allow);color:#fff}
#toastHost{position:fixed;right:18px;bottom:18px;z-index:120;display:flex;flex-direction:column;gap:8px;max-width:380px}
.toast{background:var(--code-bg);color:var(--code-ink);border-radius:9px;padding:10px 14px;font-size:12.5px;box-shadow:0 6px 24px rgba(0,0,0,.4);border-left:3px solid var(--focus);animation:tin .18s ease}
.toast.err{border-left-color:var(--deny)}
.toast.ok{border-left-color:var(--allow)}
@keyframes tin{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}
@media(prefers-reduced-motion:reduce){.toast{animation:none}}

/* ---------- inspector ---------- */
.chain{display:flex;flex-direction:column;gap:0;position:relative}
.certcard{border:1px solid var(--line);border-radius:9px;padding:10px 13px;background:var(--panel-2);margin-bottom:8px;position:relative}
.certcard.leaf{border-color:var(--focus)}
.certcard .cn{font-weight:600;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.certcard .kv{font:11px var(--mono);color:var(--muted);word-break:break-all;margin-top:2px}
.hashrow{display:flex;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line-soft);font-size:12px}
.hashrow:last-child{border-bottom:0}
.hashrow .k{width:150px;flex:none;color:var(--muted)}
.hashrow .v{font:11px var(--mono);word-break:break-all;flex:1}
.verdict{border-radius:9px;padding:12px 15px;font-size:13px;margin-bottom:12px;border:1px solid}
.verdict.blocked{background:var(--deny-bg);border-color:var(--deny)}
.verdict.allowed{background:var(--allow-bg);border-color:var(--allow)}
.verdict.unknown{background:var(--amber-bg);border-color:var(--amber)}

/* ---------- misc ---------- */
.bigswitch{display:flex;align-items:center;gap:14px;padding:14px;border-radius:var(--radius);border:1px solid var(--line);margin-bottom:16px}
.bigswitch.audit{background:var(--audit-bg);border-color:var(--audit)}
.bigswitch.enforce{background:var(--deny-bg);border-color:var(--deny)}
.bigswitch .tx b{font-size:14px}
.bigswitch .tx p{margin:2px 0 0;font-size:12px;color:var(--muted)}
.explain p{margin:0 0 10px;font-size:13px;line-height:1.65}
.explain p:last-child{margin-bottom:0}
.explain b.k{color:var(--focus)}
.libgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.libcard{border:1px solid var(--line);border-radius:var(--radius);padding:13px 15px;background:var(--panel);cursor:pointer;box-shadow:var(--shadow)}
.libcard:hover{border-color:var(--focus)}
.libcard b{display:block;margin-bottom:3px}
.libcard p{margin:0;font-size:12px;color:var(--muted)}
.filelist .frow{display:flex;gap:10px;align-items:center;padding:8px 14px;border-bottom:1px solid var(--line-soft);cursor:pointer}
.filelist .frow:hover{background:var(--panel-2)}
.filelist .frow .nm{font-weight:600}
.filelist .frow .m{color:var(--muted)}
.progressbar{height:8px;background:var(--panel-3);border:1px solid var(--line-soft);border-radius:4px;overflow:hidden;flex:1}
.progressbar>div{height:100%;background:var(--focus)}
.progressbar>div.deny{background:var(--deny)}
.progressbar>div.allow{background:var(--allow)}
.barrow{display:flex;align-items:center;gap:10px;font-size:12.5px;margin-bottom:7px}
.barrow>span{width:130px;color:var(--muted);flex:none}
.barrow>b{font-family:var(--mono);width:52px;text-align:right;flex:none}

/* ---------- text patch engine (byte-preserving export) ---------- */
const rxEsc=v=>String(v).replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
const escA=v=>String(v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
function tagRange(txt,id,from){
  const re=new RegExp('\\s(?:ID|Id|id)\\s*=\\s*"'+rxEsc(id)+'"');
  const m=re.exec(txt.slice(from||0));
  if(!m)return null;
  const at=(from||0)+m.index,start=txt.lastIndexOf('<',at);
  if(start<0)return null;
  let i=start,q=null;
  while(i<txt.length){const c=txt[i];
    if(q){if(c===q)q=null}
    else if(c==='"'||c==="'")q=c;
    else if(c==='>')break;
    i++}
  if(i>=txt.length)return null;
  const tag=txt.slice(start,i+1),nm=/^<\s*([\w:.-]+)/.exec(tag);
  if(!nm)return null;
  return {start,end:i+1,text:tag,name:nm[1],self:/\/\s*>$/.test(tag)};
}
function openTagRange(txt,tagName,from){
  const re=new RegExp('<'+rxEsc(tagName)+'(?=[\\s/>])','g');
  re.lastIndex=from||0;
  const m=re.exec(txt);
  if(!m)return null;
  const start=m.index;
  let i=start,q=null;
  while(i<txt.length){const c=txt[i];
    if(q){if(c===q)q=null}
    else if(c==='"'||c==="'")q=c;
    else if(c==='>')break;
    i++}
  if(i>=txt.length)return null;
  const tag=txt.slice(start,i+1);
  return {start,end:i+1,text:tag,name:tagName,self:/\/\s*>$/.test(tag)};
}
function elementEnd(txt,r){
  if(r.self)return r.end;
  let depth=1,i=r.end;
  const open=new RegExp('<'+rxEsc(r.name)+'(?=[\\s/>])','g'),close=new RegExp('</'+rxEsc(r.name)+'\\s*>','g');
  while(depth>0){
    open.lastIndex=i;close.lastIndex=i;
    const mo=open.exec(txt),mc=close.exec(txt);
    if(!mc)return -1;
    if(mo&&mo.index<mc.index){
      const inner=openTagRange(txt,r.name,mo.index);
      if(inner&&!inner.self)depth++;
      i=inner?inner.end:mo.index+1;
    }else{depth--;i=mc.index+mc[0].length}
  }
  return i;
}
function setAttrText(tag,name,value){
  const re=new RegExp('(\\s'+rxEsc(name)+'\\s*=\\s*")([^"]*)(")','i');
  if(re.test(tag)){
    if(value==='')return tag.replace(new RegExp('\\s'+rxEsc(name)+'\\s*=\\s*"[^"]*"','i'),'');
    return tag.replace(re,(_,a,b,c)=>a+escA(value)+c);
  }
  if(value==='')return tag;
  return tag.replace(/(\s*)(\/?)>$/,(_,sp,sl)=>' '+name+'="'+escA(value)+'"'+sp+sl+'>');

  return txt=>{

}
function cutById(txt,id){
  const r=tagRange(txt,id);if(!r)return txt;
  let end=r.self?r.end:elementEnd(txt,r);

  const body=txt.slice(scopeStart,scopeEnd);
  const re=new RegExp('[ \\t]*\\n?[ \\t]*<'+rxEsc(tag)+'\\b[^>]*\\s'+rxEsc(attr)+'\\s*=\\s*"'+rxEsc(val)+'"[^>]*(?:\\/>|>\\s*<\\/'+rxEsc(tag)+'>)','g');
  return txt.slice(0,scopeStart)+body.replace(re,'')+txt.slice(scopeEnd);
}
function pDelete(descs){
  return txt=>{
    for(const d of descs){
      if(d.t==='id')txt=cutById(txt,d.id);
      else txt=cutRefs(txt,d.tag,d.attr,d.val,d.owner);
    }
    return txt;
  };
}
function indentSnippet(xml,base,unit){
  return xml.split('\n').map((l,i)=>base+unit+l).join('\n');
}
/* Insert xml snippet into a container element (by tag name, or by element ID).
   Creates the container if missing, expanding self-closing forms. */
function pInsert(container,xml,containerId){
  return txt=>{
    const unit=detectIndent(txt);
    let r=containerId?tagRange(txt,containerId):openTagRange(txt,container);
    if(r&&containerId&&r.name!==container)return null;
    if(!r){
      // container missing entirely: create after nearest preceding sibling in canonical order
      const idx=CONTAINER_ORDER.indexOf(container);
      let insertAt=-1,base='';
      for(let i=idx-1;i>=0&&insertAt<0;i--){
        const prev=openTagRange(txt,CONTAINER_ORDER[i]);
        if(prev){
          const e=prev.self?prev.end:elementEnd(txt,prev);
          if(e>=0)insertAt=e;
        }
      }
      if(insertAt<0){
        const rootClose=txt.lastIndexOf('</SiPolicy>');
        if(rootClose<0)return null;
        insertAt=rootClose;
        while(insertAt>0&&(txt[insertAt-1]===' '||txt[insertAt-1]==='\t'))insertAt--;
        if(insertAt>0&&txt[insertAt-1]==='\n')insertAt--;
      }
      const block='\n'+unit+'<'+container+'>\n'+indentSnippet(xml,unit,unit)+'\n'+unit+'</'+container+'>';
      return txt.slice(0,insertAt)+block+txt.slice(insertAt);
    }
    // find indentation of the container's line
    let ls=txt.lastIndexOf('\n',r.start);
    const base=ls>=0?(txt.slice(ls+1,r.start).match(/^[ \t]*/)||[''])[0]:'';
    if(r.self){
      const opened=r.text.replace(/\s*\/\s*>$/,'>');
      const block=opened+'\n'+indentSnippet(xml,base,unit)+'\n'+base+'</'+r.name+'>';
      return txt.slice(0,r.start)+block+txt.slice(r.end);
    }
    const end=elementEnd(txt,r);
    if(end<0)return null;
    const closeStart=txt.lastIndexOf('</',end-1);
    let s=closeStart;
    while(s>0&&(txt[s-1]===' '||txt[s-1]==='\t'))s--;
    const hadNl=s>0&&txt[s-1]==='\n';
    const ins=(hadNl?'':'\n')+indentSnippet(xml,base,unit)+'\n'+base;
    return txt.slice(0,(hadNl?s-1:closeStart))+(hadNl?'\n':'')+indentSnippet(xml,base,unit)+'\n'+base+txt.slice(closeStart);
  };
}
function pAddOption(optionString){
  return pInsert('Rules','<Rule>\n  <Option>'+escA(optionString)+'</Option>\n</Rule>');
}
function pRemoveOption(optionString){
  return txt=>{
    const re=new RegExp('[ \\t]*\\n?[ \\t]*<Rule>\\s*<Option>\\s*'+rxEsc(optionString)+'\\s*</Option>\\s*</Rule>','i');
    if(!re.test(txt))return null;
    return txt.replace(re,'');
  };
}
function pReplaceWholeElement(id,xml){
  return txt=>{
    const r=tagRange(txt,id);if(!r)return null;
    const end=r.self?r.end:elementEnd(txt,r);
    if(end<0)return null;
    return txt.slice(0,r.start)+xml+txt.slice(end);
  };
}

/* ---------- toasts, modal, misc ui helpers ---------- */
function toast(msg,type){
  const t=document.createElement('div');
  t.className='toast'+(type?' '+type:'');
  t.textContent=msg;
  $('toastHost').appendChild(t);
  setTimeout(()=>{t.style.opacity='0';t.style.transition='opacity .3s';setTimeout(()=>t.remove(),350)},type==='err'?6000:3200);
}
function copyText(text,label){
  navigator.clipboard&&navigator.clipboard.writeText(text).then(()=>toast((label||'Copied')+' to clipboard','ok'),()=>toast('Copy failed','err'));
}
let modalState=null;
function showModal(o){
  modalState=o;
  const host=$('modalHost');
  host.innerHTML='<div class="modal'+(o.wide?' wide':'')+'" role="dialog" aria-modal="true">'+
    '<h3>'+esc(o.title)+'<button class="x" data-mact="close" aria-label="Close">×</button></h3>'+
    '<div class="body">'+o.body+'</div>'+
    (o.buttons&&o.buttons.length?'<div class="foot">'+o.buttons.map((b,i)=>'<button data-mact="'+i+'" class="'+(b.cls||'')+'">'+esc(b.label)+'</button>').join('')+'</div>':'')+
    '</div>';
  host.classList.add('show');
  if(o.onOpen)o.onOpen(host);
}
function closeModal(){$('modalHost').classList.remove('show');$('modalHost').innerHTML='';modalState=null}
$('modalHost').addEventListener('click',e=>{
  if(e.target.id==='modalHost'){closeModal();return}
  const b=e.target.closest('[data-mact]');
  if(!b)return;
  const a=b.getAttribute('data-mact');
  if(a==='close'){closeModal();return}
  const btn=modalState&&modalState.buttons&&modalState.buttons[+a];
  if(btn&&btn.onClick){if(btn.onClick($('modalHost'))!==false&&!btn.keepOpen)closeModal()}
  else closeModal();
});
function confirmModal(title,msg,okLabel,danger){
  return new Promise(res=>{
    showModal({title,body:'<p style="margin:0">'+msg+'</p>',buttons:[
      {label:'Cancel',onClick:()=>{res(false)}},
      {label:okLabel||'Confirm',cls:danger?'danger':'primary',onClick:()=>{res(true)}}
    ]});
  });
}
function download(name,text,mime){
  const b=new Blob([text],{type:mime||'application/xml'}),u=URL.createObjectURL(b),a=document.createElement('a');
  a.href=u;a.download=name;document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(u);a.remove()},0);
}

/* ---------- prefs + recents (IndexedDB for file handles) ---------- */
function savePrefs(){try{localStorage.setItem('acs.prefs',JSON.stringify(App.ui))}catch(e){}}
function loadPrefs(){
  try{const p=JSON.parse(localStorage.getItem('acs.prefs')||'null');if(p)Object.assign(App.ui,p)}catch(e){}
  if(!localStorage.getItem('acs.prefs')&&window.matchMedia&&!window.matchMedia('(prefers-color-scheme: dark)').matches)App.ui.theme='light';
}
function idb(){
  return new Promise((res,rej)=>{
    const rq=indexedDB.open('acs-store',1);
    rq.onupgradeneeded=()=>{rq.result.createObjectStore('recents',{keyPath:'name'})};
    rq.onsuccess=()=>res(rq.result);rq.onerror=()=>rej(rq.error);
  });
}
async function rememberRecent(name,handle){
  try{
    const db=await idb();
    const tx=db.transaction('recents','readwrite');
    tx.objectStore('recents').put({name,handle:handle||null,ts:Date.now()});
    await new Promise(r=>{tx.oncomplete=r;tx.onerror=r});
    loadRecents();
  }catch(e){}
}
async function loadRecents(){
  try{
    const db=await idb();
    const tx=db.transaction('recents','readonly');
    const rq=tx.objectStore('recents').getAll();
    rq.onsuccess=()=>{
      App.recents=(rq.result||[]).sort((a,b)=>b.ts-a.ts).slice(0,12);
      if(App.view==='library')renderView();
    };
  }catch(e){}
}
async function forgetRecent(name){
  try{const db=await idb();db.transaction('recents','readwrite').objectStore('recents').delete(name);setTimeout(loadRecents,50)}catch(e){}
}

/* ---------- file open/save ---------- */
const FSA=!!window.showOpenFilePicker;
async function openViaPicker(){
  if(!FSA){$('fileInput').value='';$('fileInput').click();return}
  try{
    const handles=await showOpenFilePicker({multiple:true,types:[{description:'App Control policy XML',accept:{'application/xml':['.xml']}}]});
    for(const h of handles){
      const f=await h.getFile();
      openPolicyText(await f.text(),f.name,h);
    }
  }catch(e){if(e&&e.name!=='AbortError')toast('Open failed: '+e.message,'err')}
}
async function openRecent(rec){
  if(rec.handle){
    try{
      const perm=await rec.handle.queryPermission({mode:'readwrite'});
      if(perm!=='granted'){
        const p2=await rec.handle.requestPermission({mode:'readwrite'});
        if(p2!=='granted'&&p2!=='prompt'){/* fall through, try read */}
      }
      const f=await rec.handle.getFile();
      openPolicyText(await f.text(),f.name,rec.handle);
      return;
    }catch(e){toast('Could not reopen '+rec.name+' — pick it again ('+(e.message||e.name)+')','err');return}
  }
  toast('That entry has no saved file handle — open it via the Open button.','err');
}
async function savePolicy(p,as){
  if(!p)return;
  const out=exportText(p);
  if(FSA&&(as||!p.handle)){
    try{
      const h=await showSaveFilePicker({suggestedName:p.fileName||'policy.xml',types:[{description:'App Control policy XML',accept:{'application/xml':['.xml']}}]});
      p.handle=h;p.fileName=h.name;
    }catch(e){if(e&&e.name==='AbortError')return;toast('Save failed: '+e.message,'err');return}
  }
  if(p.handle){
    try{
      const w=await p.handle.createWritable();
      await w.write(out.text);await w.close();
      p.raw=out.text;
      afterCleanSave(p,out);
      rememberRecent(p.fileName,p.handle);
      toast('Saved '+p.fileName+(out.patched?'':' (rebuilt from parsed document)'),'ok');
      return;
    }catch(e){toast('Save failed: '+e.message,'err');return}
  }
  const name=(p.fileName||'policy.xml').replace(/\.xml$/i,'')+'_edited.xml';
  download(name,out.text);
  p.raw=out.text;
  afterCleanSave(p,out);
  toast('Downloaded '+name+' (browser cannot write in place here)','ok');
}
function afterCleanSave(p,out){
  p.ledger.forEach(e=>e.saved=true);
  p.dirty=false;
  if(!out.patched)p.raw=out.text;
  reindex(p);
  renderShell();renderView();
}

<script>
/* ============================================================
   CHUNK C — policy model: parse, index, mutate, validate, merge
   ============================================================ */

/* ---------- serialization ---------- */
function serializeEl(el,base,unit){
  const name=el.nodeName;
  const attrs=Array.from(el.attributes||[]).map(a=>' '+a.name+'="'+escA(a.value)+'"').join('');
  const children=Array.from(el.children||[]);
  if(!children.length){
    const text=(el.textContent||'').trim();
    if(!text)return base+'<'+name+attrs+' />';
    return base+'<'+name+attrs+'>'+escA(text)+'</'+name+'>';
  }
  return base+'<'+name+attrs+'>\n'+children.map(c=>serializeEl(c,base+unit,unit)).join('\n')+'\n'+base+'</'+name+'>';
}
function serializeDoc(p){
  const unit=p.raw?detectIndent(p.raw):'  ';
  const decl=(p.raw&&/^\s*<\?xml[^>]*\?>/.exec(p.raw))?/^\s*(<\?xml[^>]*\?>)/.exec(p.raw)[1]:'<?xml version="1.0" encoding="utf-8"?>';
  return decl+'\n'+serializeEl(p.doc.documentElement,'',unit)+'\n';
}
/* lazy replace-or-insert of a DOM element (by its ID attr) into a container — serialized at export time */
function pSyncEl(el,containerTag){
  return txt=>{
    const unit=detectIndent(txt);
    const id=att(el,'ID','Id');
    if(!el.parentNode){ /* element was removed again (undo interplay) — treat as no-op */ return txt }
    if(id){
      const r=tagRange(txt,id);
      if(r){
        const end=r.self?r.end:elementEnd(txt,r);
        if(end<0)return null;
        let ls=txt.lastIndexOf('\n',r.start);
        const base=ls>=0?(txt.slice(ls+1,r.start).match(/^[ \t]*/)||[''])[0]:'';
        return txt.slice(0,r.start)+serializeEl(el,base,unit).replace(/^[ \t]*/,'')+txt.slice(end);
      }
    }
    return pInsert(containerTag,serializeEl(el,'',unit))(txt);
  };
}
/* lazy whole-container sync (for Settings, HvciOptions and other ID-less containers) */
function pSyncContainer(tag,getEl){
  return txt=>{
    const unit=detectIndent(txt);
    const el=getEl();
    const r=openTagRange(txt,tag);
    if(!el){
      if(!r)return txt;
      const end=r.self?r.end:elementEnd(txt,r);
      if(end<0)return null;
      let s=r.start;
      while(s>0&&(txt[s-1]===' '||txt[s-1]==='\t'))s--;
      if(s>0&&txt[s-1]==='\n')s--;
      return txt.slice(0,s)+txt.slice(end);
    }
    if(r){
      const end=r.self?r.end:elementEnd(txt,r);
      if(end<0)return null;
      let ls=txt.lastIndexOf('\n',r.start);
      const base=ls>=0?(txt.slice(ls+1,r.start).match(/^[ \t]*/)||[''])[0]:'';
      return txt.slice(0,r.start)+serializeEl(el,base,unit).replace(/^[ \t]*/,'')+txt.slice(end);
    }
    return pInsertWhole(el)(txt);
  };
}
function pInsertWhole(el){
  return txt=>{
    const unit=detectIndent(txt);
    const tag=el.nodeName;
    const idx=CONTAINER_ORDER.indexOf(tag);
    let insertAt=-1;
    for(let i=idx-1;i>=0&&insertAt<0;i--){
      const prev=openTagRange(txt,CONTAINER_ORDER[i]);
      if(prev){const e=prev.self?prev.end:elementEnd(txt,prev);if(e>=0)insertAt=e}
    }
    if(insertAt<0){
      const rc=txt.lastIndexOf('</SiPolicy>');
      if(rc<0)return null;
      insertAt=rc;
      while(insertAt>0&&(txt[insertAt-1]===' '||txt[insertAt-1]==='\t'))insertAt--;
      if(insertAt>0&&txt[insertAt-1]==='\n')insertAt--;
    }
    return txt.slice(0,insertAt)+'\n'+serializeEl(el,unit,unit)+txt.slice(insertAt);
  };
}
function pRootAttr(name,value){
  return txt=>{
    const r=openTagRange(txt,'SiPolicy');
    if(!r)return null;
    return txt.slice(0,r.start)+setAttrText(r.text,name,value)+txt.slice(r.end);
  };
}
function exportText(p){
  if(!p.raw)return {text:serializeDoc(p),patched:true};
  let txt=p.raw,ok=true;
  for(const e of p.ledger){
    if(e.undone)continue;
    if(!e.patch){ok=false;break}
    const r=e.patch(txt);
    if(r==null){ok=false;break}
    txt=r;
  }
  if(!ok)return {text:serializeDoc(p),patched:false};
  return {text:txt,patched:true};
}

/* ---------- parse & index ---------- */
function parsePolicyText(text,fileName){
  let doc;
  try{
    doc=new DOMParser().parseFromString(text,'application/xml');
    if(doc.querySelector('parsererror'))throw new Error('not valid XML');
    if(!doc.documentElement||ln(doc.documentElement)!=='sipolicy')throw new Error('root element is not SiPolicy');
  }catch(e){
    toast(fileName+': '+(e.message||'could not parse'),'err');
    return null;
  }
  const p={
    pid:'p'+(App.seq++),fileName:fileName||'policy.xml',handle:null,
    raw:text,doc,dirty:false,ledger:[],ui:{ruleQ:'',ruleDecision:'all',ruleKind:'all',signerQ:'',xmlQ:''}
  };
  reindex(p);
  return p;
}
function openPolicyText(text,fileName,handle){
  const p=parsePolicyText(text,fileName);
  if(!p)return null;
  p.handle=handle||null;
  App.policies.push(p);
  App.activeId=p.pid;
  if(handle)rememberRecent(p.fileName,handle);
  setView(App.view==='library'?'dashboard':App.view);
  renderShell();renderView();
  toast('Opened '+p.fileName,'ok');
  return p;
}
function closePolicy(pid){
  const i=App.policies.findIndex(x=>x.pid===pid);
  if(i<0)return;
  App.policies.splice(i,1);
  if(App.activeId===pid)App.activeId=App.policies.length?App.policies[App.policies.length-1].pid:null;
  if(!App.policies.length&&['dashboard','options','rules','signers','validate','deploy','xml'].includes(App.view))setView('library');
  renderShell();renderView();
}
function policySetting(p,valueName){
  for(const s of all(p.doc.documentElement,'Setting')){
    if((att(s,'Provider')||'').toLowerCase()==='policyinfo'&&(att(s,'ValueName')||'').toLowerCase()===valueName.toLowerCase()){
      const v=all(s,'String')[0];
      return v?(v.textContent||'').trim():'';
    }
  }
  return '';
}
function ruleKindOf(el){
  if(att(el,'Hash'))return 'hash';
  if(att(el,'FilePath'))return 'path';
  if(att(el,'PackageFamilyName'))return 'pfn';
  if(att(el,'FileName'))return 'name';
  if(att(el,'InternalName'))return 'internal';
  if(att(el,'FileDescription'))return 'description';
  if(att(el,'ProductName'))return 'product';
  return 'other';
}
const KIND_LABEL={hash:'Hash',path:'Path',pfn:'Packaged app',name:'File name',internal:'Internal name',description:'File description',product:'Product name',other:'Other'};
function ruleValueOf(el){
  return att(el,'Hash')||att(el,'FilePath')||att(el,'PackageFamilyName')||att(el,'FileName')||att(el,'InternalName')||att(el,'FileDescription')||att(el,'ProductName')||'';
}
function ruleKey(el){
  const tag=ln(el)==='fileattrib'?'attrib':ln(el);
  const parts=['FileName','InternalName','FileDescription','ProductName','PackageFamilyName','PackageVersion','MinimumFileVersion','MaximumFileVersion','Hash','FilePath','AppIDs','Type'].map(a=>(att(el,a)||'').toLowerCase());
  return tag+'|'+parts.join('|');
}
function signerKey(sg,attribKeyById){
  const cr=kids(sg,'CertRoot')[0];
  const ekus=kids(sg,'CertEKU').map(e=>att(e,'ID','Id')).sort().join(',');
  const attribs=kids(sg,'FileAttribRef').map(r=>{
    const rid=att(r,'RuleID','RuleId','ID');
    return attribKeyById&&attribKeyById[rid]?attribKeyById[rid]:rid;
  }).sort().join(';');
  return [(cr?att(cr,'Type'):'')+':'+(cr?att(cr,'Value'):''),
    att(kids(sg,'CertPublisher')[0]||null,'Value'),att(kids(sg,'CertIssuer')[0]||null,'Value'),
    att(kids(sg,'CertOemID')[0]||null,'Value'),att(sg,'SignTimeAfter'),ekus,attribs].join('|').toLowerCase();
}
function reindex(p){
  const root=p.doc.documentElement;
  const type=att(root,'PolicyType');
  const legacyTypeId=(all(root,'PolicyTypeID')[0]||{textContent:''}).textContent.trim();
  const policyId=(all(root,'PolicyID')[0]||{textContent:''}).textContent.trim();
  const basePolicyId=(all(root,'BasePolicyID')[0]||{textContent:''}).textContent.trim();
  p.info={
    name:policySetting(p,'Name')||p.fileName.replace(/\.xml$/i,''),
    idSetting:policySetting(p,'Id'),
    version:(all(root,'VersionEx')[0]||{textContent:''}).textContent.trim(),
    policyId,basePolicyId,legacyTypeId,
    platformId:(all(root,'PlatformID')[0]||{textContent:''}).textContent.trim(),
    format:legacyTypeId&&!policyId?'legacy':'multi',
    type:type||(legacyTypeId&&!policyId?'Base Policy (legacy format)':(policyId&&basePolicyId?(policyId.toLowerCase()===basePolicyId.toLowerCase()?'Base Policy':'Supplemental Policy'):'Base Policy')),
    hvci:(all(root,'HvciOptions')[0]||{textContent:''}).textContent.trim()
  };
  p.isSupplemental=/supplemental/i.test(p.info.type);
  p.isAppId=/appid/i.test(p.info.type);
  // options
  p.options=[];
  for(const r of all(root,'Rule')){
    if(!r.parentNode||ln(r.parentNode)!=='rules')continue;
    const o=kids(r,'Option')[0];
    if(!o)continue;
    const s=(o.textContent||'').trim();
    p.options.push({el:r,string:s,meta:OPT_BY_STRING.get(s.toLowerCase())||null});
  }
  p.hasOption=str=>p.options.some(o=>o.string.toLowerCase()===String(str).toLowerCase());
  p.audit=p.hasOption('Enabled:Audit Mode');
  // ekus
  p.ekus=all(root,'EKU').filter(e=>e.parentNode&&ln(e.parentNode)==='ekus').map(e=>({el:e,id:att(e,'ID','Id'),value:(att(e,'Value')||'').toUpperCase(),friendly:att(e,'FriendlyName'),known:KNOWN_EKUS[(att(e,'Value')||'').toUpperCase()]||null}));
  // scenarios + membership maps
  p.scenarios=[];
  const ruleScen={},signerScen={};
  for(const sc of all(root,'SigningScenario')){
    const val=att(sc,'Value');
    const entry={el:sc,value:val,id:att(sc,'ID','Id'),name:att(sc,'FriendlyName')||((SCENARIO_META[val]||{}).label)||('Scenario '+val),allowedSigners:[],deniedSigners:[],ruleRefs:[]};
    for(const n of all(sc,'AllowedSigner')){const sid=att(n,'SignerId','SignerID','ID');if(sid){entry.allowedSigners.push(sid);(signerScen[sid]=signerScen[sid]||{allow:[],deny:[]}).allow.push(val)}}
    for(const n of all(sc,'DeniedSigner')){const sid=att(n,'SignerId','SignerID','ID');if(sid){entry.deniedSigners.push(sid);(signerScen[sid]=signerScen[sid]||{allow:[],deny:[]}).deny.push(val)}}
    for(const n of all(sc,'FileRuleRef')){const rid=att(n,'RuleID','RuleId','ID');if(rid){entry.ruleRefs.push(rid);(ruleScen[rid]=ruleScen[rid]||[]).push(val)}}
    p.scenarios.push(entry);
  }
  p.ruleScen=ruleScen;p.signerScen=signerScen;
  // file rules
  p.rules=[];p.rulesById={};
  const frParent=all(root,'FileRules')[0]||null;
  const attribKeyById={};
  if(frParent){
    for(const el of kids(frParent)){
      const tag=el.nodeName;const lntag=ln(el);
      if(!['allow','deny','fileattrib','filerule'].includes(lntag))continue;
      const id=att(el,'ID','Id');
      const frType=lntag==='filerule'?(att(el,'Type')||''):'';
      let decision=lntag==='allow'?'allow':lntag==='deny'?'deny':lntag==='fileattrib'?'attrib':(frType.toLowerCase()==='match'?'allow':frType.toLowerCase()==='exclude'?'deny':'attrib');
      const scen=ruleScen[id]||[];
      const rec={el,id,tag,kind:ruleKindOf(el),value:ruleValueOf(el),friendly:att(el,'FriendlyName'),
        min:att(el,'MinimumFileVersion'),max:att(el,'MaximumFileVersion'),decision,scen,viaSigners:[],key:ruleKey(el)};
      if(lntag==='fileattrib')attribKeyById[id]=rec.key;
      p.rules.push(rec);p.rulesById[id]=rec;
    }
  }
  // signers
  p.signers=[];p.signersById={};
  const ciSet=new Set(),updSet=new Set(),supSet=new Set();
  for(const n of all(root,'CiSigner'))ciSet.add(att(n,'SignerId','SignerID','ID'));
  for(const n of all(root,'UpdatePolicySigner'))updSet.add(att(n,'SignerId','SignerID','ID'));
  for(const n of all(root,'SupplementalPolicySigner'))supSet.add(att(n,'SignerId','SignerID','ID'));
  for(const sg of all(root,'Signer')){
    if(!sg.parentNode||ln(sg.parentNode)!=='signers')continue;
    const id=att(sg,'ID','Id');
    const cr=kids(sg,'CertRoot')[0];
    const attribRefs=kids(sg,'FileAttribRef').map(r=>{
      const rid=att(r,'RuleID','RuleId','ID');
      const rule=p.rulesById[rid];
      if(rule)rule.viaSigners.push(id);
      return {el:r,id:rid,rule:rule||null};
    });
    const mem=signerScen[id]||{allow:[],deny:[]};
    const rec={el:sg,id,name:att(sg,'Name')||id,
      rootType:cr?att(cr,'Type'):'',rootValue:cr?(att(cr,'Value')||'').toUpperCase():'',
      publisher:att(kids(sg,'CertPublisher')[0]||null,'Value'),
      issuer:att(kids(sg,'CertIssuer')[0]||null,'Value'),
      oem:att(kids(sg,'CertOemID')[0]||null,'Value'),
      signTimeAfter:att(sg,'SignTimeAfter'),
      ekuRefs:kids(sg,'CertEKU').map(e=>att(e,'ID','Id')),
      attribRefs,allowIn:mem.allow,denyIn:mem.deny,
      inCi:ciSet.has(id),inUpdate:updSet.has(id),inSuppl:supSet.has(id)};
    rec.key=signerKey(sg,attribKeyById);
    rec.scope=rec.attribRefs.length?'file-scoped':(rec.publisher?'publisher':(rec.oem?'oem':(rec.ekuRefs.length?'eku':'ca-wide')));
    p.signers.push(rec);p.signersById[id]=rec;
  }
  // decision resolution for FileAttribs (through signers)
  for(const r of p.rules){
    if(r.tag.toLowerCase()!=='fileattrib')continue;
    const ds=new Set();
    for(const sid of r.viaSigners){
      const s=p.signersById[sid];
      if(!s)continue;
      if(s.allowIn.length)ds.add('allow');
      if(s.denyIn.length)ds.add('deny');
    }
    r.decision=ds.size===0?'orphan':(ds.size>1?'mixed':(ds.has('allow')?'allow':'deny'));
    if(r.decision==='orphan'&&r.viaSigners.length)r.decision='attrib';
  }
  for(const r of p.rules){
    if((r.tag.toLowerCase()==='allow'||r.tag.toLowerCase()==='deny')&&!r.scen.length)r.orphanRef=true;
  }
  p.counts={
    allow:p.rules.filter(r=>r.decision==='allow').length+p.signers.filter(s=>s.allowIn.length).length,
    deny:p.rules.filter(r=>r.decision==='deny').length+p.signers.filter(s=>s.denyIn.length).length,
    rules:p.rules.length,signers:p.signers.length,
    hashRules:p.rules.filter(r=>r.kind==='hash').length
  };
  p.lint=validatePolicy(p);
  p.family=null; // computed on render (needs other open policies)
}

/* ---------- ledger & mutations ---------- */
function log(p,e){e.undone=false;e.time=new Date();p.ledger.push(e);p.dirty=true}
function activeLedgerIdx(p){for(let i=p.ledger.length-1;i>=0;i--)if(!p.ledger[i].undone)return i;return -1}
function undoLast(p){
  const i=activeLedgerIdx(p);if(i<0)return;
  p.ledger[i].undo();p.ledger[i].undone=true;
  if(!p.ledger.some(e=>!e.undone))p.dirty=false;
  reindex(p);renderShell();renderView();
}
function revertAll(p){
  let i;
  while((i=activeLedgerIdx(p))>=0){p.ledger[i].undo();p.ledger[i].undone=true}
  p.dirty=false;
  reindex(p);renderShell();renderView();
}
function afterEdit(p){reindex(p);renderShell();renderView()}

function mSetAttr(p,el,name,value,label){
  const before=el.hasAttribute(name)?el.getAttribute(name):null;
  const cur=before===null?'':before;
  if(cur===value)return false;
  if(value==='')el.removeAttribute(name);else el.setAttribute(name,value);
  const id=att(el,'ID','Id');
  log(p,{verb:'Edited',target:label||id,detail:name+': '+(before===null?'(none)':before)+' → '+(value===''?'(removed)':value),
    patch:id?pAttr(id,name,value):pSyncEl(el,'FileRules'),
    undo:()=>{if(before===null)el.removeAttribute(name);else el.setAttribute(name,before)}});
  return true;
}
function ensureTopEl(p,tagName){
  const root=p.doc.documentElement;
  let el=all(root,tagName).find(e=>e.parentNode===root);
  if(el)return el;
  el=p.doc.createElementNS(NS,tagName);
  const order=CONTAINER_ORDER;
  const idx=order.indexOf(tagName);
  let anchor=null;
  for(let i=idx+1;i<order.length&&!anchor;i++)anchor=all(root,order[i]).find(e=>e.parentNode===root)||null;
  root.insertBefore(el,anchor);
  return el;
}
function mSetTopText(p,tagName,value,label){
  const root=p.doc.documentElement;
  let el=all(root,tagName).find(e=>e.parentNode===root);
  const existed=!!el,before=el?(el.textContent||'').trim():null;
  if(existed&&before===value)return false;
  if(!el)el=ensureTopEl(p,tagName);
  el.textContent=value;
  log(p,{verb:'Edited',target:label||tagName,detail:(existed?before:'(none)')+' → '+value,
    patch:existed?pSetTextByTag(el.nodeName,value):pSyncContainer(el.nodeName,()=>el),
    undo:()=>{if(existed)el.textContent=before;else if(el.parentNode)el.parentNode.removeChild(el)}});
  return true;
}
function mSetVersion(p,value){return mSetTopText(p,'VersionEx',value,'Policy version')}
function mBumpVersion(p,part){
  const cur=vparse(p.info.version||'1.0.0.0');
  const i=part==null?3:part;
  cur[i]=Math.min(65535,cur[i]+1);
  for(let j=i+1;j<4;j++)cur[j]=0;
  const v=cur.join('.');
  mSetVersion(p,v);
  return v;
}
function mToggleOption(p,optString,on){
  const root=p.doc.documentElement;
  const existing=p.options.find(o=>o.string.toLowerCase()===optString.toLowerCase());
  if(on&&existing)return false;
  if(!on&&!existing)return false;
  if(on){
    const rules=ensureTopEl(p,'Rules');
    const rule=p.doc.createElementNS(NS,'Rule');
    const opt=p.doc.createElementNS(NS,'Option');
    opt.textContent=optString;
    rule.appendChild(opt);rules.appendChild(rule);
    log(p,{verb:'Enabled',target:'option',detail:optString,
      patch:pAddOption(optString),
      undo:()=>{if(rule.parentNode)rule.parentNode.removeChild(rule)}});
  }else{
    const rule=existing.el,parent=rule.parentNode,next=rule.nextSibling;
    parent.removeChild(rule);
    log(p,{verb:'Removed',target:'option',detail:optString,danger:/audit mode/i.test(optString),
      patch:pRemoveOption(optString),
      undo:()=>{parent.insertBefore(rule,next)}});
  }
  return true;
}
function nextFreeId(p,prefix){
  let n=1,id;
  const used=new Set();
  for(const el of all(p.doc.documentElement,'*'))if(att(el,'ID','Id'))used.add(att(el,'ID','Id').toUpperCase());
  do{id=prefix+'_'+n;n++}while(used.has(id.toUpperCase()));
  return id;
}
function ensureScenario(p,value){
  let sc=p.scenarios.find(s=>s.value===String(value));
  if(sc)return {el:sc.el,created:false};
  const scs=ensureTopEl(p,'SigningScenarios');
  const el=p.doc.createElementNS(NS,'SigningScenario');
  el.setAttribute('Value',String(value));
  el.setAttribute('ID',(SCENARIO_META[value]||{}).id||('ID_SIGNINGSCENARIO_'+value));
  el.setAttribute('FriendlyName',(SCENARIO_META[value]||{}).label||('Scenario '+value));
  el.appendChild(p.doc.createElementNS(NS,'ProductSigners'));
  scs.appendChild(el);
  return {el,created:true};
}
function scenarioChild(p,scEl,names){
  let parent=scEl;
  for(const nm of names){
    let c=kids(parent,nm)[0];
    if(!c){c=p.doc.createElementNS(NS,nm);parent.appendChild(c)}
    parent=c;
  }
  return parent;
}
function mAddFileRule(p,{tag,attrs,scenarios,label}){
  const fr=ensureTopEl(p,'FileRules');
  const el=p.doc.createElementNS(NS,tag);
  const id=attrs.ID||nextFreeId(p,'ID_'+(tag==='Deny'?'DENY':tag==='Allow'?'ALLOW':'FILEATTRIB')+'_ACS');
  el.setAttribute('ID',id);
  for(const k of Object.keys(attrs)){if(k!=='ID'&&attrs[k]!=null&&attrs[k]!=='')el.setAttribute(k,attrs[k])}
  fr.appendChild(el);
  const added=[el],syncScens=[];
  const refEls=[];
  for(const v of (scenarios||[])){
    const {el:scEl}=ensureScenario(p,v);
    const frr=scenarioChild(p,scEl,['ProductSigners','FileRulesRef']);
    const ref=p.doc.createElementNS(NS,'FileRuleRef');
    ref.setAttribute('RuleID',id);
    frr.appendChild(ref);
    refEls.push(ref);
    syncScens.push(scEl);
  }
  const unit=p.raw?detectIndent(p.raw):'  ';
  const ruleXml=serializeEl(el,'',unit);
  log(p,{verb:'Added',target:label||id,detail:tag+' '+(attrs.FriendlyName||attrs.FileName||attrs.Hash&&('hash '+String(attrs.Hash).slice(0,12)+'…')||attrs.FilePath||attrs.PackageFamilyName||id)+(scenarios&&scenarios.length?' → scenario '+scenarios.join(', '):''),
    patch:txt=>{
      let t=pInsert('FileRules',ruleXml)(txt);
      if(t==null)return null;
      for(const scEl of syncScens){
        t=pSyncEl(scEl,'SigningScenarios')(t);
        if(t==null)return null;
      }
      return t;
    },
    undo:()=>{
      if(el.parentNode)el.parentNode.removeChild(el);
      for(const ref of refEls)if(ref.parentNode)ref.parentNode.removeChild(ref);
    }});
  return id;
}
function mDeleteRule(p,rule){
  const nodes=[rule.el],descs=[{t:'id',id:rule.id}];
  for(const n of all(p.doc.documentElement,'FileRuleRef'))
    if(att(n,'RuleID','RuleId','ID')===rule.id)nodes.push(n);
  descs.push({t:'ref',tag:'FileRuleRef',attr:'RuleID',val:rule.id});
  for(const n of all(p.doc.documentElement,'FileAttribRef'))
    if(att(n,'RuleID','RuleId','ID')===rule.id)nodes.push(n);
  descs.push({t:'ref',tag:'FileAttribRef',attr:'RuleID',val:rule.id});
  for(const n of all(p.doc.documentElement,'ExceptAllowRule'))
    if(att(n,'AllowRuleID','RuleID','RuleId','ID')===rule.id)nodes.push(n);
  for(const n of all(p.doc.documentElement,'ExceptDenyRule'))
    if(att(n,'DenyRuleID','RuleID','RuleId','ID')===rule.id)nodes.push(n);
  const saved=nodes.map(n=>({n,parent:n.parentNode,next:n.nextSibling}));
  for(const s of saved)if(s.parent)s.parent.removeChild(s.n);
  log(p,{verb:'Deleted',target:rule.friendly||rule.value||rule.id,danger:true,
    detail:'Removed '+rule.tag+' '+rule.id+' and its references',
    patch:pDelete(descs),
    undo:()=>{for(let i=saved.length-1;i>=0;i--){const s=saved[i];if(s.parent)s.parent.insertBefore(s.n,s.next)}}});
}
function mDeleteSigner(p,signer){
  const nodes=[signer.el];
  const descs=[{t:'id',id:signer.id}];
  for(const tag of ['AllowedSigner','DeniedSigner','CiSigner','UpdatePolicySigner','SupplementalPolicySigner']){
    for(const n of all(p.doc.documentElement,tag))
      if(att(n,'SignerId','SignerID','ID')===signer.id)nodes.push(n);
    descs.push({t:'ref',tag,attr:'SignerId',val:signer.id});
  }
  const saved=nodes.map(n=>({n,parent:n.parentNode,next:n.nextSibling}));
  for(const s of saved)if(s.parent)s.parent.removeChild(s.n);
  log(p,{verb:'Deleted',target:signer.name,danger:true,
    detail:'Removed signer '+signer.id+' and its references (file-attribute rules it pointed to were kept)',
    patch:pDelete(descs),
    undo:()=>{for(let i=saved.length-1;i>=0;i--){const s=saved[i];if(s.parent)s.parent.insertBefore(s.n,s.next)}}});
}
function mAddSigner(p,o){
  /* o: {name, rootType, rootValue, publisher, issuer, oem, ekuValue, ekuName, attrib:{FileName,MinimumFileVersion,...}|null, scenarios:[{value,decision}], alsoCi, forUpdate, forSupplemental, label} */
  const doc=p.doc;
  const added=[],syncScens=[];
  let attribId=null,attribEl=null;
  if(o.attrib&&Object.keys(o.attrib).some(k=>o.attrib[k])){
    const fr=ensureTopEl(p,'FileRules');
    attribEl=doc.createElementNS(NS,'FileAttrib');
    attribId=nextFreeId(p,'ID_FILEATTRIB_ACS');
    attribEl.setAttribute('ID',attribId);
    for(const k of Object.keys(o.attrib))if(o.attrib[k])attribEl.setAttribute(k,o.attrib[k]);
    fr.appendChild(attribEl);added.push(attribEl);
  }
  let ekuId=null,ekuEl=null;
  if(o.ekuValue){
    const container=ensureTopEl(p,'EKUs');
    const existing=p.ekus.find(e=>e.value===o.ekuValue.toUpperCase());
    if(existing)ekuId=existing.id;
    else{
      ekuEl=doc.createElementNS(NS,'EKU');
      ekuId=nextFreeId(p,'ID_EKU_ACS');
      ekuEl.setAttribute('ID',ekuId);
      ekuEl.setAttribute('Value',o.ekuValue);
      if(o.ekuName)ekuEl.setAttribute('FriendlyName',o.ekuName);
      container.appendChild(ekuEl);added.push(ekuEl);
    }
  }
  const signers=ensureTopEl(p,'Signers');
  const sg=doc.createElementNS(NS,'Signer');
  const sid=nextFreeId(p,'ID_SIGNER_ACS');
  sg.setAttribute('ID',sid);
  sg.setAttribute('Name',o.name||'Custom signer');
  const cr=doc.createElementNS(NS,'CertRoot');
  cr.setAttribute('Type',o.rootType||'TBS');
  cr.setAttribute('Value',o.rootValue||'');
  sg.appendChild(cr);
  if(ekuId){const ek=doc.createElementNS(NS,'CertEKU');ek.setAttribute('ID',ekuId);sg.appendChild(ek)}
  if(o.issuer){const ci=doc.createElementNS(NS,'CertIssuer');ci.setAttribute('Value',o.issuer);sg.appendChild(ci)}
  if(o.publisher){const cp=doc.createElementNS(NS,'CertPublisher');cp.setAttribute('Value',o.publisher);sg.appendChild(cp)}
  if(o.oem){const co=doc.createElementNS(NS,'CertOemID');co.setAttribute('Value',o.oem);sg.appendChild(co)}
  if(attribId){const fr2=doc.createElementNS(NS,'FileAttribRef');fr2.setAttribute('RuleID',attribId);sg.appendChild(fr2)}
  signers.appendChild(sg);added.push(sg);
  const refEls=[];
  for(const s of (o.scenarios||[])){
    const {el:scEl}=ensureScenario(p,s.value);
    const listTag=s.decision==='deny'?'DeniedSigners':'AllowedSigners';
    const container=scenarioChild(p,scEl,['ProductSigners',listTag]);
    const ref=doc.createElementNS(NS,s.decision==='deny'?'DeniedSigner':'AllowedSigner');
    ref.setAttribute('SignerId',sid);
    container.appendChild(ref);
    refEls.push(ref);syncScens.push(scEl);
  }
  let ciRef=null;
  if(o.alsoCi){
    const cis=ensureTopEl(p,'CiSigners');
    ciRef=doc.createElementNS(NS,'CiSigner');
    ciRef.setAttribute('SignerId',sid);
    cis.appendChild(ciRef);
  }
  let updRef=null;
  if(o.forUpdate){
    const ups=ensureTopEl(p,'UpdatePolicySigners');
    updRef=doc.createElementNS(NS,'UpdatePolicySigner');
    updRef.setAttribute('SignerId',sid);
    ups.appendChild(updRef);
  }
  let supRef=null;
  if(o.forSupplemental){
    const sps=ensureTopEl(p,'SupplementalPolicySigners');
    supRef=doc.createElementNS(NS,'SupplementalPolicySigner');
    supRef.setAttribute('SignerId',sid);
    sps.appendChild(supRef);
  }
  const unit=p.raw?detectIndent(p.raw):'  ';
  log(p,{verb:'Added',target:o.label||o.name||sid,
    detail:'Signer '+sid+(o.publisher?' · '+o.publisher:'')+(attribId?' + FileAttrib '+attribId:'')+((o.scenarios||[]).map(s=>' · '+(s.decision==='deny'?'denied':'allowed')+' in '+((SCENARIO_META[s.value]||{}).label||s.value)).join('')),
    patch:txt=>{
      let t=txt;
      if(attribEl){t=pInsert('FileRules',serializeEl(attribEl,'',unit))(t);if(t==null)return null}
      if(ekuEl){t=pInsert('EKUs',serializeEl(ekuEl,'',unit))(t);if(t==null)return null}
      t=pInsert('Signers',serializeEl(sg,'',unit))(t);if(t==null)return null;
      for(const scEl of syncScens){t=pSyncEl(scEl,'SigningScenarios')(t);if(t==null)return null}
      if(ciRef){t=pInsert('CiSigners','<CiSigner SignerId="'+escA(sid)+'" />')(t);if(t==null)return null}
      if(updRef){t=pInsert('UpdatePolicySigners','<UpdatePolicySigner SignerId="'+escA(sid)+'" />')(t);if(t==null)return null}
      if(supRef){t=pInsert('SupplementalPolicySigners','<SupplementalPolicySigner SignerId="'+escA(sid)+'" />')(t);if(t==null)return null}
      return t;
    },
    undo:()=>{
      for(const el of [sg,attribEl,ekuEl,ciRef,updRef,supRef].concat(refEls))if(el&&el.parentNode)el.parentNode.removeChild(el);
    }});
  return sid;
}
function mSetPolicyInfo(p,valueName,newVal){
  const root=p.doc.documentElement;
  let settings=all(root,'Settings').find(e=>e.parentNode===root);
  let setting=null;
  if(settings)setting=kids(settings,'Setting').find(s=>(att(s,'Provider')||'').toLowerCase()==='policyinfo'&&(att(s,'ValueName')||'').toLowerCase()===valueName.toLowerCase())||null;
  const before=setting?policySetting(p,valueName):null;
  if(before===newVal)return false;
  let created=[];
  if(!settings){settings=ensureTopEl(p,'Settings');created.push(settings)}
  if(!setting){
    setting=p.doc.createElementNS(NS,'Setting');
    setting.setAttribute('Provider','PolicyInfo');
    setting.setAttribute('Key','Information');
    setting.setAttribute('ValueName',valueName);
    const v=p.doc.createElementNS(NS,'Value'),s=p.doc.createElementNS(NS,'String');
    v.appendChild(s);setting.appendChild(v);settings.appendChild(setting);
    created.push(setting);
  }
  const strEl=all(setting,'String')[0];
  const strBefore=strEl.textContent;
  strEl.textContent=newVal;
  log(p,{verb:'Edited',target:'Policy '+valueName.toLowerCase(),detail:(before==null?'(none)':before)+' → '+newVal,
    patch:pSyncContainer('Settings',()=>all(p.doc.documentElement,'Settings').find(e=>e.parentNode===p.doc.documentElement)||null),
    undo:()=>{
      strEl.textContent=strBefore;
      for(const el of created)if(el.parentNode&&el!==settings)el.parentNode.removeChild(el);
      if(created.includes(settings)&&settings.parentNode&&!kids(settings,'Setting').length)settings.parentNode.removeChild(settings);
    }});
  return true;
}
function mSetRootAttr(p,name,value,label){
  const root=p.doc.documentElement;
  const before=root.hasAttribute(name)?root.getAttribute(name):null;
  if((before===null?'':before)===value)return false;
  if(value==='')root.removeAttribute(name);else root.setAttribute(name,value);
  log(p,{verb:'Edited',target:label||name,detail:(before===null?'(none)':before)+' → '+(value===''?'(removed)':value),
    patch:pRootAttr(name,value),
    undo:()=>{if(before===null)root.removeAttribute(name);else root.setAttribute(name,before)}});
  return true;
}
function mResetPolicyGuid(p,alsoBase){
  const g=guid();
  mSetTopText(p,'PolicyID',g,'PolicyID');
  if(alsoBase)mSetTopText(p,'BasePolicyID',g,'BasePolicyID');
  return g;

/* ---------- validation ---------- */
function validatePolicy(p){
  const F=[];
  const add=(sev,title,detail,fix)=>F.push({sev,title,detail,fix});
  const root=p.doc.documentElement;
  const info=p.info;
  // identity
  if(!info.version)add('error','Missing VersionEx','Every policy needs a <VersionEx> version like 1.0.0.0.');
  else if(!vvalid(info.version))add('error','Version format invalid','VersionEx "'+info.version+'" must be four dotted numbers, each 0-65535.');
  if(info.format==='multi'){
    if(!info.policyId)add('error','Missing PolicyID','Multiple-policy format requires a <PolicyID> GUID. The binary must be named {PolicyID}.cip.');
    else if(!GUID_RX.test(info.policyId))add('error','PolicyID is not a GUID','"'+info.policyId+'" should look like {A6D7E31F-3C49-4C2E-9B11-4E1A2D8F0C55}.');
    if(!info.basePolicyId)add('error','Missing BasePolicyID','Multiple-policy format requires <BasePolicyID>.');
    else if(!GUID_RX.test(info.basePolicyId))add('error','BasePolicyID is not a GUID','"'+info.basePolicyId+'"');
    if(info.policyId&&info.basePolicyId){
      const same=info.policyId.toLowerCase()===info.basePolicyId.toLowerCase();
      if(/supplemental/i.test(info.type)&&same)add('error','Supplemental points at itself','A supplemental policy’s BasePolicyID must be the GUID of its base policy, not its own PolicyID.');
      if(/base/i.test(info.type)&&!same&&!p.isAppId)add('warn','Base policy IDs differ','For a base policy, PolicyID and BasePolicyID are normally identical. As written, Windows will treat this as a supplemental of '+info.basePolicyId+'.');
    }
  }else{
    add('info','Legacy single-policy format','This policy uses the pre-1903 format (PolicyTypeID, deployed as SiPolicy.p7b). Only one such policy can be active per machine.',
      {label:'Convert to multiple-policy format',run:pp=>{convertLegacyToMulti(pp)}});
  }
  // duplicate IDs
  const seen=new Map();
  for(const el of all(root,'*')){
    const id=att(el,'ID','Id');
    if(!id)continue;
    const k=id.toUpperCase();
    if(seen.has(k)&&['allow','deny','fileattrib','filerule','signer','eku','signingscenario'].includes(ln(el)))
      add('error','Duplicate ID: '+id,'Both a <'+seen.get(k)+'> and a <'+el.nodeName+'> use this ID. Merges with duplicate IDs produce broken policies.');
    else seen.set(k,el.nodeName);
  }
  // broken refs
  const ids=new Set(Array.from(all(root,'*')).map(e=>att(e,'ID','Id')).filter(Boolean).map(s=>s.toUpperCase()));
  for(const n of all(root,'FileRuleRef')){
    const rid=att(n,'RuleID','RuleId','ID');
    if(rid&&!ids.has(rid.toUpperCase()))add('error','Broken FileRuleRef: '+rid,'A signing scenario references a file rule that does not exist.',
      {label:'Remove reference',run:pp=>{removeBrokenRef(pp,'FileRuleRef','RuleID',rid)}});
  }
  for(const n of all(root,'FileAttribRef')){
    const rid=att(n,'RuleID','RuleId','ID');
    if(rid&&!ids.has(rid.toUpperCase()))add('error','Broken FileAttribRef: '+rid,'A signer references a FileAttrib rule that does not exist.',
      {label:'Remove reference',run:pp=>{removeBrokenRef(pp,'FileAttribRef','RuleID',rid)}});
  }
  for(const tag of ['AllowedSigner','DeniedSigner','CiSigner','UpdatePolicySigner','SupplementalPolicySigner']){
    for(const n of all(root,tag)){
      const sid=att(n,'SignerId','SignerID','ID');
      if(sid&&!ids.has(sid.toUpperCase()))add('error','Broken '+tag+': '+sid,'References a signer that does not exist.',
        {label:'Remove reference',run:pp=>{removeBrokenRef(pp,tag,'SignerId',sid)}});
    }
  }
  for(const n of all(root,'CertEKU')){
    const eid=att(n,'ID','Id');
    if(eid&&!ids.has(eid.toUpperCase()))add('error','Broken CertEKU reference: '+eid,'A signer references an EKU that is not defined in <EKUs>.');
  }
  // orphans
  const orphanAttribs=p.rules.filter(r=>r.tag.toLowerCase()==='fileattrib'&&!r.viaSigners.length);
  if(orphanAttribs.length)add('warn',orphanAttribs.length+' unreferenced FileAttrib rule'+(orphanAttribs.length>1?'s':''),
    'No signer points at: '+orphanAttribs.slice(0,6).map(r=>r.id).join(', ')+(orphanAttribs.length>6?'…':'')+'. They have no effect.',
    {label:'Delete them',run:pp=>{orphanAttribs.forEach(r=>{const rr=pp.rulesById[r.id];if(rr)mDeleteRule(pp,rr)});afterEdit(pp)}});
  const deadRules=p.rules.filter(r=>['allow','deny'].includes(r.tag.toLowerCase())&&!r.scen.length);
  if(deadRules.length)add('warn',deadRules.length+' rule'+(deadRules.length>1?'s':'')+' not referenced by any signing scenario',
    'Allow/Deny rules only apply when a <FileRuleRef> lists them under a scenario: '+deadRules.slice(0,6).map(r=>r.id).join(', ')+(deadRules.length>6?'…':''),
    {label:'Reference in user-mode scenario',run:pp=>{
      const {el:scEl}=ensureScenario(pp,12);
      deadRules.forEach(r=>{
        const rr=pp.rulesById[r.id];if(!rr)return;
        const frr=scenarioChild(pp,scEl,['ProductSigners','FileRulesRef']);
        const ref=pp.doc.createElementNS(NS,'FileRuleRef');ref.setAttribute('RuleID',r.id);frr.appendChild(ref);
      });
      log(pp,{verb:'Added',target:'scenario references',detail:deadRules.length+' FileRuleRef entries in user-mode scenario',
        patch:pSyncEl(scEl,'SigningScenarios'),undo:()=>{}});
      afterEdit(pp);
    }});
  const orphanSigners=p.signers.filter(s=>!s.allowIn.length&&!s.denyIn.length&&!s.inCi&&!s.inUpdate&&!s.inSuppl);
  if(orphanSigners.length)add('warn',orphanSigners.length+' signer'+(orphanSigners.length>1?'s':'')+' never referenced',
    'Not in any scenario, CiSigners, UpdatePolicySigners or SupplementalPolicySigners: '+orphanSigners.slice(0,5).map(s=>s.id).join(', ')+(orphanSigners.length>5?'…':''));
  // exact duplicates
  const byKey=new Map();
  for(const r of p.rules){
    if(!byKey.has(r.key))byKey.set(r.key,[]);
    byKey.get(r.key).push(r);
  }
  let dupCount=0,dupSample=[];
  for(const [k,list] of byKey){
    const dups=list.filter(r=>['allow','deny'].includes(r.tag.toLowerCase()));
    const grouped={};
    for(const r of dups)(grouped[r.tag.toLowerCase()]=grouped[r.tag.toLowerCase()]||[]).push(r);
    for(const tag of Object.keys(grouped))if(grouped[tag].length>1){dupCount+=grouped[tag].length-1;if(dupSample.length<4)dupSample.push(grouped[tag].map(r=>r.id).join(' = '))}
  }
  if(dupCount)add('info',dupCount+' duplicate rule'+(dupCount>1?'s':'')+' (identical content)','Same attributes, different IDs: '+dupSample.join('; ')+'. Rule bloat grows the binary and Intune payloads.');
  // allow+deny conflict on identical content
  for(const [k,list] of byKey){
    const hasA=list.some(r=>r.tag.toLowerCase()==='allow'),hasD=list.some(r=>r.tag.toLowerCase()==='deny');
    if(hasA&&hasD)add('warn','Allow and Deny on identical content','Rules '+list.map(r=>r.id).join(', ')+' target the same thing. Deny always wins, so the allow is dead.');
  }
  // deny CertRoot also allowed (dead allows)
  const allowRoots={};
  for(const s of p.signers)if(s.allowIn.length&&s.rootValue)(allowRoots[s.rootValue]=allowRoots[s.rootValue]||[]).push(s);
  for(const s of p.signers){
    if(!s.denyIn.length||s.attribRefs.length||s.publisher||s.oem||s.ekuRefs.length)continue;
    const clash=allowRoots[s.rootValue];
    if(clash&&clash.length)add('error','CA-wide deny kills allow rules','Denied signer '+s.id+' ('+esc(s.name)+') has the same CertRoot as allowed signer'+(clash.length>1?'s':'')+' '+clash.map(x=>x.id).join(', ')+'. Deny wins — those allows are dead.');
    else if(!clash)add('warn','CA-wide deny: '+s.id,esc(s.name)+' is denied with no publisher, EKU, OEM or file attribute narrowing — every file chaining to this CA is blocked in '+(s.denyIn.map(v=>(SCENARIO_META[v]||{label:v}).label).join(', ')||'its scenarios')+'.');
  }
  // deny version semantics gotcha
  const denyMinZero=p.rules.filter(r=>{
    const isDeny=r.decision==='deny'||r.tag.toLowerCase()==='deny';
    return isDeny&&r.min==='0.0.0.0'&&!r.max&&r.kind!=='hash'&&r.kind!=='path';
  });
  if(denyMinZero.length)add('warn','Deny rules that match almost nothing','In DENY rules, MinimumFileVersion means "this version and lower". '+denyMinZero.length+' deny rule'+(denyMinZero.length>1?'s':'')+' ('+denyMinZero.slice(0,4).map(r=>r.id).join(', ')+(denyMinZero.length>4?'…':'')+') set MinimumFileVersion="0.0.0.0" with no maximum — matching only version 0.0.0.0. To block every version use MinimumFileVersion="'+VMAX+'" or drop version attributes.',
    {label:'Fix: set '+VMAX,run:pp=>{
      denyMinZero.forEach(r=>{const rr=pp.rulesById[r.id];if(rr)mSetAttr(pp,rr.el,'MinimumFileVersion',VMAX,rr.id)});
      afterEdit(pp);
    }});
  // allows colliding with MS block recommendations
  const riskyAllows=p.rules.filter(r=>{
    if(r.decision!=='allow'&&r.tag.toLowerCase()!=='allow')return false;
    const nm=(r.value||'').toLowerCase();
    return BLOCK_RECS.includes(nm);
  });
  if(riskyAllows.length)add('warn','Allowing binaries from Microsoft’s recommended block list',
    riskyAllows.slice(0,6).map(r=>r.value).join(', ')+(riskyAllows.length>6?'…':'')+' can be abused to bypass App Control. Microsoft recommends blocking them in allow-list policies.');
  const vulnAllows=p.rules.filter(r=>(r.decision==='allow'||r.tag.toLowerCase()==='allow')&&VULN_DRIVERS.includes((r.value||'').toLowerCase()));
  if(vulnAllows.length)add('warn','Allowing known-vulnerable driver names',vulnAllows.map(r=>r.value).join(', ')+' appear on public vulnerable-driver lists.');
  // path rules
  const pathRules=p.rules.filter(r=>r.kind==='path');
  for(const r of pathRules){
    const v=r.value||'';
    if(/(^|\\)(users|programdata)\\|%temp%|%appdata%|%userprofile%|\\temp\\|\\downloads\\/i.test(v)&&(r.decision==='allow'||r.tag.toLowerCase()==='allow'))

    if(v==='*'||/^%OSDRIVE%\\\*$/i.test(v))

    if(r.scen.includes('131'))add('error','Path rule in kernel scenario: '+r.id,'FilePath rules are user-mode only; the kernel scenario reference will not work.');
  }

    const badOpts=p.options.filter(o=>o.meta&&o.meta.n!=null&&!SUPPL_OK.has(o.meta.n));
    if(badOpts.length)add('warn','Options not valid in a supplemental policy',badOpts.map(o=>o.meta.n+' ('+o.string+')').join(', ')+' — only options 5, 6, 7, 13, 14, 18 apply; the rest are inherited from the base.',
      {label:'Remove them',run:pp=>{badOpts.forEach(o=>mToggleOption(pp,o.string,false));afterEdit(pp)}});
    const denies=p.rules.filter(r=>r.tag.toLowerCase()==='deny').length+p.signers.filter(s=>s.denyIn.length).length;
    if(denies)add('warn','Deny rules in a supplemental policy','Supplemental policies can only expand what the base allows. '+denies+' deny rule'+(denies>1?'s are':' is')+' unlikely to have any effect here — put denies in the base policy.');
  }else if(info.format==='multi'&&!p.isAppId){
    if(!p.hasOption('Enabled:Allow Supplemental Policies'))add('info','Supplemental policies not allowed','Without option 17, no supplemental policy can attach to this base.');
  }
  // signing
  if(!p.hasOption('Enabled:Unsigned System Integrity Policy')){
    const upd=all(root,'UpdatePolicySigner').length;
    if(!upd)add('error','Signed policy without UpdatePolicySigners','Option 6 is absent, so this policy must be deployed SIGNED — but no UpdatePolicySigners are defined. You could permanently lock yourself out of updating it.');
    else add('info','Policy must be deployed signed','Option 6 (allow unsigned policy) is absent. Sign the binary and remember: version must only ever go up.');
  }
  // UMCI
  const userScen=p.scenarios.find(s=>s.value==='12');
  if(userScen&&(userScen.allowedSigners.length||userScen.ruleRefs.length)&&!p.hasOption('Enabled:UMCI')&&!p.isAppId&&!p.isSupplemental)
    add('warn','User-mode rules without UMCI','The user-mode scenario has rules, but option 0 (Enabled:UMCI) is missing — user-mode code is not validated at all without it.');
  // CiSigners mirror
  if(userScen){
    const ciSet=new Set(p.signers.filter(s=>s.inCi).map(s=>s.id));
    const missing=userScen.allowedSigners.filter(sid=>!ciSet.has(sid));
    if(missing.length&&all(root,'CiSigner').length)
      add('info','User-mode allowed signers missing from CiSigners',missing.slice(0,5).join(', ')+(missing.length>5?'…':'')+' — tooling normally mirrors user-mode allowed signers into <CiSigners>.',
        {label:'Mirror them',run:pp=>{
          const cis=ensureTopEl(pp,'CiSigners');
          const addedRefs=[];
          missing.forEach(sid=>{const el=pp.doc.createElementNS(NS,'CiSigner');el.setAttribute('SignerId',sid);cis.appendChild(el);addedRefs.push(el)});
          log(pp,{verb:'Added',target:'CiSigners',detail:missing.length+' signer references mirrored',
            patch:txt=>{let t=txt;for(const sid of missing){t=pInsert('CiSigners','<CiSigner SignerId="'+escA(sid)+'" />')(t);if(t==null)return null}return t},
            undo:()=>{addedRefs.forEach(el=>{if(el.parentNode)el.parentNode.removeChild(el)})}});
          afterEdit(pp);
        }});
  }
  // recovery + servicing hints
  if(!p.audit&&!p.isSupplemental){
    if(!p.hasOption('Enabled:Boot Audit On Failure'))add('info','No boot-failure fallback','Option 10 makes a machine fall back to audit if a boot-critical driver fails — cheap insurance for enforced policies.');
    if(!p.hasOption('Enabled:Advanced Boot Options Menu'))add('info','F8 menu disabled','Enforced policies disable the advanced boot menu unless option 9 is set. Consider keeping it during rollout.');
  }
  if(!p.hasOption('Enabled:Update Policy No Reboot')&&!p.isSupplemental)add('info','Policy updates need a reboot','Option 16 lets future updates apply without rebooting.');
  if(p.hasOption('Enabled:Intelligent Security Graph Authorization')&&!p.hasOption('Enabled:Invalidate EAs on Reboot'))
    add('info','ISG without EA invalidation','With option 14 on, option 15 is recommended so cached trust gets revalidated.');
  if(p.hasOption('Enabled:Managed Installer'))
    add('info','Managed installer needs AppLocker plumbing','Option 13 only works when an AppLocker ManagedInstaller rule collection is deployed and the Application Identity service runs. See Deploy tab for the snippet.');
  // size estimate
  const xmlSize=(p.raw||'').length;
  const est=Math.round(xmlSize*0.55);
  if(est>350*1024)add('warn','Policy likely exceeds Intune custom-OMA-URI limits','XML is '+fmtBytes(xmlSize)+' (~'+fmtBytes(est)+' as binary). Custom OMA-URI policies cap around 350 KB — consider splitting into supplementals or replacing hash bloat ('+p.counts.hashRules+' hash rules) with publisher rules.');
  else if(p.counts.hashRules>500)add('info',p.counts.hashRules+' hash rules','Hash rules churn on every app update. Consider publisher or file-attribute rules for maintainability.');
  if(!F.length)add('ok','No findings','Structure, references and common pitfalls all check out.');
  return F;
}
function removeBrokenRef(p,tag,attr,val){
  const nodes=[];
  for(const n of all(p.doc.documentElement,tag))
    if(att(n,attr,'SignerID','RuleId','ID')===val)nodes.push(n);
  if(!nodes.length)return;
  const saved=nodes.map(n=>({n,parent:n.parentNode,next:n.nextSibling}));
  saved.forEach(s=>{if(s.parent)s.parent.removeChild(s.n)});
  log(p,{verb:'Deleted',target:'broken reference',danger:true,detail:tag+' '+attr+'="'+val+'" ('+nodes.length+'×)',
    patch:pDelete([{t:'ref',tag,attr,val}]),
    undo:()=>{for(let i=saved.length-1;i>=0;i--){const s=saved[i];if(s.parent)s.parent.insertBefore(s.n,s.next)}}});
  afterEdit(p);
}
function convertLegacyToMulti(p){
  const g=guid();
  mSetRootAttr(p,'PolicyType','Base Policy');
  mSetTopText(p,'PolicyID',g,'PolicyID');
  mSetTopText(p,'BasePolicyID',g,'BasePolicyID');
  const typeIdEl=all(p.doc.documentElement,'PolicyTypeID').find(e=>e.parentNode===p.doc.documentElement);
  if(typeIdEl){
    const parent=typeIdEl.parentNode,next=typeIdEl.nextSibling,keep=typeIdEl;
    parent.removeChild(typeIdEl);
    log(p,{verb:'Removed',target:'PolicyTypeID',detail:'legacy element removed for multiple-policy format',
      patch:txt=>{
        const r=openTagRange(txt,'PolicyTypeID');
        if(!r)return txt;
        const end=r.self?r.end:elementEnd(txt,r);
        let s=r.start;
        while(s>0&&(txt[s-1]===' '||txt[s-1]==='\t'))s--;
        if(s>0&&txt[s-1]==='\n')s--;
        return txt.slice(0,s)+txt.slice(end<0?r.end:end);
      },
      undo:()=>{parent.insertBefore(keep,next)}});
  }
  afterEdit(p);
  toast('Converted to multiple-policy format with new PolicyID '+g,'ok');
}
