<script>
/* ============================================================
   CHUNK D — binary layer: DER/certs, PE/Authenticode, events
   ============================================================ */
async function digestHex(alg,data){
  try{return bufToHex(await crypto.subtle.digest(alg,data))}catch(e){return ''}
}

/* ---------- minimal DER ---------- */
function derNode(u8,off){
  if(off+2>u8.length)return null;
  const tag=u8[off];
  let len=u8[off+1],hdr=2;
  if(len&0x80){
    const n=len&0x7f;
    if(n>4||off+2+n>u8.length)return null;
    len=0;
    for(let i=0;i<n;i++)len=len*256+u8[off+2+i];
    hdr=2+n;
  }
  if(off+hdr+len>u8.length)return null;
  return {tag,cls:tag>>6,constructed:!!(tag&0x20),num:tag&0x1f,start:off,hdr,len,cs:off+hdr,end:off+hdr+len};
}
function derChildren(u8,node){
  const out=[];let o=node.cs;
  while(o<node.end){
    const c=derNode(u8,o);
    if(!c)break;
    out.push(c);o=c.end;
  }
  return out;
}
function derOid(u8,node){
  const b=u8.subarray(node.cs,node.end);
  if(!b.length)return '';
  const out=[Math.floor(b[0]/40),b[0]%40];
  let v=0;
  for(let i=1;i<b.length;i++){
    v=v*128+(b[i]&0x7f);
    if(!(b[i]&0x80)){out.push(v);v=0}
  }
  return out.join('.');
}
function derStr(u8,node){
  const b=u8.subarray(node.cs,node.end);
  if(node.num===0x1e){ // BMPString UTF-16BE
    let s='';for(let i=0;i+1<b.length;i+=2)s+=String.fromCharCode((b[i]<<8)|b[i+1]);
    return s;
  }
  try{return new TextDecoder('utf-8').decode(b)}catch(e){return Array.from(b).map(x=>String.fromCharCode(x)).join('')}
}
function derTime(u8,node){
  const s=derStr(u8,node);
  let m;
  if(node.num===0x17&&(m=/^(\d\d)(\d\d)(\d\d)(\d\d)(\d\d)(\d\d)?Z?/.exec(s))){
    const yy=+m[1];return new Date(Date.UTC((yy<50?2000:1900)+yy,+m[2]-1,+m[3],+m[4],+m[5],+(m[6]||0)));
  }
  if(node.num===0x18&&(m=/^(\d{4})(\d\d)(\d\d)(\d\d)(\d\d)(\d\d)?/.exec(s)))
    return new Date(Date.UTC(+m[1],+m[2]-1,+m[3],+m[4],+m[5],+(m[6]||0)));
  return null;
}
const SIGALG_HASH={'1.2.840.113549.1.1.5':'SHA-1','1.2.840.113549.1.1.11':'SHA-256','1.2.840.113549.1.1.12':'SHA-384','1.2.840.113549.1.1.13':'SHA-512','1.2.840.113549.1.1.4':'MD5','1.2.840.10045.4.1':'SHA-1','1.2.840.10045.4.3.2':'SHA-256','1.2.840.10045.4.3.3':'SHA-384','1.2.840.10045.4.3.4':'SHA-512'};
const SIGALG_KIND={'1.2.840.113549.1.1':'RSA','1.2.840.10045.4':'ECDSA'};
function nameCN(u8,nameNode){
  // Name = SEQ OF (SET OF SEQ{OID,val}); returns {cn, full}
  let cn='',parts=[];
  for(const rdn of derChildren(u8,nameNode)){
    for(const atv of derChildren(u8,rdn)){
      const ch=derChildren(u8,atv);
      if(ch.length<2)continue;
      const oid=derOid(u8,ch[0]),val=derStr(u8,ch[1]);
      const label={'2.5.4.3':'CN','2.5.4.10':'O','2.5.4.11':'OU','2.5.4.6':'C','2.5.4.7':'L','2.5.4.8':'S','1.2.840.113549.1.9.1':'E'}[oid]||oid;
      parts.push(label+'='+val);
      if(oid==='2.5.4.3')cn=val;
    }
  }
  return {cn,full:parts.join(', ')};
}
async function parseCert(u8,certNode){
  const ch=derChildren(u8,certNode);
  if(ch.length<3)return null;
  const tbs=ch[0];
  const tbsBytes=u8.slice(tbs.start,tbs.end);
  const sigAlgOid=derOid(u8,derChildren(u8,ch[1])[0]||tbs);
  const tch=derChildren(u8,tbs);
  let i=0;
  if(tch[0]&&tch[0].cls===2&&tch[0].num===0)i=1; // [0] version
  const serialNode=tch[i],issuerNode=tch[i+2],validityNode=tch[i+3],subjectNode=tch[i+4];
  const serial=bufToHex(u8.slice(serialNode.cs,serialNode.end));
  const validity=derChildren(u8,validityNode);
  const issuer=nameCN(u8,issuerNode),subject=nameCN(u8,subjectNode);
  const hashAlg=SIGALG_HASH[sigAlgOid]||'SHA-256';
  const cert={
    raw:u8.slice(certNode.start,certNode.end),
    tbsBytes,serial,sigAlgOid,
    sigKind:sigAlgOid.startsWith('1.2.840.10045')?'ECDSA':(sigAlgOid.startsWith('1.2.840.113549.1.1')?'RSA':sigAlgOid),
    hashAlg,
    issuerCN:issuer.cn,issuerFull:issuer.full,issuerDer:bufToHex(u8.slice(issuerNode.start,issuerNode.end)),
    subjectCN:subject.cn,subjectFull:subject.full,subjectDer:bufToHex(u8.slice(subjectNode.start,subjectNode.end)),
    notBefore:validity[0]?derTime(u8,validity[0]):null,notAfter:validity[1]?derTime(u8,validity[1]):null,

  cert.tbs.sha256=await digestHex('SHA-256',tbsBytes);
  cert.tbs.sha384=await digestHex('SHA-384',tbsBytes);
  cert.policyTbs=hashAlg==='SHA-1'?cert.tbs.sha1:hashAlg==='SHA-384'?cert.tbs.sha384:hashAlg==='SHA-512'?await digestHex('SHA-512',tbsBytes):cert.tbs.sha256;
  cert.policyTbsAlg=hashAlg==='MD5'?'SHA-256 (MD5 certs unsupported — showing SHA-256)':hashAlg;
  return cert;
}
async function parsePkcs7(bytes){
  const u8=bytes instanceof Uint8Array?bytes:new Uint8Array(bytes);
  const root=derNode(u8,0);
  if(!root)return {certs:[],signerSerial:null};
  const ci=derChildren(u8,root);
  let signed=null;
  if(ci.length>=2&&ci[1].cls===2)signed=derChildren(u8,ci[1])[0];
  if(!signed)return {certs:[],signerSerial:null};
  const sch=derChildren(u8,signed);
  let certsNode=null,signerInfos=null;
  for(const c of sch){
    if(c.cls===2&&c.num===0&&!certsNode)certsNode=c;
    if(c.cls===0&&c.num===0x11)signerInfos=c; // SET
  }
  const certs=[];
  if(certsNode)for(const cn of derChildren(u8,certsNode)){
    if(cn.tag!==0x30)continue;
    try{const c=await parseCert(u8,cn);if(c)certs.push(c)}catch(e){}
  }
  let signerSerial=null,signerIssuerDer=null;
  if(signerInfos){
    const si=derChildren(u8,signerInfos)[0];
    if(si){
      const sich=derChildren(u8,si);
      const ias=sich[1];
      if(ias){
        const iasCh=derChildren(u8,ias);
        if(iasCh.length>=2){
          signerIssuerDer=bufToHex(u8.slice(iasCh[0].start,iasCh[0].end));
          signerSerial=bufToHex(u8.slice(iasCh[1].cs,iasCh[1].end));
        }
      }
    }
  }
  return {certs,signerSerial,signerIssuerDer};
}
function orderChain(certs,signerSerial,signerIssuerDer){
  if(!certs.length)return [];
  let leaf=certs.find(c=>c.serial===signerSerial&&(!signerIssuerDer||c.issuerDer===signerIssuerDer))
        ||certs.find(c=>c.serial===signerSerial)
        ||certs.find(c=>!certs.some(o=>o!==c&&o.issuerDer===c.subjectDer))
        ||certs[0];
  const chain=[leaf];
  let cur=leaf,guard=0;
  while(guard++<8){
    const next=certs.find(c=>c!==cur&&c.subjectDer===cur.issuerDer&&!chain.includes(c));
    if(!next)break;
    chain.push(next);cur=next;
  }
  return chain;
}

/* ---------- PE ---------- */
async function inspectFile(file){
  const buf=await file.arrayBuffer();
  const u8=new Uint8Array(buf);
  const dv=new DataView(buf);
  const out={
    name:file.name,size:file.size,isPe:false,
    flat:{},auth:{},version:null,strings:{},machine:'',subsystem:null,isDll:false,isDriver:false,
    chain:[],signed:false,sigNote:'',error:null,pageHashNote:'Page-hash variants are not computed in-browser.'

    if(u8.length<0x40||dv.getUint16(0,true)!==0x5A4D)return out; // not MZ

    const ckOff=opt+64;
    const ddStart=opt+(plus?112:96);

    if(numDD>4){secOff=dv.getUint32(ddStart+32,true);secSize=dv.getUint32(ddStart+36,true)}

      }
      return rva; // header region
    };

    const parts=[];
    const push=(a,b)=>{if(b>a)parts.push(u8.subarray(a,b))};
    push(0,ckOff);
    push(ckOff+4,secDirEntryOff);
    const certStart=secOff>0?secOff:u8.length;
    push(secDirEntryOff+8,Math.min(certStart,u8.length));
    if(secOff>0&&secOff+secSize<u8.length)push(secOff+secSize,u8.length);
    let total=0;for(const p of parts)total+=p.length;
    const lin=new Uint8Array(total);
    let o=0;for(const p of parts){lin.set(p,o);o+=p.length}

    out.auth.sha256=await digestHex('SHA-256',lin);
    // ---- version resource ----
    try{
      if(rsrcRva&&rsrcSize){
        const rsrcOff=rva2off(rsrcRva);
        const dirEntries=(off)=>{
          if(off+16>u8.length)return [];

            out2.push({id:dv.getUint32(e,true),data:dv.getUint32(e+4,true)});
          }
          return out2;
        };
        const typeEntry=dirEntries(rsrcOff).find(e=>(e.id&0x7fffffff)===16&&!(e.id&0x80000000)||((e.id===16)));
        let cand=dirEntries(rsrcOff).find(e=>e.id===16);
        if(cand&&(cand.data&0x80000000)){
          const nameDir=dirEntries(rsrcOff+(cand.data&0x7fffffff));
          let lvl2=nameDir[0];
          if(lvl2&&(lvl2.data&0x80000000)){
            const langDir=dirEntries(rsrcOff+(lvl2.data&0x7fffffff));
            let lvl3=langDir[0];
            if(lvl3&&!(lvl3.data&0x80000000)){
              const de=rsrcOff+lvl3.data;
              const dataRva=dv.getUint32(de,true),dataSize=dv.getUint32(de+4,true);

            }

        }

    }catch(e){/* version info best-effort */}
    // ---- signature ----
    if(secOff>0&&secSize>8&&secOff+secSize<=u8.length){
      let wOff=secOff;
      let found=false;
      for(let guard=0;guard<8&&wOff+8<=secOff+secSize;guard++){
        const wLen=dv.getUint32(wOff,true);
        const wType=dv.getUint16(wOff+6,true);
        if(wLen<8)break;
        if(wType===2){
          const der=u8.slice(wOff+8,Math.min(wOff+wLen,u8.length));
          const {certs,signerSerial,signerIssuerDer}=await parsePkcs7(der);
          out.chain=orderChain(certs,signerSerial,signerIssuerDer);
          out.allCerts=certs;
          out.signed=out.chain.length>0;
          found=true;
          break;
        }
        wOff+=Math.ceil(wLen/8)*8;
      }
      if(!found)out.sigNote='Certificate table present but no PKCS#7 signature entry found.';
    }else if(secOff>0)out.sigNote='Certificate table present but malformed.';
  }catch(e){out.error='Parse error: '+(e.message||e)}
  return out;
}
function parseVersionInfo(u8,dv,off,size,out){
  const rdU16=o=>o+1<u8.length?dv.getUint16(o,true):0;
  const rdStr=(o,maxEnd)=>{
    let s='';
    while(o+1<maxEnd){
      const c=rdU16(o);o+=2;
      if(!c)break;
      s+=String.fromCharCode(c);
    }
    return {s,end:o};
  };
  const align4=x=>(x+3)&~3;
  const end=off+size;
  const block=(o,maxEnd,depth)=>{
    if(o+6>maxEnd||depth>5)return null;
    const wLength=rdU16(o),wValueLength=rdU16(o+2),wType=rdU16(o+4);
    if(!wLength)return null;
    const key=rdStr(o+6,Math.min(o+wLength,maxEnd));
    let cur=align4(key.end);
    const blockEnd=Math.min(o+wLength,maxEnd);
    return {o,wLength,wValueLength,wType,key:key.s,valueStart:cur,blockEnd};
  };
  const root=block(off,end,0);
  if(!root||root.key!=='VS_VERSION_INFO')return;
  let cur=root.valueStart;
  if(root.wValueLength>=52&&cur+52<=end&&dv.getUint32(cur,true)===0xFEEF04BD){
    const ms=dv.getUint32(cur+8,true),ls=dv.getUint32(cur+12,true);
    const pms=dv.getUint32(cur+16,true),pls=dv.getUint32(cur+20,true);
    out.version={
      file:[(ms>>>16),(ms&0xffff),(ls>>>16),(ls&0xffff)].join('.'),
      product:[(pms>>>16),(pms&0xffff),(pls>>>16),(pls&0xffff)].join('.')
    };
  }
  cur=align4(root.valueStart+root.wValueLength);
  let guard=0;
  while(cur<root.blockEnd&&guard++<10){
    const child=block(cur,root.blockEnd,1);
    if(!child)break;
    if(child.key==='StringFileInfo'){
      let t=child.valueStart,g2=0;
      while(t<child.blockEnd&&g2++<8){
        const table=block(t,child.blockEnd,2);
        if(!table)break;
        let s=table.valueStart,g3=0;
        while(s<table.blockEnd&&g3++<40){
          const str=block(s,table.blockEnd,3);
          if(!str)break;
          if(str.wValueLength&&str.valueStart<str.blockEnd){
            const val=rdStr(str.valueStart,Math.min(str.valueStart+str.wValueLength*2,str.blockEnd));
            out.strings[str.key]=val.s.trim();
          }else if(str.key)out.strings[str.key]=out.strings[str.key]||'';
          s=align4(str.o+str.wLength);
          if(str.wLength===0)break;
        }
        t=align4(table.o+table.wLength);
        if(table.wLength===0)break;
      }
    }
    cur=align4(child.o+child.wLength);
    if(child.wLength===0)break;
  }
}

/* ---------- simulation ---------- */
function versionMatchesAllow(fileV,min,max){
  if(min&&vcmp(fileV,min)<0)return false;
  if(max&&vcmp(fileV,max)>0)return false;
  return true;
}
function versionMatchesDeny(fileV,min,max){
  if(min&&max)return vcmp(fileV,min)>=0&&vcmp(fileV,max)<=0;
  if(min)return vcmp(fileV,min)<=0;
  if(max)return vcmp(fileV,max)>=0;
  return true;
}
function attribMatchesFile(el,insp,forDeny){
  const s=insp.strings||{};
  const checks=[['FileName',s.OriginalFilename],['InternalName',s.InternalName],['FileDescription',s.FileDescription],['ProductName',s.ProductName]];
  let constrained=false;
  for(const [attr,fv] of checks){
    const want=att(el,attr);
    if(!want)continue;
    constrained=true;
    if(!fv||want.toLowerCase()!==fv.toLowerCase())return false;
  }
  if(att(el,'PackageFamilyName'))return false;
  if(att(el,'FilePath'))return false;
  if(att(el,'Hash')){
    constrained=true;
    const h=att(el,'Hash').toUpperCase();
    if(![insp.auth.sha1,insp.auth.sha256,insp.flat.sha1,insp.flat.sha256].includes(h))return false;
  }
  if(!constrained)return false;
  const fileV=(insp.version&&insp.version.file)||(s.FileVersion&&s.FileVersion.replace(/[^\d.].*$/,''))||'0.0.0.0';
  const min=att(el,'MinimumFileVersion'),max=att(el,'MaximumFileVersion');
  if(min||max)return forDeny?versionMatchesDeny(fileV,min,max):versionMatchesAllow(fileV,min,max);
  return true;
}
function signerMatchesChain(signer,insp){
  if(!insp.chain.length)return false;
  const tbsSet=new Set();
  for(const c of insp.chain){tbsSet.add(c.tbs.sha1);tbsSet.add(c.tbs.sha256);tbsSet.add(c.tbs.sha384)}
  if(signer.rootType&&signer.rootType.toLowerCase()==='wellknown')return null; // cannot resolve wellknown locally
  if(!signer.rootValue||!tbsSet.has(signer.rootValue))return false;
  if(signer.publisher){
    const leaf=insp.chain[0];
    if(!leaf||leaf.subjectCN.toLowerCase()!==signer.publisher.toLowerCase())return false;
  }
  if(signer.oem)return false; // cannot verify OEM attribute in-browser
  return true;
}
function evaluateFile(p,insp){
  const scenario=insp.isDriver?'131':'12';
  const res={scenario,verdict:'unknown',matches:[],notes:[]};
  const scen=p.scenarios.find(s=>s.value===scenario);
  if(!scen){res.notes.push('Policy has no signing scenario '+scenario+' — nothing applies to this file class.');}
  const inScen=r=>r.scen.includes(scenario);
  const hashSet=new Set([insp.auth.sha1,insp.auth.sha256,insp.flat.sha1,insp.flat.sha256].filter(Boolean));
  // 1. explicit deny rules
  for(const r of p.rules){
    if(r.tag.toLowerCase()!=='deny'||!inScen(r))continue;
    if(r.kind==='hash'&&hashSet.has((r.value||'').toUpperCase()))res.matches.push({t:'deny',id:r.id,why:'hash match'});
    else if(r.kind==='path')res.notes.push('Path deny '+r.id+' not evaluated (real file path unknown in the browser).');
    else if(['name','internal','description','product'].includes(r.kind)&&attribMatchesFile(r.el,insp,true))res.matches.push({t:'deny',id:r.id,why:KIND_LABEL[r.kind]+' match'});
  }
  // 2. denied signers
  for(const s of p.signers){
    if(!s.denyIn.includes(scenario))continue;
    const chainOk=signerMatchesChain(s,insp);
    if(chainOk===null){res.notes.push('Denied signer '+s.id+' uses a WellKnown root — not resolvable in-browser.');continue}
    if(!chainOk)continue;
    if(s.attribRefs.length){
      const hit=s.attribRefs.some(ar=>ar.rule&&attribMatchesFile(ar.rule.el,insp,true));
      if(hit)res.matches.push({t:'deny',id:s.id,why:'signer + file attribute match'});
    }else res.matches.push({t:'deny',id:s.id,why:'signer chain match'+(s.publisher?' ('+s.publisher+')':'')});
  }
  if(res.matches.some(m=>m.t==='deny')){res.verdict='blocked';return res}
  // 3. explicit allow rules
  for(const r of p.rules){
    if(r.tag.toLowerCase()!=='allow'||!inScen(r))continue;
    if(r.kind==='hash'&&hashSet.has((r.value||'').toUpperCase()))res.matches.push({t:'allow',id:r.id,why:'hash match'});
    else if(r.kind==='path'){
      if(r.value==='*')res.matches.push({t:'allow',id:r.id,why:'wildcard-everything path rule'});
      else res.notes.push('Path allow '+r.id+' not evaluated (real file path unknown).');
    }
    else if(r.kind==='name'&&r.value==='*')res.matches.push({t:'allow',id:r.id,why:'allow-all rule'});
    else if(['name','internal','description','product'].includes(r.kind)&&attribMatchesFile(r.el,insp,false))res.matches.push({t:'allow',id:r.id,why:KIND_LABEL[r.kind]+' match'});
  }
  // 4. allowed signers
  for(const s of p.signers){
    if(!s.allowIn.includes(scenario))continue;
    const chainOk=signerMatchesChain(s,insp);
    if(chainOk===null){res.notes.push('Allowed signer '+s.id+' uses a WellKnown root — not resolvable in-browser.');continue}
    if(!chainOk)continue;
    if(s.attribRefs.length){
      const hit=s.attribRefs.some(ar=>ar.rule&&attribMatchesFile(ar.rule.el,insp,false));
      if(hit)res.matches.push({t:'allow',id:s.id,why:'signer + file attribute match'});
    }else res.matches.push({t:'allow',id:s.id,why:'signer chain match'+(s.publisher?' ('+s.publisher+')':'')});
  }
  if(res.matches.some(m=>m.t==='allow'))res.verdict='allowed';
  else{
    res.verdict='blocked';
    res.notes.push(insp.signed?'No allow rule matched this file or its signing chain.':'File is '+(insp.isPe?'unsigned':'not a PE binary')+' and nothing allows it by hash'+(insp.isPe?'':' or content')+'.');
    if(p.audit)res.notes.push('Policy is in AUDIT mode — this would only be logged (3076), not blocked.');
  }
  if(p.audit&&res.verdict==='blocked')res.verdict='audited';
  return res;
}

/* ---------- event parsing ---------- */
function parseCsvLine(line,out){
  let cur='',q=false;
  for(let i=0;i<line.length;i++){
    const c=line[i];
    if(q){
      if(c==='"'){if(line[i+1]==='"'){cur+='"';i++}else q=false}
      else cur+=c;
    }else{
      if(c==='"')q=true;
      else if(c===','){out.push(cur);cur=''}
      else cur+=c;
    }
  }
  out.push(cur);
  return q;
}
function parseCsv(text){
  const rows=[];let row=[],carry=null;
  for(const rawLine of text.split(/\r?\n/)){
    if(carry!==null){
      const cont=carry+'\n'+rawLine;
      row=[];
      if(parseCsvLine(cont,row)){carry=cont;continue}
      carry=null;rows.push(row);continue;
    }
    if(!rawLine.trim())continue;
    row=[];
    if(parseCsvLine(rawLine,row)){carry=rawLine;continue}
    rows.push(row);
  }
  return rows;
}
const EVT_CLASS={3076:'audit',3077:'block',3033:'block',3034:'audit',8028:'audit',8029:'block',8036:'block',8038:'siginfo',8039:'audit',8040:'block',3089:'siginfo',3004:'block',3114:'block'};
function normFieldName(n){
  return String(n||'').replace(/\s+/g,'').replace(/Buffer$/i,'');
}
function parseEventsXml(text){
  let t=text.trim();
  t=t.replace(/<\?xml[^>]*\?>/g,'');
  if(!/^<Events[\s>]/i.test(t))t='<Events>'+t+'</Events>';
  const doc=new DOMParser().parseFromString(t,'application/xml');
  if(doc.querySelector('parsererror'))throw new Error('Not valid event XML. Export from Event Viewer with "Save All Events As… → XML", or use the PowerShell snippet from the Deploy tab.');
  const events=[];
  for(const ev of all(doc.documentElement,'Event')){
    const sys=kids(ev,'System')[0];
    if(!sys)continue;
    const idEl=kids(sys,'EventID')[0];
    const rec={
      id:idEl?parseInt(idEl.textContent,10):0,
      time:att(kids(sys,'TimeCreated')[0]||null,'SystemTime'),
      computer:(kids(sys,'Computer')[0]||{textContent:''}).textContent.trim(),
      channel:(kids(sys,'Channel')[0]||{textContent:''}).textContent.trim(),
      activity:att(kids(sys,'Correlation')[0]||null,'ActivityID'),
      provider:att(kids(sys,'Provider')[0]||null,'Name'),
      f:{}
    };
    const ed=kids(ev,'EventData')[0]||kids(ev,'UserData')[0];
    if(ed)for(const d of all(ed,'Data')){
      const name=normFieldName(att(d,'Name'));
      if(!name||/Length$|Size$/i.test(att(d,'Name')||''))continue;
      rec.f[name]=(d.textContent||'').trim();
    }
    events.push(rec);
  }
  return events;
}
function basename(p){
  const s=String(p||'');
  const i=Math.max(s.lastIndexOf('\\'),s.lastIndexOf('/'));
  return i>=0?s.slice(i+1):s;
}
function buildTriageItems(events){

      key,fileName:basename(path)||f.OriginalFileName||'(unknown)',path,count:0,
      computers:new Set(),eventIds:new Set(),classes:new Set(),first:null,last:null,
      hashes:{sha1,sha256,flatSha1:(f.SHA1FlatHash||'').toUpperCase(),flatSha256:(f.SHA256FlatHash||'').toUpperCase()},
      meta:{OriginalFileName:f.OriginalFileName||'',InternalName:f.InternalName||'',FileDescription:f.FileDescription||'',
        ProductName:f.ProductName||'',FileVersion:(f.FileVersion||'').replace(/\s.*$/,''),PackageFamilyName:f.PackageFamilyName||'',
        UserWriteable:f.UserWriteable||'',PolicyName:f.PolicyName||'',PolicyGUID:f.PolicyGUID||f.PolicyId||'',
        Process:basename(f.ProcessName||'')},

    const t=e.time?new Date(e.time):null;
    if(t){if(!it.first||t<it.first)it.first=t;if(!it.last||t>it.last)it.last=t}
    if(e.activity&&sigByActivity[e.activity]){
      for(const s of sigByActivity[e.activity]){
        if(s.pubTbs&&!it.signers.some(x=>x.pubTbs===s.pubTbs&&x.publisher===s.publisher))it.signers.push(s);
        else if(!s.pubTbs&&s.publisher&&!it.signers.some(x=>x.publisher===s.publisher))it.signers.push(s);

}

    if(iTime>=0&&row[iTime]){const t=new Date(row[iTime]);if(!isNaN(t)){if(!it.first||t<it.first)it.first=t;if(!it.last||t>it.last)it.last=t}}
    const pub=iPub>=0?row[iPub]||'':'',pubT=(iPubT>=0?row[iPubT]||'':'').toUpperCase();
    const iss=iIss>=0?row[iIss]||'':'',issT=(iIssT>=0?row[iIssT]||'':'').toUpperCase();
    if((pub||pubT)&&!it.signers.some(x=>x.pubTbs===pubT&&x.publisher===pub))
      it.signers.push({publisher:pub,issuer:iss,pubTbs:pubT,issTbs:issT,notBefore:'',notAfter:''});
  }
  return Array.from(items.values()).sort((a,b)=>b.count-a.count);
}

/* ---------- explainer ---------- */
function explainPolicy(p){
  const P=[];
  const name='<b class="k">'+esc(p.info.name)+'</b>';
  let s1=name+' is a '+(p.isSupplemental?'<b>supplemental policy</b>':p.isAppId?'<b>AppID tagging policy</b>':'<b>base policy</b>')+
    (p.info.format==='legacy'?' in the legacy single-policy format (deploys as SiPolicy.p7b — only one per machine)':' in the multiple-policy format')+
    ', version '+esc(p.info.version||'?')+'.';
  if(p.isSupplemental){
    const base=App.policies.find(x=>x!==p&&x.info.policyId&&x.info.policyId.toLowerCase()===p.info.basePolicyId.toLowerCase());
    s1+=' It expands base policy '+(base?'<b class="k">'+esc(base.info.name)+'</b> (open in another tab)':'<code>'+esc(p.info.basePolicyId)+'</code>')+' — it can only add trust, never remove it.';
  }
  P.push(s1);
  P.push(p.audit
    ?'It is in <b>audit mode</b>: nothing is blocked; files that would have been blocked are logged as event 3076 (binaries) / 8028 (scripts) in the CodeIntegrity and AppLocker logs. Note that MSHTA and interactive PowerShell change behavior even in audit when script enforcement is on.'
    :'It is in <b>enforce mode</b>: any file that no rule allows is blocked (event 3077 / 8029). Make sure this was tested in audit first.');
  const allowAll=p.rules.some(r=>r.tag.toLowerCase()==='allow'&&(r.value==='*')&&r.scen.length);
  const allowSigners=p.signers.filter(s=>s.allowIn.length);
  const denySigners=p.signers.filter(s=>s.denyIn.length);
  const denyRules=p.rules.filter(r=>r.decision==='deny'&&r.tag.toLowerCase()!=='fileattrib');
  const denyAttribs=p.rules.filter(r=>r.decision==='deny'&&r.tag.toLowerCase()==='fileattrib');
  if(allowAll){
    P.push('It contains an <b>allow-everything rule</b>, so this is a <b>blocklist-style</b> policy: all software runs unless a deny rule catches it. '+
      (denyRules.length+denySigners.length?'Currently '+(denyRules.length?denyRules.length+' deny rules':'')+(denyRules.length&&denySigners.length?' and ':'')+(denySigners.length?denySigners.length+' denied signers':'')+' do the blocking.':'There are no deny rules yet, so it blocks nothing.'));
  }else{
    const named=allowSigners.slice(0,5).map(s=>esc(s.name)).join('; ');
    P.push('It is an <b>allow-list</b> policy: only what a rule allows can run. Trust comes from '+
      (allowSigners.length?allowSigners.length+' allowed signer'+(allowSigners.length>1?'s':'')+(named?' ('+named+(allowSigners.length>5?'; …':'')+')':''):'no signers')+
      (p.counts.rules?' plus '+p.rules.filter(r=>r.decision==='allow').length+' allow file rules':'')+'. Everything else is '+(p.audit?'logged':'blocked')+'.');
  }
  if(denyAttribs.length||denyRules.some(r=>['name','pfn'].includes(r.kind))){
    const lolbins=p.rules.filter(r=>r.decision==='deny'&&BLOCK_RECS.includes((r.value||'').toLowerCase())).length;
    if(lolbins)P.push('The denies include <b>'+lolbins+' known abusable binaries</b> from Microsoft’s recommended block list (good).');
  }
  const scriptEnfOff=p.hasOption('Disabled:Script Enforcement');
  P.push(scriptEnfOff
    ?'<b>Script enforcement is disabled</b> (option 11): PowerShell runs in Full Language mode and wscript/cscript/MSHTA are not restricted by this policy.'
    :'<b>Script enforcement is active</b>: unapproved PowerShell drops to Constrained Language Mode, wscript/cscript refuse unsigned scripts, and MSHTA/MSXML content is blocked — this part applies even while the policy audits. Batch files (cmd.exe) are never controlled.');
  const kernelBits=[];
  if(p.hasOption('Required:WHQL'))kernelBits.push('kernel drivers must be WHQL-signed');
  if(p.info.hvci&&p.info.hvci!=='0')kernelBits.push('HVCI (memory integrity) is set to '+esc(p.info.hvci)+(p.info.hvci==='2'?' (strict)':''));
  if(p.hasOption('Enabled:Boot Audit On Failure'))kernelBits.push('boot falls back to audit if a boot-critical driver fails');
  if(p.hasOption('Enabled:Advanced Boot Options Menu'))kernelBits.push('the F8 boot menu stays available');
  if(kernelBits.length)P.push('Kernel side: '+kernelBits.join('; ')+'.');
  const trust=[];
  if(p.hasOption('Enabled:Managed Installer'))trust.push('files deployed by the <b>managed installer</b> (Intune/ConfigMgr — needs the AppLocker MI collection + AppIDSvc on clients)');
  if(p.hasOption('Enabled:Intelligent Security Graph Authorization'))trust.push('files the <b>ISG</b> reputation service calls known-good');
  if(trust.length)P.push('Besides explicit rules, it auto-trusts '+trust.join(' and ')+'.');
  const svc=[];
  svc.push(p.hasOption('Enabled:Update Policy No Reboot')?'updates apply without reboot':'updates need a reboot (option 16 missing)');
  if(!p.isSupplemental)svc.push(p.hasOption('Enabled:Allow Supplemental Policies')?'supplemental policies may attach':'supplementals cannot attach (option 17 missing)');
  svc.push(p.hasOption('Enabled:Unsigned System Integrity Policy')?'the policy itself may be deployed unsigned':'<b>the policy must be deployed signed</b> (option 6 removed)');
  P.push('Servicing: '+svc.join('; ')+'.');
  if(!p.isSupplemental&&!p.isAppId){
    const supps=App.policies.filter(x=>x.isSupplemental&&x.info.basePolicyId&&p.info.policyId&&x.info.basePolicyId.toLowerCase()===p.info.policyId.toLowerCase());
    if(supps.length)P.push('Open supplementals extending this base: '+supps.map(s=>'<b class="k">'+esc(s.info.name)+'</b>').join(', ')+'.');
  }
  return P.map(x=>'<p>'+x+'</p>').join('');
}

function exportRulesCsv(p){
  const head=['ID','Element','Decision','Kind','Value','FriendlyName','MinVersion','MaxVersion','Scenarios','ViaSigners'];
  const q=v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"';

  const sig=p.signers.map(s=>[s.id,'Signer',(s.allowIn.length?'allow ':'')+(s.denyIn.length?'deny':''),s.scope,s.rootType+':'+s.rootValue,s.name,'','',s.allowIn.concat(s.denyIn).join(' '),''].map(q).join(','));
  download(p.fileName.replace(/\.xml$/i,'')+'_rules.csv',head.join(',')+'\n'+rows.concat(sig).join('\n'),'text/csv');

}

function renderOptions(el){
  const p=activePolicy();if(!p){setView('library');return}
  const present=new Map(p.options.map(o=>[o.string.toLowerCase(),o]));
  const groups={};
  for(const o of OPTIONS)(groups[o.g]=groups[o.g]||[]).push(o);
  const unknown=p.options.filter(o=>!o.meta);
  el.innerHTML=
  '<div class="viewhead"><h2>Rule options</h2><span class="sub">policy-wide switches — hover names for the exact XML string</span><span class="spacer"></span>'+docLink('rules','Official reference for all options')+'</div>'+
  '<div class="crumbs">'+(p.isSupplemental?'Supplemental policy: only options 5, 6, 7, 13, 14, 18 apply here; the rest are inherited from the base and shown locked.':'Toggling an option immediately records an undoable change.')+'</div>'+
  Object.keys(groups).map(g=>
    '<div class="card"><h3>'+esc(g)+'</h3>'+groups[g].map(o=>{
      const on=present.has(o.s.toLowerCase());
      const locked=p.isSupplemental&&o.n!=null&&!SUPPL_OK.has(o.n)&&!on;
      return '<div class="opt'+(on?' on':'')+'">'+
        '<span class="num">'+(o.n==null?'—':o.n)+'</span>'+
        '<div class="tx"><b>'+esc(o.name)+'</b> <span class="xmlstr">'+esc(o.s)+'</span> '+docLink(OPT_DOCS[o.n]||'rules')+
        (o.ns?' <span class="warntag">not supported by Windows</span>':'')+
        (p.isSupplemental&&o.n!=null&&!SUPPL_OK.has(o.n)?' <span class="warntag">base-only</span>':'')+
        '<p>'+o.d+'</p></div>'+
        '<label class="sw"><input type="checkbox" data-opt="'+esc(o.s)+'" '+(on?'checked':'')+(locked?' disabled':'')+'><span class="tr"></span><span class="th"></span></label>'+
        '</div>';
    }).join('')+'</div>').join('')+
  (unknown.length?'<div class="card"><h3>Unrecognized options</h3>'+unknown.map(o=>
    '<div class="opt on"><span class="num">?</span><div class="tx"><b class="m">'+esc(o.string)+'</b><p>Not in the known catalog — kept as-is.</p></div>'+
    '<button class="mini danger" data-rmopt="'+esc(o.string)+'">Remove</button></div>').join('')+'</div>':'')+
  '<div class="card"><h3>Add a custom option string</h3><div class="pad" style="display:flex;gap:8px">'+
  '<input type="text" id="customOpt" placeholder="Enabled:Something New" style="flex:1"><button id="addCustomOpt">Add</button></div></div>';
  el.querySelectorAll('[data-opt]').forEach(sw=>sw.addEventListener('change',async()=>{
    const s=sw.getAttribute('data-opt'),on=sw.checked;
    if(!on&&/audit mode/i.test(s)){
      const sure=await confirmModal('Remove audit mode?','This flips the policy to <b>enforce</b>. Anything not allowed will be blocked once deployed.','Go to enforce',true);
      if(!sure){sw.checked=true;return}
    }
    if(on&&/unsigned system integrity/i.test(s)===false&&/Disabled:Runtime FilePath/i.test(s)){
      // no special prompt; lint covers it
    }
    mToggleOption(p,s,on);afterEdit(p);
  }));
  el.querySelectorAll('[data-rmopt]').forEach(b=>b.addEventListener('click',()=>{mToggleOption(p,b.getAttribute('data-rmopt'),false);afterEdit(p)}));
  $('addCustomOpt').addEventListener('click',()=>{
    const v=$('customOpt').value.trim();
    if(!v)return;
    mToggleOption(p,v,true);afterEdit(p);
  });
}

<script>
/* ============================================================
   CHUNK F — rules & signers views + builders
   ============================================================ */
const PAGE=300;
function scenChips(scenList){
  return (scenList||[]).map(v=>'<span class="chip">'+((SCENARIO_META[v]||{}).key||v)+'</span>').join('');
}
function decBadge(d){
  const label=d==='attrib'?'attrib':d==='orphan'?'unused':d;
  const cls=d==='allow'?'allow':d==='deny'?'deny':d==='mixed'?'mixed':d==='attrib'?'attrib':'orphan';
  return '<span class="badge '+cls+'">'+label+'</span>';
}
function renderRules(el){
  const p=activePolicy();if(!p){setView('library');return}
  const u=p.ui;
  const kinds=[...new Set(p.rules.map(r=>r.kind))];
  let rows=p.rules.filter(r=>{
    if(u.ruleDecision!=='all'&&r.decision!==u.ruleDecision)return false;
    if(u.ruleKind!=='all'&&r.kind!==u.ruleKind)return false;
    if(u.ruleQ){
      const hay=[r.id,r.value,r.friendly,r.min,r.max,r.decision,r.kind,r.tag].join(' ').toLowerCase();
      if(!u.ruleQ.toLowerCase().split(/\s+/).every(t=>hay.includes(t)))return false;
    }
    return true;
  });
  const lim=u.ruleLimit||PAGE;
  const selCount=Object.values(u.ruleSel||{}).filter(Boolean).length;

  '<div class="viewhead"><h2>File rules</h2><span class="sub">Allow / Deny / FileAttrib entries under &lt;FileRules&gt;</span>'+
  '<span class="spacer"></span><button id="addFromFileBtn" title="Pick a file; detect publisher, version and hash">📄 From a file…</button><button class="primary" id="addRuleBtn">+ Add rule</button></div>'+
  '<div class="toolbar">'+
    '<input type="search" id="ruleQ" placeholder="Search value, ID, friendly name…" value="'+esc(u.ruleQ)+'">'+
    '<select id="ruleDec"><option value="all">All decisions</option>'+['allow','deny','attrib','mixed','orphan'].map(d=>'<option '+(u.ruleDecision===d?'selected':'')+' value="'+d+'">'+d+'</option>').join('')+'</select>'+
    '<select id="ruleKind"><option value="all">All kinds</option>'+kinds.map(k=>'<option '+(u.ruleKind===k?'selected':'')+' value="'+k+'">'+(KIND_LABEL[k]||k)+'</option>').join('')+'</select>'+
    '<button id="bulkDel" class="danger" '+(selCount?'':'disabled')+'>Delete selected ('+selCount+')</button>'+
  '</div>'+
  '<div class="card"><div class="scroll"><table><colgroup><col style="width:34px"><col style="width:86px"><col style="width:110px"><col><col style="width:190px"><col style="width:110px"><col style="width:110px"><col style="width:120px"><col style="width:180px"><col style="width:70px"></colgroup>'+
  '<thead><tr><th><input type="checkbox" id="ruleSelAll"></th><th>Decision</th><th>Kind</th><th>Value</th><th>Friendly name</th><th>Min ver</th><th>Max ver</th><th>Scenario</th><th>ID</th><th></th></tr></thead><tbody>'+
  rows.slice(0,lim).map(r=>{
    const editableVal=!['hash'].includes(r.kind);

    return '<tr data-rid="'+esc(r.id)+'">'+
    '<td><input type="checkbox" class="rsel" '+((u.ruleSel||{})[r.id]?'checked':'')+'></td>'+
    '<td>'+decBadge(r.decision)+'</td>'+
    '<td><span class="chip">'+(KIND_LABEL[r.kind]||r.kind)+(r.tag.toLowerCase()==='fileattrib'?' (attrib)':'')+'</span></td>'+
    '<td>'+(editableVal?'<input class="redit" data-attr="'+attr+'" value="'+esc(r.value)+'">':'<div class="cell m" title="'+esc(r.value)+'">'+esc(r.value)+'</div>')+'</td>'+
    '<td><input class="redit" data-attr="FriendlyName" value="'+esc(r.friendly)+'" placeholder="—"></td>'+
    '<td><input class="redit" data-attr="MinimumFileVersion" value="'+esc(r.min)+'" placeholder="—"></td>'+
    '<td><input class="redit" data-attr="MaximumFileVersion" value="'+esc(r.max)+'" placeholder="—"></td>'+
    '<td>'+(r.tag.toLowerCase()==='fileattrib'?'<span class="small muted">via '+r.viaSigners.length+' signer'+(r.viaSigners.length===1?'':'s')+'</span>':scenChips(r.scen)||'<span class="badge orphan">unreferenced</span>')+'</td>'+
    '<td class="m"><div class="cell" title="'+esc(r.id)+'">'+esc(r.id)+'</div></td>'+
    '<td><button class="mini danger rdel">✕</button></td></tr>';
  }).join('')+
  '</tbody></table>'+(rows.length?'':'<div class="empty">No rules match.</div>')+'</div>'+
  (rows.length>lim?'<div class="pad" style="text-align:center;border-top:1px solid var(--line-soft)"><button id="ruleMore">Show '+Math.min(PAGE,rows.length-lim)+' more (of '+rows.length+')</button></div>':'')+
  '</div>'+
  '<div class="small muted">Deny-rule version semantics: <code>MinimumFileVersion</code> on a deny means “this version <b>and lower</b>”. To deny every version, use <code>'+VMAX+'</code> or no version attributes.</div>';
  $('ruleQ').addEventListener('input',debounce(e=>{u.ruleQ=e.target.value.trim();u.ruleLimit=PAGE;renderRules(el)},150));
  $('ruleDec').addEventListener('change',e=>{u.ruleDecision=e.target.value;u.ruleLimit=PAGE;renderRules(el)});
  $('ruleKind').addEventListener('change',e=>{u.ruleKind=e.target.value;u.ruleLimit=PAGE;renderRules(el)});
  if($('ruleMore'))$('ruleMore').addEventListener('click',()=>{u.ruleLimit=(u.ruleLimit||PAGE)+PAGE;renderRules(el)});
  $('ruleSelAll').addEventListener('change',e=>{
    u.ruleSel=u.ruleSel||{};
    rows.forEach(r=>u.ruleSel[r.id]=e.target.checked);
    renderRules(el);
  });
  $('bulkDel').addEventListener('click',async()=>{
    const ids=Object.keys(u.ruleSel||{}).filter(k=>u.ruleSel[k]);

    if(!sure)return;

    if(e.target.classList.contains('redit')){

      if(mSetAttr(p,r.el,name,val,r.friendly||r.value||r.id)){tr.classList.add('changed');reindex(p);renderShell()}
    }
  });
  el.querySelector('tbody').addEventListener('click',async e=>{
    if(!e.target.classList.contains('rdel'))return;
    const tr=e.target.closest('tr');
    const r=p.rulesById[tr.getAttribute('data-rid')];if(!r)return;

function segHtml(id,items,active){

    const b=e.target.closest('button');if(!b)return;

      wireSeg(h,'nrDec',()=>draw(segVal(h,'nrKind')));
      draw(kind);
    }
  });

/* ---------- reference-file rule builder (MS Wizard "reference file" flow) ---------- */
function addFromReferenceFile(p){
  let insp=null,busy=false;
  function pickerBody(){
    return '<div class="drop" id="rfDrop" style="margin-bottom:12px"><h2>'+(busy?'Reading file…':'Drop the reference file')+'</h2>'+
      '<p>EXE, DLL, SYS, MSI or script — its publisher, version and hashes are read locally in this tab. Nothing is uploaded.</p>'+
      '<button class="primary" id="rfPick" type="button" '+(busy?'disabled':'')+'>Choose file…</button>'+
      '<input type="file" id="rfInput" class="hidden"></div>'+
      '<p class="small muted" style="margin:0">This is the Microsoft Wizard’s “reference file” workflow — pick a file, then choose how specific the rule should be: publisher → file → hash. '+docLink('rules','About rule levels')+'</p>';
  }
  function resultBody(){
    const s=insp.strings||{};
    const leaf=insp.chain[0],anchor=insp.chain[1]||insp.chain[0];
    const signed=insp.signed&&insp.chain.length>0;
    const orig=s.OriginalFilename||'';
    const ver=(insp.version&&insp.version.file)||'';
    const ecdsa=signed&&anchor&&anchor.sigKind==='ECDSA';
    const L=[];
    if(signed&&!ecdsa){
      L.push(['publisher','Publisher','broad','Anything signed by <b>'+esc(leaf.subjectCN||'?')+'</b> chained through <b>'+esc(anchor.subjectCN||'?')+'</b>. Survives app updates and re-signing.']);
      if(orig)L.push(['filepublisher','File publisher','recommended','Only <b>'+esc(orig)+'</b>'+(ver?', version <b>'+esc(ver)+'</b> or higher,':'')+' when signed by <b>'+esc(leaf.subjectCN||'?')+'</b>.']);
      L.push(['leaf','Leaf certificate','narrow','Only files signed by this exact certificate — stops matching when the certificate is renewed.']);
    }
    if(orig)L.push(['attributes','File name + version','no signature check','Matches <b>'+esc(orig)+'</b>'+(ver?' (≥ <b>'+esc(ver)+'</b>)':'')+' by its version-resource attributes; ignores the signature.']);
    L.push(['hash','Hash','exact','This exact file only — Authenticode SHA256'+(insp.auth&&insp.auth.sha1?' + SHA1':'')+(insp.isPe?'':' (flat hash — non-PE file)')+'. Must be recreated whenever the file changes.']);
    const def=L.some(x=>x[0]==='filepublisher')?'filepublisher':(L.some(x=>x[0]==='publisher')?'publisher':L[0][0]);
    const chips=[
      insp.isPe?'<span class="chip">'+esc(insp.machine)+(insp.isDriver?' driver':insp.isDll?' DLL':' EXE')+'</span>':'<span class="chip">non-PE</span>',
      signed?'<span class="badge allow">signed</span>':'<span class="badge warn">unsigned</span>',
      leaf&&leaf.subjectCN?'<span class="chip">'+esc(leaf.subjectCN)+'</span>':'',
      ver?'<span class="chip">v'+esc(ver)+'</span>':''
    ].filter(Boolean).join(' ');
    return '<div style="display:flex;gap:8px;align-items:center;margin-bottom:10px;flex-wrap:wrap"><b>'+esc(insp.name)+'</b> '+chips+'</div>'+
      (ecdsa?'<p class="small" style="color:var(--amber);margin:0 0 8px">Signed with an ECDSA certificate. App Control signer rules support RSA only, so publisher/leaf levels are hidden — use file attributes or hash.</p>':'')+
      (!signed?'<p class="small muted" style="margin:0 0 8px">No embedded signature found (catalog-signed files also show as unsigned here). Only attribute and hash rules are available.</p>':'')+
      '<label style="display:block;margin-bottom:6px">RULE LEVEL <span style="font-weight:400">(most permissive → most specific)</span></label>'+
      '<div class="filelist" style="border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-bottom:14px">'+
      L.map(x=>'<label class="frow" style="cursor:pointer"><input type="radio" name="rfLevel" value="'+x[0]+'" '+(x[0]===def?'checked':'')+'>'+
        '<div><b>'+esc(x[1])+'</b> <span class="chip">'+esc(x[2])+'</span><div class="small muted">'+x[3]+'</div></div></label>').join('')+
      '</div>'+
      '<div style="display:flex;gap:14px;flex-wrap:wrap;align-items:center">'+
      '<span class="seg denyallow" id="rfDec"><button class="a" data-v="allow" aria-pressed="true">Allow</button><button class="d" data-v="deny" aria-pressed="false">Deny</button></span>'+
      '<label style="color:var(--ink)"><input type="checkbox" id="rfScenU" '+(insp.isDriver?'':'checked')+'> User mode</label>'+
      '<label style="color:var(--ink)"><input type="checkbox" id="rfScenK" '+(insp.isDriver?'checked':'')+'> Kernel mode</label>'+
      '</div>'+
      '<p class="small muted" id="rfNote" style="margin:8px 0 0"></p>';
  }
  function updateNote(h){
    const dec=segVal(h,'rfDec');
    const n=h.querySelector('#rfNote');if(!n)return;
    n.innerHTML=dec==='deny'
      ? 'Deny blocks <b>all versions</b> here (version bounds are dropped to avoid the “this version and lower” trap). Deny always wins over allow.'
      : 'Allow rule. For file/publisher levels the file’s version becomes the minimum version.';
  }
  function wirePicker(h){
    const inp=h.querySelector('#rfInput'),pick=h.querySelector('#rfPick'),dz=h.querySelector('#rfDrop');
    const go=async file=>{
      if(!file)return;
      busy=true;show();
      try{insp=await inspectFile(file)}
      catch(e){toast('Could not read file: '+(e.message||e),'err');insp=null}
      busy=false;show();
    };
    pick.addEventListener('click',()=>inp.click());
    inp.addEventListener('change',()=>go(inp.files[0]));
    dz.addEventListener('dragover',e=>{e.preventDefault();dz.classList.add('over')});
    dz.addEventListener('dragleave',()=>dz.classList.remove('over'));
    dz.addEventListener('drop',e=>{e.preventDefault();e.stopPropagation();dz.classList.remove('over');go(e.dataTransfer.files[0])});
  }
  function create(h){
    const lv=h.querySelector('[name=rfLevel]:checked');
    if(!lv){toast('Pick a rule level','err');return}
    const level=lv.value,dec=segVal(h,'rfDec');
    const scen=[];
    if(h.querySelector('#rfScenU').checked)scen.push(12);
    if(h.querySelector('#rfScenK').checked)scen.push(131);
    if(!scen.length){toast('Pick at least one scenario (user / kernel)','err');return}
    const s=insp.strings||{},leaf=insp.chain[0],anchor=insp.chain[1]||insp.chain[0];
    const orig=s.OriginalFilename||'',ver=(insp.version&&insp.version.file)||'';
    const fn=s.FileDescription||orig||insp.name;
    let created=[];
    if(level==='hash'){
      const list=[];
      if(insp.isPe){if(insp.auth.sha256)list.push(['Sha256',insp.auth.sha256]);if(insp.auth.sha1)list.push(['Sha1',insp.auth.sha1])}
      else if(insp.flat.sha256)list.push(['Sha256 flat',insp.flat.sha256]);
      if(!list.length){toast('No hash available for this file','err');return}
      list.forEach(([lbl,hv])=>created.push(mAddFileRule(p,{tag:dec==='deny'?'Deny':'Allow',attrs:{FriendlyName:insp.name+' Hash '+lbl,Hash:hv},scenarios:scen})));
    }else if(level==='attributes'){
      const attrs={FriendlyName:fn,FileName:orig};
      if(dec==='allow'&&vvalid(ver))attrs.MinimumFileVersion=ver;
      created.push(mAddFileRule(p,{tag:dec==='deny'?'Deny':'Allow',attrs,scenarios:scen}));
    }else{
      const rootValue=level==='leaf'?leaf.policyTbs:anchor.policyTbs;
      const publisher=(level==='publisher'||level==='filepublisher')?(leaf.subjectCN||''):'';
      let attrib=null;
      if(level==='filepublisher'&&orig){attrib={FileName:orig};if(dec==='allow'&&vvalid(ver))attrib.MinimumFileVersion=ver}
      created.push(mAddSigner(p,{
        name:(publisher||leaf.subjectCN||insp.name)+(level==='filepublisher'&&orig?' · '+orig:'')+(level==='leaf'?' (leaf)':''),
        rootType:'TBS',rootValue,publisher,attrib,
        scenarios:scen.map(v=>({value:v,decision:dec})),
        alsoCi:scen.includes(12)&&dec==='allow'
      }));
    }
    afterEdit(p);
    closeModal();
    toast('Added '+(level==='hash'?created.length+' hash rule'+(created.length>1?'s':''):level+' rule')+' from '+insp.name,'ok');
  }
  function show(){
    showModal({title:'Build a rule from a reference file',wide:true,
      body:insp?resultBody():pickerBody(),
      buttons:insp
        ?[{label:'Different file',keepOpen:true,onClick:()=>{insp=null;show();return false}},{label:'Cancel'},{label:'Create rule',cls:'primary',keepOpen:true,onClick:h=>{create(h);return false}}]
        :[{label:'Cancel'}],
      onOpen:h=>{if(insp){wireSeg(h,'rfDec',()=>updateNote(h));updateNote(h)}else wirePicker(h)}
    });
  }
  show();
}

/* ---------- signers view ---------- */
function renderSigners(el){
  const p=activePolicy();if(!p){setView('library');return}
  const u=p.ui;
  let rows=p.signers.filter(s=>{
    if(u.signerQ){
      const hay=[s.id,s.name,s.publisher,s.issuer,s.rootValue,s.oem,s.scope].join(' ').toLowerCase();
      if(!u.signerQ.toLowerCase().split(/\s+/).every(t=>hay.includes(t)))return false;
    }
    return true;
  });
  const extra=[
    {label:'UpdatePolicySigners',list:p.signers.filter(s=>s.inUpdate),why:'certs allowed to sign future versions of this policy'},
    {label:'SupplementalPolicySigners',list:p.signers.filter(s=>s.inSuppl),why:'certs whose signed supplemental policies this base accepts'},
    {label:'CiSigners',list:p.signers.filter(s=>s.inCi),why:'user-mode signer mirror used by Code Integrity'}
  ];
  el.innerHTML=
  '<div class="viewhead"><h2>Signers</h2><span class="sub">certificate-based rules — the strongest, most maintainable kind</span>'+
  '<span class="spacer"></span><button class="primary" id="addSignerBtn">+ Add signer</button></div>'+
  '<div class="toolbar"><input type="search" id="signerQ" placeholder="Search name, publisher, TBS, ID…" value="'+esc(u.signerQ)+'"></div>'+
  '<div class="card"><div class="scroll"><table><colgroup><col style="width:230px"><col style="width:120px"><col style="width:130px"><col><col style="width:170px"><col style="width:140px"><col style="width:70px"></colgroup>'+
  '<thead><tr><th>Name</th><th>Decision</th><th>Scope</th><th>Anchor (CertRoot)</th><th>Publisher (leaf CN)</th><th>Files / flags</th><th></th></tr></thead><tbody>'+
  rows.map(s=>{
    const dec=(s.allowIn.length?'<span class="badge allow">allow</span> ':'')+(s.denyIn.length?'<span class="badge deny">deny</span> ':'')+
      ((!s.allowIn.length&&!s.denyIn.length)?'<span class="badge orphan">unused</span>':'');
    const scen=[...new Set([...s.allowIn,...s.denyIn])].map(v=>'<span class="chip">'+((SCENARIO_META[v]||{}).key||v)+'</span>').join('');
    const anchor=s.rootType.toLowerCase()==='wellknown'
      ?'<span class="chip">wellknown '+esc(s.rootValue)+'</span> '+esc(WELLKNOWN_ROOTS[s.rootValue]||'')
      :'<span class="m" title="'+esc(s.rootValue)+'">'+esc(s.rootValue.slice(0,20))+(s.rootValue.length>20?'…':'')+'</span>';
    const flags=[s.inCi?'Ci':'',s.inUpdate?'Update':'',s.inSuppl?'Suppl':''].filter(Boolean).map(f=>'<span class="chip">'+f+'</span>').join('');
    const files=s.attribRefs.length?'<span class="chip click" title="file attributes">'+s.attribRefs.length+' file'+(s.attribRefs.length>1?'s':'')+'</span>':'';
    return '<tr data-sid="'+esc(s.id)+'" style="cursor:pointer">'+
    '<td><div class="cell" title="'+esc(s.id)+'"><b>'+esc(s.name)+'</b><br><span class="m">'+esc(s.id)+'</span></div></td>'+
    '<td>'+dec+'<br>'+scen+'</td>'+
    '<td><span class="chip">'+esc(s.scope)+'</span></td>'+
    '<td>'+anchor+'</td>'+
    '<td><div class="cell">'+esc(s.publisher||'—')+'</div></td>'+
    '<td>'+files+' '+flags+'</td>'+
    '<td><button class="mini danger sdel">✕</button></td></tr>';
  }).join('')+
  '</tbody></table>'+(rows.length?'':'<div class="empty">No signers'+(u.signerQ?' match':'')+'.</div>')+'</div></div>'+
  '<div class="cols3">'+extra.map(x=>'<div class="card"><h3>'+x.label+' <span class="n">'+x.list.length+'</span></h3><div class="pad small">'+
    '<div class="muted" style="margin-bottom:8px">'+x.why+'</div>'+
    (x.list.length?x.list.map(s=>'<div class="chip">'+esc(s.name)+'</div>').join(''):'<span class="muted">none</span>')+'</div></div>').join('')+'</div>';
  $('signerQ').addEventListener('input',debounce(e=>{u.signerQ=e.target.value.trim();renderSigners(el)},150));
  $('addSignerBtn').addEventListener('click',()=>addSignerDialog(p));
  el.querySelector('tbody').addEventListener('click',async e=>{
    const tr=e.target.closest('tr');if(!tr)return;
    const s=p.signersById[tr.getAttribute('data-sid')];if(!s)return;
    if(e.target.classList.contains('sdel')){
      const sure=await confirmModal('Delete signer '+esc(s.id)+'?','Removes the signer and its scenario/CiSigner references. FileAttrib rules it pointed to are kept (they become unreferenced).','Delete',true);
      if(sure){mDeleteSigner(p,s);afterEdit(p)}
      return;
    }
    signerDetail(p,s);
  });
}
function signerDetail(p,s){
  const unit='  ';
  const ekus=s.ekuRefs.map(id=>{
    const e=p.ekus.find(x=>x.id===id);
    return e?(e.known?e.known.name+' ('+e.known.oid+')':e.friendly||e.value):id;
  });
  showModal({title:s.name,wide:true,
    body:
    '<div class="fgrid">'+
    '<div class="field"><label>ID</label><div class="val">'+esc(s.id)+'</div></div>'+
    '<div class="field"><label>Anchor</label><div class="val">'+esc(s.rootType)+' '+(s.rootType.toLowerCase()==='wellknown'?esc(s.rootValue+' — '+(WELLKNOWN_ROOTS[s.rootValue]||'?')):'')+'</div></div>'+
    (s.rootType.toLowerCase()!=='wellknown'?'<div class="field" style="grid-column:1/-1"><label>TBS hash '+(s.rootValue.length===40?'(SHA1 — '+s.rootValue.length/2+' bytes)':s.rootValue.length===64?'(SHA256)':s.rootValue.length===96?'(SHA384)':'')+'</label><div class="val">'+esc(s.rootValue)+' <button class="mini" onclick="copyText(\''+esc(s.rootValue)+'\',\'TBS\')">copy</button></div></div>':'')+
    '<div class="field"><label>CertPublisher (leaf CN)</label><div class="val">'+esc(s.publisher||'—')+'</div></div>'+
    '<div class="field"><label>CertIssuer</label><div class="val">'+esc(s.issuer||'—')+'</div></div>'+
    '<div class="field"><label>CertOemID</label><div class="val">'+esc(s.oem||'—')+'</div></div>'+
    '<div class="field"><label>EKUs required</label><div class="val">'+(ekus.length?ekus.map(esc).join('<br>'):'—')+'</div></div>'+
    '<div class="field"><label>Allowed in</label><div class="val">'+(s.allowIn.map(v=>(SCENARIO_META[v]||{label:v}).label).join(', ')||'—')+'</div></div>'+
    '<div class="field"><label>Denied in</label><div class="val">'+(s.denyIn.map(v=>(SCENARIO_META[v]||{label:v}).label).join(', ')||'—')+'</div></div>'+
    '</div>'+
    (s.attribRefs.length?'<h4 style="margin:12px 0 6px">File attributes ('+s.attribRefs.length+') — signer only matches these files</h4>'+
      s.attribRefs.map(ar=>'<div class="chip">'+esc(ar.id)+(ar.rule?' · '+esc(ar.rule.value||ar.rule.friendly||''):' · missing!')+'</div>').join('')
      +'<div class="small muted" style="margin-top:4px">Edit or remove these under File rules.</div>':'')+
    '<h4 style="margin:14px 0 6px">XML</h4><pre class="xml">'+esc(serializeEl(s.el,'',unit))+'</pre>',
    buttons:[{label:'Close'}]});
}
function addSignerDialog(p,preset){
  preset=preset||{};
  const known=Object.entries(KNOWN_EKUS);
  showModal({title:'Add signer rule',wide:true,
    body:
    '<p class="small muted" style="margin:0 0 12px">Signer rules pin a certificate in the signing chain (Publisher / FilePublisher / WHQL levels). '+docLink('rules','About signer rule levels')+'</p>'+
    '<div class="fform">'+
    '<div class="full"><label>Signer name (FriendlyName)</label><input type="text" id="nsName" value="'+esc(preset.name||'')+'" placeholder="Contoso publisher"></div>'+
    '<div><label>Anchor type</label><select id="nsRootType"><option value="TBS" '+(preset.rootType!=='Wellknown'?'selected':'')+'>TBS (pin a certificate)</option><option value="Wellknown" '+(preset.rootType==='Wellknown'?'selected':'')+'>Wellknown Microsoft root</option></select></div>'+
    '<div id="nsWellWrap" class="hidden"><label>Wellknown root</label><select id="nsWell">'+Object.entries(WELLKNOWN_ROOTS).map(([k,v])=>'<option value="'+k+'">'+k+' — '+v+'</option>').join('')+'</select></div>'+
    '<div class="full" id="nsTbsWrap"><label>CertRoot TBS hash (hex — from File inspector or event 3089 IssuerTBSHash)</label><input type="text" id="nsTbs" class="m" value="'+esc(preset.rootValue||'')+'"></div>'+
    '<div><label>CertPublisher — leaf certificate CN (optional, narrows to one publisher)</label><input type="text" id="nsPub" value="'+esc(preset.publisher||'')+'"></div>'+
    '<div><label>CertIssuer CN (optional)</label><input type="text" id="nsIss" value="'+esc(preset.issuer||'')+'"></div>'+
    '<div><label>CertOemID (optional, WHQL)</label><input type="text" id="nsOem"></div>'+
    '<div><label>Require EKU (optional)</label><select id="nsEku"><option value="">—</option>'+known.map(([hex,e])=>'<option value="'+hex+'">'+e.name+'</option>').join('')+'<option value="custom">Custom hex…</option></select></div>'+
    '<div class="hidden" id="nsEkuCustomWrap"><label>EKU value (policy hex encoding)</label><input type="text" id="nsEkuCustom" class="m" placeholder="010A2B06..."></div>'+
    '</div>'+
    '<h4 style="margin:14px 0 6px">Limit to specific files (optional — makes it a FilePublisher-style rule)</h4>'+
    '<div class="fform">'+
    '<div><label>OriginalFileName</label><input type="text" id="nsAttrName" class="m" value="'+esc(preset.attrName||'')+'"></div>'+
    '<div><label>ProductName</label><input type="text" id="nsAttrProd" class="m"></div>'+
    '<div><label>Minimum version</label><input type="text" id="nsAttrMin" class="m" value="'+esc(preset.attrMin||'')+'"></div>'+
    '<div><label>Maximum version</label><input type="text" id="nsAttrMax" class="m"></div>'+
    '</div>'+
    '<h4 style="margin:14px 0 6px">Placement</h4>'+
    '<div style="display:flex;gap:14px;flex-wrap:wrap;align-items:center">'+
    '<span class="seg denyallow" id="nsDec"><button class="a" data-v="allow" aria-pressed="'+(preset.decision!=='deny')+'">Allow</button><button class="d" data-v="deny" aria-pressed="'+(preset.decision==='deny')+'">Deny</button></span>'+
    '<label style="color:var(--ink)"><input type="checkbox" id="nsScenU" '+(preset.kernel?'':'checked')+'> User mode</label>'+
    '<label style="color:var(--ink)"><input type="checkbox" id="nsScenK" '+(preset.kernel?'checked':'')+'> Kernel mode</label>'+
    '<label style="color:var(--ink)" title="Mirror into CiSigners (normal for user-mode signers)"><input type="checkbox" id="nsCi" checked> CiSigners</label>'+
    '<label style="color:var(--ink)" title="Allow this cert to sign policy updates"><input type="checkbox" id="nsUpd"> UpdatePolicySigner</label>'+
    '<label style="color:var(--ink)" title="Accept supplemental policies signed by this cert"><input type="checkbox" id="nsSup"> SupplementalPolicySigner</label>'+
    '</div>',
    buttons:[{label:'Cancel'},{label:'Add signer',cls:'primary',keepOpen:true,onClick:h=>{
      const g=id=>{const n=h.querySelector('#'+id);return n?n.value.trim():''};
      const rootType=g('nsRootType');
      let rootValue=rootType==='Wellknown'?h.querySelector('#nsWell').value:g('nsTbs').replace(/\s+/g,'').toUpperCase();
      if(rootType!=='Wellknown'&&(!HASH_RX.test(rootValue)||![40,64,96,128].includes(rootValue.length))){toast('TBS hash must be 40/64/96/128 hex chars','err');return false}
      const scen=[];
      if(h.querySelector('#nsScenU').checked)scen.push({value:12,decision:segVal(h,'nsDec')});
      if(h.querySelector('#nsScenK').checked)scen.push({value:131,decision:segVal(h,'nsDec')});
      if(!scen.length&&!h.querySelector('#nsUpd').checked&&!h.querySelector('#nsSup').checked){toast('Pick at least one scenario or a policy-signer role','err');return false}
      let ekuValue=h.querySelector('#nsEku').value;
      if(ekuValue==='custom')ekuValue=g('nsEkuCustom').toUpperCase();
      const attrib={};
      if(g('nsAttrName'))attrib.FileName=g('nsAttrName');
      if(g('nsAttrProd'))attrib.ProductName=g('nsAttrProd');
      if(g('nsAttrMin'))attrib.MinimumFileVersion=g('nsAttrMin');
      if(g('nsAttrMax'))attrib.MaximumFileVersion=g('nsAttrMax');
      if(segVal(h,'nsDec')==='deny'&&attrib.MinimumFileVersion==='0.0.0.0'&&!attrib.MaximumFileVersion)attrib.MinimumFileVersion=VMAX;
      const sid=mAddSigner(p,{
        name:g('nsName')||'Custom signer',rootType,rootValue,
        publisher:g('nsPub'),issuer:g('nsIss'),oem:g('nsOem'),
        ekuValue:ekuValue&&ekuValue!=='custom'?ekuValue:(ekuValue||''),
        ekuName:(KNOWN_EKUS[ekuValue]||{}).name||'',
        attrib:Object.keys(attrib).length?attrib:null,
        scenarios:scen,
        alsoCi:h.querySelector('#nsCi').checked&&scen.some(s=>s.value===12),
        forUpdate:h.querySelector('#nsUpd').checked,
        forSupplemental:h.querySelector('#nsSup').checked
      });
      afterEdit(p);
      toast('Added signer '+sid,'ok');
      closeModal();
    }}],
    onOpen:h=>{
      const sync=()=>{
        const well=h.querySelector('#nsRootType').value==='Wellknown';
        h.querySelector('#nsWellWrap').classList.toggle('hidden',!well);
        h.querySelector('#nsTbsWrap').classList.toggle('hidden',well);
      };
      h.querySelector('#nsRootType').addEventListener('change',sync);
      h.querySelector('#nsEku').addEventListener('change',()=>{
        h.querySelector('#nsEkuCustomWrap').classList.toggle('hidden',h.querySelector('#nsEku').value!=='custom');
      });
      wireSeg(h,'nsDec',()=>{});
      sync();
    }
  });
}
</script>
<script>
/* ============================================================
   CHUNK G — file inspector & event triage
   ============================================================ */
const EXPORT_EVENTS_PS=[
"$logs = 'Microsoft-Windows-CodeIntegrity/Operational',",
"        'Microsoft-Windows-CodeIntegrity/Verbose',",
"        'Microsoft-Windows-AppLocker/MSI and Script'",
"$ids  = 3076,3077,3033,3034,3089,8028,8029,8036,8038,8039,8040",
"$ev = foreach($l in $logs){ Get-WinEvent -LogName $l -ErrorAction SilentlyContinue |",
"      Where-Object Id -in $ids }",
"('<Events>' + ($ev | ForEach-Object { $_.ToXml() }) + '</Events>') |",
"  Set-Content .\\AppControlEvents.xml -Encoding UTF8",
"Write-Host \"Exported $($ev.Count) events to AppControlEvents.xml\""
].join('\n');
const AH_QUERY=[
"DeviceEvents",

async function loadEventsFile(file){
  try{
    const text=await file.text();
    let items;
    if(/\.csv$/i.test(file.name)||(!text.trim().startsWith('<')&&text.includes(',')))items=parseAhCsv(text);
    else items=buildTriageItems(parseEventsXml(text));
    if(!items.length){toast('No App Control audit/block events found in '+file.name,'err');return}
    App.triage.items=items;
    App.triage.source=file.name;
    App.triage.filter='open';
    setView('triage');
    renderShell();
    toast('Loaded '+items.length+' unique files from '+file.name,'ok');
  }catch(e){toast(e.message||'Could not parse events','err')}
}
function triageTargetPolicy(){
  const T=App.triage;
  return policyByPid(T.target)||activePolicy();
}
function triageAction(it,act,el){
  const T=App.triage;
  if(act==='dismiss'){it.status='dismissed';it.resolution='dismissed';renderTriage(el);renderShell();return}
  if(act==='reopen'){it.status='new';it.resolution='';renderTriage(el);renderShell();return}
  const p=triageTargetPolicy();
  if(!p){toast('Open a policy first','err');return}
  const scen=it.scenario==='131'?[131]:[12];
  if(act==='hash'){
    let n=0;
    if(it.hashes.sha256){mAddFileRule(p,{tag:'Allow',attrs:{FriendlyName:it.fileName+' Hash Sha256',Hash:it.hashes.sha256},scenarios:scen});n++}
    if(it.hashes.sha1){mAddFileRule(p,{tag:'Allow',attrs:{FriendlyName:it.fileName+' Hash Sha1',Hash:it.hashes.sha1},scenarios:scen});n++}
    if(!n&&it.hashes.flatSha256){mAddFileRule(p,{tag:'Allow',attrs:{FriendlyName:it.fileName+' Hash Sha256 (flat)',Hash:it.hashes.flatSha256},scenarios:scen});n++}
    it.status='allowed';it.resolution='allowed by hash → '+p.info.name;
  }else if(act==='deny'){
    if(it.hashes.sha256)mAddFileRule(p,{tag:'Deny',attrs:{FriendlyName:it.fileName+' Hash Sha256',Hash:it.hashes.sha256},scenarios:scen});
    if(it.hashes.sha1)mAddFileRule(p,{tag:'Deny',attrs:{FriendlyName:it.fileName+' Hash Sha1',Hash:it.hashes.sha1},scenarios:scen});
    it.status='denied';it.resolution='denied by hash → '+p.info.name;
  }else if(act==='name'){
    mAddFileRule(p,{tag:'Allow',attrs:{FriendlyName:it.meta.FileDescription||it.fileName,FileName:it.meta.OriginalFileName,MinimumFileVersion:vvalid(it.meta.FileVersion)?it.meta.FileVersion:'0.0.0.0'},scenarios:scen});
    it.status='allowed';it.resolution='allowed by file name → '+p.info.name;
  }else if(act==='pub'){
    const sig=it.signers[0];
    const anchorTbs=sig.issTbs||sig.pubTbs;
    const usingLeaf=!sig.issTbs;
    mAddSigner(p,{
      name:(sig.publisher||it.fileName)+(usingLeaf?' (leaf cert pin)':''),
      rootType:'TBS',rootValue:anchorTbs,
      publisher:usingLeaf?'':sig.publisher,
      attrib:it.meta.OriginalFileName?{FileName:it.meta.OriginalFileName,MinimumFileVersion:vvalid(it.meta.FileVersion)?it.meta.FileVersion:'0.0.0.0'}:null,
      scenarios:[{value:scen[0],decision:'allow'}],
      alsoCi:scen[0]===12,
      label:sig.publisher||it.fileName
    });
    it.status='allowed';it.resolution='allowed by publisher'+(it.meta.OriginalFileName?' + file name':'')+' → '+p.info.name;
  }
  afterEdit(p);
  renderTriage($('view-triage'));
  toast(it.resolution,'ok');
}
